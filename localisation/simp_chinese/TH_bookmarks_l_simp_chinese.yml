#——————————开局——————————#
TH_E_MISTYMOUNT:"帝国迟暮"
TH_E_MISTYMOUNT_DESCS:"妖怪山曾是幻想乡科学改革的先锋，天狗与河童借着先进的科学技术稳居妖怪山霸主的宝座，而玄武川战争却让一切繁荣都遭受重创，也使得天狗与河童的国家联盟产生裂痕，而守矢趁虚而入，一举夺走妖怪山话语权，宣扬着神明的至高无上与科学的无能，然而，守矢却表里不一，实行宗教专制的同时，也利用天狗的元气大伤开启了工业化的进程。\n而在惩戒战役结束后的146季，经济危机再次席卷而来，天狗劳工与新共和运动已经使得天魔王的宝座摇摇欲坠，技师阶层的不断暴动亦动摇着河童长老会的根基，在妖怪山北部，新教徒们也掀起了对守矢宗教独裁的反抗，比结界危机更加猛烈的风暴将席卷整个妖怪山，渴望启蒙的生灵无不对它翘首以盼，而至于一切的结果如何，历史与时间会给出答案。"

TH_E_MISTYLAKE:"红雾升腾"
TH_E_MISTYLAKE_DESCS:"在雾之湖战争过后，红魔馆的吸血鬼们已经在名义与事实上统治了整片环雾之湖区域，并将其作为了自己的内海，在北岸的内陆中央，红魔统治者们挥起皮鞭，以千万妖精奴工的尸骨为地基，利用战利品修建起了专供吸血鬼遗族们居住的泰坦城市————红魔之城，并释放起了绯红浓雾，笼罩着整个雾之湖北岸。\n然而，在崩溃的妖精共和国尸首上，反抗的种子已经生根发芽，惩戒战争彻底将吸血鬼帝国拖入了战争的深渊，在北魔法森林的绞肉机中，忍无可忍的妖精军队揭竿而起，沉默已久的地下势力随之响应，让雾之湖东南地区彻底脱离了帝国的统治。\n鬼人正邪与她的志同道合者们在辉针城重建了下克上的阵营，却因为国内的党派林立而面临着崩溃的危险，而花海的共和国残部正在国内君主主义势力的打压下逐步式微，莉莉白面临着加冕还是共和的抉择。至于斯卡雷特帝国，即便蕾米莉亚乃至整个吸血鬼的野心仍未满足，但帝国腐烂的根基已经在雾之湖妖精联合体的独立号角中愈发破败，幻草原地区也不再安分了起来。"

TH_E_WESTERNSOUTH:"荒原角逐"
TH_E_WESTERNSOUTH_DESCS:"神佑人类全然不同与南方同胞的命运，作为最早实现了工业化的地区之一，大神佑尼亚在征服与掠夺中崛起，逐步成为西南的霸权新星。然而，神佑的残暴丝毫不亚于吸血鬼们，失去土地的农民，妖精妖怪，人偶们都无一例外地都沦为了蓄奴区的奴隶，种族之间的裂痕仍在不断增加，贤者摩多罗看准了时机，支持了神明信仰联盟的农民起义，妖精与人偶们也迅速奋起，把神佑在西南的统治秩序彻底敲碎，如今，幻想乡西南已然是无序的世界，无论是为理想而抗争的游击队，还是劫掠为生的军阀恶狗，都在这片希望与绝望并存的土地上各自占有立足之地，而随着角逐的序幕拉开，鹿死谁手也终会被揭晓。\n神佑共和国也在旧秩序的崩溃中天翻地覆，军官们发动了推翻贵族官僚的军事革命，但各个势力仍旧蠢蠢欲动，红白党的故事同样在这里上演着。"

TH_E_SOUTHGENSOKYO:"幻想黄昏"
TH_E_SOUTHGENSOKYO_DESCS:"在长达三年的惩戒战争中，幻想乡诸势力虽然已经将复权恶魔彻底撕碎，但复权铁蹄所蹂躏的一切却再难以挽回，而作为大人类主义的余毒，妖怪的极端种族主义也在兽道与命莲寺当中崛起，以哈摩尔为首的妖国社党迅速崛起，新生的兽道政坛正被哈摩尔派的阴影所笼罩。即便作为胜利者，命莲寺与神灵庙也难以从一片废墟的国家当中再求希望，失去了所有的人类的教徒之后，他们宗教地位也受到人里新教的不断动摇，改革的呼声日益沸腾，宗教必须从守旧与改变中作出选择。\n人间之里则深陷与赔款与崩溃的泥潭当中，虽然稗田政府勉强稳定了局势，但随着第二次经济危机的到来，人间之里短暂的和平也行将就木，在对败者的残酷肢解中，更加极端的复仇主义正在酝酿着，而待到它再次登上塔尖，江河日下的幻想之乡再也无法阻止它任何变本加厉的暴行。"

TH_B_MAGICFOREST:"森林涂炭"
TH_B_MAGICFOREST_DESC:"无论是魔法使议会的失败统一，还是复权战争的绞肉机，都是魔法森林如今与和平近乎无缘的罪魁祸首，即便是在战后，安宁也从未降临，落后的工业，短缺的物资，一幕幕在焦土尸丛中上演着的惨剧，都是魔法森林如今地狱般现状的写照。\n在送走了斯卡雷特的恶魔们与复权军的疯子们之后，魔法森林的军阀恢复了你死我活的角逐，革新派自拥成军，对式微的魔法使议会发动了极为猛烈的攻势，而以魔理沙爱丽丝为首的和平魔法使们也拒绝对燃烧中的家园袖手旁观，组建了维和阵线，加入了魔法森林的硕大棋局，虽然战事仍旧，但总会有一个势力脱颖而出，整合魔法森林破碎的大地。"

#————————————环雾之湖————————————#
GSE_DAWN_DESC:"大斯卡雷特帝国的前身，原本是斯卡雷特家族在结界危机前后建立起来的湖畔小公国，但随着工业化的大肆兴起，吸血鬼家族也搭上了时代的列车，在旷日持久的扩张当中，斯卡雷特与她们的魔法使仆从们征服了内陆地区，妖精的聚落被愈发强大的红魔馆军队各个击破，到雾之湖战争一役之后，斯卡雷特踏上雾之湖共和国的残破遗骸，在整个幻想乡宣布了其在雾之湖畔的无上霸权，斯卡雷特的领主，蕾米莉亚.斯卡雷特也在新年之夜加冕为帝，从此，燃烧着妖精奴工的帝国机器被建立起来，雾之湖的各族无不俯首称臣，屈服在红魔城的团团猩红之雾下。然而，在南幻想乡的复权疯子蹂躏四方之际，斯卡雷特也企图依靠对复权分子的镇压战争中挽回已经已经遗臭万年的帝国形象，但在魔法森林的战役中，斯卡雷特深陷泥潭，在绞肉机中死里逃生的妖精不再屈从于吸血鬼的奴役，在东岸的工业区扬起了独立旗帜，使得其近乎落败，如今，帝国的根基愈发不稳，也许红魔馆的贵族们早该料到，他们的万年帝国，只不过是一个蓄奴区堆积拼凑的丑陋妖兽，倘若再无任何改变，那么土崩瓦解只是时间问题。"

UMY_DAWN_DESC:"雾之湖妖精联合体在妖精们的国仇家恨之中诞生，在幻草原旧都沦陷的数十年之后，妖精共和国的遗孤们从地下网络中揭竿而起，在旧日领袖琪露诺的带领下，起义的妖精军队斩断了斯卡雷特恶龙的第一截身躯，新的妖精国家便宣告诞生，然而在众义勇北上之际，贤者却又为了避免事端扩大，以雾之湖北岸划界的军事戒严区，阻断了妖精联合体解放故土的行军。\n即便和平与解放短暂归于东雾之湖的幸运妖精们，但在光荣中新生的联合体却出现裂痕，政治势力的角逐随即展开，即便是琪露诺的威望也只能勉强维持现状，但一个事实十分明显，在新兴的众多力量中，终会有一个脱颖而出，掌舵雾之湖联合体的未来。"

RAL_DAWN_DESC:"反叛者同盟本是激进理论家鬼人正邪的一个构想，但在复权战争开始之后，她团结了认同自己新下克上思想的同志们，在辉针城的混乱中夺得政权，并宣布了幻想乡下克上事业的重生，而新的下克上思想将致力于对权威阶层的彻底摧毁与社会公平正义的付诸实施，反叛者同盟虽然立足于革命的美好理想当中，但在魔法森林的战争，反叛同盟的军队却助纣为虐，混乱的军纪，使得这支打着下克上旗帜的正义之师却同复权军与斯卡雷特帝国军的暴行别无二致，即便是下克上执行部也在战争结束后才得知他们的行径。\n在战争告一段落之后，下克上的信徒们纷纷离开已经已经摇摇欲坠的反叛者同盟，与此同时，王政势力与种族主义者们亦卷土重来，但只有鬼人正邪和她的少数伙伴们知道，下克上非一日之春，无论最终结果如何，下克上的战歌仍将继续，直到永远。"

FYP_DAWN_DESC:"雾之湖共和国的历史，在南方将军们的投降书中落下帷幕，仍不愿放弃的格里丝政权残部只能退到花海地区，与莉莉白结成联邦，在落后的花海地区艰苦地流亡着，饥荒再次肆虐，对共和的怀疑，旧时的辉煌最终化为了黄粱一梦，在格里丝死后，共和政体的丧钟也日渐临近，沉默已久的君主党则乘势崛起，宣扬着共和政体的无能，但共和残党仍保有有生力量，一场多年未竟的较量如今即将在花海的大地重新上展开。"


#————————————————妖怪山————————————————#

EOT_DAWN_DESC: "(注：天狗帝国的实际可玩内容为天狗共和国)\n天狗帝国也许是幻想乡中历史最悠久的国家之一，然而在结界危机的影响下，天魔王意识到国家体制的滞后性，为了让统治更加稳固，他支持进行现代化的立宪改革，允许了除了皇室以外的议事机构，团结笼络新兴工厂主以带动工业化，拉拢河童为盟友，确立了妖怪山的新霸权。\n第一次经济危机敲碎了天魔王千年帝业的奢望，劳工运动与学社势力联合起改良立宪派，冲击着千疮百孔的政坛，为了转移国内视线，天魔王也看准了红魔馆入侵雾之湖共和国的时机，拉拢河童发动了入侵新喀尔巴阡的战争，但战争进程亦未如天狗高层想象的顺利，斯卡雷特挫败了妖怪山联军的进攻，并在下玄武川一度僵持，贤者的介入调停与领土割让更是宣告了天魔计划的失败，天狗的霸权从此名存实亡，帝国的社会在第二次经济危机中更加动荡，一场摧枯拉朽的风暴即将在这个失落的国家中降临，无论是天魔王还是大天狗贵族们都不会幸免。"

POK_DAWN_DESC:"(注：玄武川国的实际可玩内容为玄武川共和国)\n玄武川是河童们世代栖息的山中桃源，在依山傍水的生活中，河童的祖先们善于钻研科学技术，结界危机以前的先进科技无一例外皆出自河童一族之手，而随着河童社会逐步分化，垄断农业的长老会与依靠工坊技术生活的技师阶层开始对立起来，长老会为了彻底支配河童技师，不惜借由能源大发现的机会，让外来产品肆意摧毁河童的工坊商业，将土地资源拱手送给天狗与人类的跨国能源企业，长老会的短视逐利，让玄武川国家沦为了妖怪山霸权的经济附庸与血汗工厂，下玄武川之殇更是引起了对长老会卖国行径的义愤填膺，伴随着第二次经济危机，腐朽长老会统治的羸弱国家更是奄奄一息，毫无疑问，长老会的末日已然临近，如果足够幸运，它将先于天狗皇室一步，登上历史的断头台。"

MMS_DAWN_DESC:"守矢国家占据着妖怪山北部以及其山巅区域，各种妖怪，无论是什么种族，都生活在守矢信仰的庇佑之下，神社作为这个国家的根基，在妖怪山颠昭示着无上的神威与奇迹，而结界危机的到来，连着稳定一起，把信仰也摔得粉碎，就连守矢当中也出现了不同的声音，可奇迹又一次————也是最后一次眷顾了守矢一回，妖怪山霸主天狗与被肢解的河童盟友在下玄武川战争中元气大伤，作为神明以及守矢领导者的八坂神奈子在夺走妖怪山话语权后，在这遍地愚昧的土地上开始了艰难的工业化，而于此同时，守矢国家高层也日渐分裂，强硬派制定了严苛的教律宪法，甚至不惜付诸严刑，新教徒在宗教恐怖中深受残害，最后在东部宣布起义，与守矢新城遥遥相望，而对于神力不断流失的神奈子，她必须尽一切手段，哪怕是放弃神明的身份，也要让守矢在外界浪潮的血雨腥风中屹立不倒。"

#———————————————南幻想乡—————————————————#

HRP_DAWN_DESC:"人间之里是全幻想乡最为庞大的人类聚落，也是幻想乡新人类国家的立足之地，当人里的人类们在科学启蒙阳光下尽情沐浴之际，对旧日圈养时光的仇恨也被悄然煽动起来，最终化为复权国家的滚滚燃油，针对幻想乡非人生物的杀戮与奴役机器随之发动，一度肆虐南幻想乡，但在幻想乡的空前团结之下，复权分子最终也身首异处，稗田政府重新掌舵了人里局势，但巨额赔款与被军国经济近乎摧毁的工业紧紧压迫在劫后余生的人里社会之上，劳工运动与共产主义者的怒吼让财阀集团惶惶不安，社民党与民众党民主自由的口号从来不绝于耳，与此同时，复权余孽也将残躯缩回水沟中，酝酿着新的复仇计划，归化分子则开始了对妖怪种族派的献媚，人间之里————这艘承载着半亿人类的诺亚方舟正在暴风雨中日夜飘摇，唯独不变的事实是，人间之里的人类们偷食了外界的伊甸禁果，自然要付出相应的代价。"

MBS_DAWN_DESC:"命莲国家曾是幻想乡最大的佛教圣地，由圣人僧侣圣白莲建立，命莲寺接纳着不同种族的教徒，无论是妖怪还是人类，都在寺庙中诵读经文，或是共同尊听住持的教诲贤语，在闪耀着佛法光芒的命莲土地上，没有人会想到这乌托邦般的日子竟结束得如此之快。伴随着结界危机带来的灵力饥荒，即便是再虔诚的妖怪僧侣也不得不破戒，回到了远古时代对人类的捕食与猎杀，跨时代的悲剧种子从此种下，即便是圣的威望也无法再把教徒们团结在一起，在内耗与混乱中，命莲国与进步的机遇擦肩而过，更无法再对复权军的黑色洪流作出任何抵抗，幸运的是，命莲寺赢得了这场战争，但她早已不是那个纯洁的佛家国度，而是遍布着仇恨，邪教与杀人犯，分裂与革新的声音终日回荡在曾经空灵宁静的殿堂中，佛陀的圣光日渐暗淡，只待未来某一天，能够再有人擦开附在命莲寺表面的悉悉灰尘，将命莲的大爱与包容重现于幻想乡世间。"

UNY_DAWN_DESC:"兽道联合国是南幻想乡在惩戒战争之后成立的妖怪国家，虽然兽道原本只是一个松散的妖怪聚落，但复权军的到来变相地改变了这样的局面，各异的兽道妖怪种族开始联合起来组织抵抗，尽管在人类新军的先进武器下，零星的抵抗显得无济于事，但兽道妖怪的族群认同正是在这个时候开始形成，而随之而来的极端反人类主义也在兽道的种族主义团体中形成，在兽道独立建国后，这种思想的余毒不幸地流入了新生的兽道政坛，以妖国社党为首的党朋将之奉为神圣信条，即便是在战后，兽道国家也没有迎来更稳定的社会，兽道的议会改革在经济危机中流产，对新共和制与改良主义的怀疑亦不绝于耳，落后的工业，刚朝着开化迈向第一步的兽道社会，今后将何去何从呢，是在复仇的烈焰中再造恶性循环？还是在改革中平稳过渡？抑或是，在潜伏着的超进步派手上朝着时代大踏步行进呢。"

NFU_DAWN_DESC:"花田地区是南幻想乡多个种族的摇篮，也是南幻想乡革新潮最初降临的国家之一，比起命莲寺与神灵庙宗教保守势力的不闻不问，花田积极地参与了幻想乡社会的大革新，而旧日支配着花田风见家族也不得不避免更大的混乱而为新共和政府腾出位置，但作为其隐退的条件，风见家必须拥有对军队的一半控制权，新花田统一邦就在这样的相互妥协中建立起来，完成了工业化与新科学思想的普及，而在经济危机中，花田虽然也遭受打击，但是新政府的新政挽救了这一切，让花田挺过了萧条与动乱，也在后来的复权战争中得以保持中立，在战后也保持着稳定的发展，但，花田的好运似乎正在漫长的时光中逐步消耗着，来自西南与东部的难民潮冲击着花田的各族，而在难民当中，来自命莲的极端分子也跻身其中，在花田久日安宁的土地上制造着动乱，恐怖与不安，而政治的天平也不再偏向改良派的一方，而在他们的明争暗斗的同时，风见家正在失去耐心，稳定，始终是需要有所代价的。"

TIR_DAWN_DESC:"九十九地区原本是付丧神的一个聚落，曾与人类保持着良好的关系，但财阀们对此地劳动力的觑视却永远地改变了两族的关系，人类开始经常绑架边境付丧神妖怪，送到财阀们的黑工厂中沦为奴工，而在复权会上台后，付丧神们的苦难才刚刚开始，复权军在踏平了他们祖辈生活的土地后，建立起了吞噬无数付丧神劳工的钢铁巨兽，崛川雷鼓的游击队则组织了长达三年之久的抵抗运动，而在复权会的最终倒台以后，付丧神才以新的姿态获得了独立，并继承了九十九以及人里西北部的全部工业，工业共和国便宣告成立，但九十九仍需要面临着沉重的战后重建，以及国内的党派角逐，一面监视着战败人类的一举一动，况且，这是一个在火药气息中诞生的国家。"

DFS_DAWN_DESC:"神灵仙界国是幻想乡最南部地区的宗教国家，在幻想乡大革新之前，神灵庙与命莲寺曾经常进行争夺信仰的宗教之争，而当新科学将人类的宗教崇拜冲刷得一干二净之后，两股宗教实力不得不结成了怪异的同盟，抵制新科学对宗教信仰的打击，也反对人里新兴的新主教，但盲目的抵制让神灵庙同命莲国家一般落后于时代的潮流，在发达的人类面前显得手无缚鸡之力，而神灵仙界国在复权战争中的大溃败也证明了这一点，在失去所有的人类教徒后，神灵庙也开始进行了闭关反思，而在他们的反思之后，会出现什么样的变革，都未曾有人知晓。"

HKC_DAWN_DESC:"博丽神社，曾是幻想乡举足轻重的机构，无论是巫女还是巫师,都在与贤者的契约下负责维护着人与妖怪的脆弱平衡，自然而然，随着大结界弱化,巫师与巫女的法力再无半点用武之地,只能任由工业化与科学的普及把自己的职务埋没在历史当中，博丽的法师们或是回归普通人类，或是归顺于妖怪，新的社会在博丽建立起来，逐步离开了神社的支配，然而，没有任何变革不伴随着暴力与流血的代价，博丽在复权战争中当叛了修曼尼亚的人类们，并协助贤者的妖怪军队对其发动致命反击，恼怒的复权军即便在溃败之际，也对博丽地区狂轰乱炸，包括博丽神社在内的大多数建筑都在炮火中化为废墟，而妖怪们也未曾对博丽的协助感激涕零，而是将其冷落，在幻想乡的边缘地带，从轰炸的断壁残垣中走出来的博丽人类只能依靠自己的力量，修复神社，重建家园，忍受着西边同胞的白眼，也面临着逐步崛起的兽道的威胁，无论如何，博丽的故事也许将在乱世中告一段落，但博丽人的故事仍在继续着。"

#——————————————————西南幻想乡——————————————————#
 ROG_DAWN_DESC:"神佑国家在西南人类聚落抵御妖怪的历史中诞生，在北部的丰腴土地上，神佑人的祖先以农业为生，在漫长的开垦与劳作中建立了神佑城市，并尊奉西南的农业神明，而在结界危机之后，神佑尼亚的金色家族们组成了国家联盟，建立了第一共和国，在对外界的学习中发展了工业，建立了强悍的军队，在高涨着的劳动力需求中，金色家族们将征服之靴踏上了西南各种族的土地上，漫长的殖民随之开始，神佑的传统农业也深受工业的挤压，农民在时代的潮流里被卷入牺牲者的行列中，大多沦为同种族蓄奴区奴隶一般地位的奴工，随着整个西南地区屈服在神佑的淫威之下，金色家族的压迫变本加厉，种族之间，阶层之间，矛盾冲突早已不可调和，在贤者的介入下，农民起义的第一根导火索被点燃，蓄奴区纷纷独立，神佑共和国的统治秩序便土崩瓦解，而在神佑最后盘踞的土地上，金色家族的末日也已经降临，军官改革派发动了推翻贵族政权的军事革命，第一共和国时代就此告终，而在重生的神佑第二共和国当中，新的思潮也在暗流涌动，新的动荡即将降临到这个国家头上。"

 UOF_DAWN_DESC:"历史简介神明信仰联盟是农业神明秋姐妹领导建立的农民起义组织，贤者摩多罗的帮助下，神明信仰联盟团结了对神佑效役政策不满的大部分农民，打响了抵抗神佑殖民秩序的第一枪，大部分偏袒农民起义的神佑军队向联盟倒戈，起义军以摧枯拉朽之势将神佑的总督区政府赶出了东南妖怪山，在旧殖民地一片混乱之际，神佑只能与起义军议和，胜利的天平似乎已经全然倒向联盟一边，但是，联盟在短暂的联合之后却开始出现裂痕，东部的起义军开始宣布独立，村落的自治区与神社地区也自立为阀，三河土匪也撕裂了联盟的土地，唯余东南妖怪山的联盟中心仍然屹立着，但十分明显的是，秋姐妹农业神明的威望已经不足以维持日渐松散的起义农民联盟，建立新国家的呼声也日渐高涨，改组与重建的任务迫在眉睫。"

 SMF_DAWN_DESC:"同雾之湖与地狱的同胞们一样，在西南的辽阔疆域,也栖息着为数众多的妖精聚落，但他们却未必像雾之湖的同胞们那样繁荣昌盛，虽然在后来，妖精们也作出了初步的统一尝试，但不幸的是，神佑的征服打碎了妖精的建国理想，妖精们早早地戴上了神佑人类的镣铐，从事着最为下贱与低级的流水线工作，妖精的未来看似就这样暗无天日，但在妖精的地下党中，抵抗的火光依然存在，直到神佑旧秩序崩溃的那一天，西南妖精解放阵线从坟墓中崛起，将妖精同胞们团结在新妖精国家的旗帜之下，在起义军的进攻之下，神佑军纷纷弃盔卸甲，向西败退，正当阵线的妖精们沉浸在独立与解放的喜悦之际，命运却又将厄运的废爪伸向了西南的妖精们，本与解放阵线结盟的新人偶兰与神授国军阀相互勾结，偷袭了西南中部的阵线总部，将解放阵线拦腰斩断，桑尼.米尔克的游击队留在琉璃湖畔，而阵线的总部则南迁至无名之丘，即便阵线在巨变中近乎崩溃，但在当叛中遭受沉重打击的妖精起义者却从未消沉，她们仍在寻求时机，将压迫者与军阀走狗们赶出西南的沃土。"
 
 NPK_DAWN_DESC:"新人偶兰这个名字的背后，是来自魔法森林的卑微种族漫长迁徙的苦难历史，早在结界危机之前，阿里曼家族就带领着在魔法森林饱受排挤的人形们一路西行，最终在西南的丰美土地上安顿栖息，新人偶兰由此建立起来，而人偶们未曾安宁多日，神佑的钢铁巨兽就开进了新人偶兰的疆土，尽管阿里曼王朝拒绝向金色家族屈服，但神佑还是摧毁了新人偶兰近乎原始的近战军团，并将此地纳入了共和国的版图中，阿里曼家族也惨遭清洗，只能四处流亡，而当西南的起义枪声打响之际，阿里曼家族的后代回到了饱受摧残蹂躏的新人偶兰土地上，召集起深受神佑奴役压迫已久的人偶子民，打响了人偶的独立战争，在神佑的节节败退之下，阿里曼家族重新回到了新人偶兰的舞台，一切看似都在向好发展，但是在如今军阀混战的西南，新人偶兰要想有足够安宁的立足之地，就需要在角逐之中寻求中庸之道，但如果有必要，新人偶兰将主动出击，瓦解任何企图玷污人偶们应许之地的死敌。"

 SLG_DAWN_DESC:"在西南的千万故事中，有窜动着的希望火光,也有绝望的暗淡灰烬，而桑尼.米尔克的游击队则介于这两者之向，作为解放阵线的核心成员，桑尼虽然对新人偶兰与神授国的入侵及时反应，却没能抵抗两军阀的强大攻势，与南方的阵线总部断联。如今，无论是西边的河童技官疯子，还是东面的反动佛陀，光游击队都必须接受这个结果，孤独地在琉璃湖畔与恶势力与极端分子作着艰苦卓绝的斗争，而即便四处受困，游击队也不会忘其解放西南妖精的初心，无论胜算如何渺茫，她们注定要为西南的战乱历史填上浓墨重彩的一笔印记。"

 NKI_DAWN_DESC:"新玄武川研究所，也许称不上是一个国家,甚至称不上一个军阀，而是仅仅由寥寥科学研究人员与武装保安人员组成的委员会组织，但是，他们却依然能够在西南的角逐恶地享有一片立足之地。研究所科学家们的前身，都是玄武川国家科学院的科研所人员，然而，伴随着长老会的卖国政策一起，玄武川科学院也因为外来技术企业的排挤，而遭到取缔，科学院一切具有宝贵价值的研究项目都夏然而止，仍不甘心的科学院技官团体带着为数不多的研究成果离开了这个腐败至极的国家，来到了琉璃湖畔，继续从事着科学研究，只不过，自从他们来到西南琉璃湖畔开始出现不同程度的人类或妖怪的失踪事件，以及在琉璃湖发现的高污染物质，都让新玄武川饱受争议与怀疑，但只有研究所知道，科学只有不择手段，才能创造伟大与不朽，只要理性得胜，只要智慧得胜，哪怕幻想乡灭亡。"
