MMS_yasakakanako:"八坂神奈子"
MMS_yasakakanako_traits_1:"守矢国家领袖"
MMS_yasakakanako_traits_2:"微律者"
MMS_yasakakanako_desc:"守矢神社的第二神明，八坂神奈子，如果依据传说，她的历史可以追溯到公元之前，是幻想乡最早的神明之一，在结界危机后不久，她与前守矢神明洩矢诹访子将守矢神社迁到了妖怪山北部，并利用神力谋得了北妖怪山各族的信仰，使他们得以团结为守矢国家，与包括贤者在内的大妖怪神明不同，八坂神奈子并非迂腐保守的神明，这也和她对外界科学的兴趣有所联系——尽管对这一力量的瞻仰相当于对神明信仰的自杀，她仍旧提出利用科学的力量与神力相配合，还赢取更多的信仰。\n\n她一度同情红枫党人争取天狗科技普及的运动，但是仍然反对他们对王权和秩序的动摇与破坏。到后来，她与河童的一些技师交涉甚多，她也支持了河童技师们的大规模工业项目，但被贤者叫停。\n\n此后她一直将注意力放在维持守矢的信仰与秩序上，但即便是自称为“技术之神”的她，却被裹挟进了结界危机这场百年未有之大变局当中，她的神力在不平衡中随风消散，守矢治下的妖怪们也饱受饥荒折磨，如今的她从守矢的神明，已经沦落为话事人一样的地位，可好在旧日权威的影响下，神奈子仍旧具有号令全国的能力，在天狗帝国拖着刚从下玄武川沼泽中挣脱出的疲惫躯体回到妖怪山之际，神奈子开始了对守矢国家的大改造，尽管她对共和制毫无兴趣，但她仍旧引进了大部分官僚职员组建政府，以让守矢的政治看起来更加现代化，而另一个矛盾的事实又摆在她的面前，她必须让国民从对守矢信仰的迷信中挣脱出来，走上工业现代化的道路，而她作为守矢的旧神，却是亲自号令这一切的人，这样的矛盾也让守矢的旧高层日渐分裂，但神奈子没有别的余地，她已经认识到了一个事实——她从一开始就只是一个得到奇迹的幸运儿，否则她和普通的妖怪和人类都没有任何区别。\n\n只不过，有一点仍未改变，她现在是守矢无可置辩的领袖，而呼风唤雨并不是显现神明权威的唯一手段——正如她的主张一样。"

