#——————————诹访国——————————#
MMS_moriyasuwako:"洩矢诹访子"
MMS_moriyasuwako_traits_1:"诹访之神"
MMS_moriyasuwako_traits_2:"维则者"
MMS_moriyasuwako_desc:"对于守矢的旧神，洩矢诹访子来说，千年岁月与作为神明的海枯石烂之寿远远不值一提。她并非与政治毫无关系，在久远时代，她曾经建立了以自己信徒为主的神明国家，也就是诹访国，只不过在她神威庇佑下远古乌托邦并未长久，作为大和神明的八坂神奈子以及其他神策划了对其国土的入侵，并最终得逞，她也被迫交出了王国的领导权，让神奈子接手了国家，但由于信徒的持续抗拒与起义，诹访国家始终处于动荡当中，而作为能够团结起信徒的诹访子便理所当然地重新被请回了王国，只不过这一次，她成为了神奈子的影子，协助其治理国家。而随着外界人类的崛起，诹访国家的外界土地也不断被挤压，最终走向了灭亡，而两神明也不知所踪。\n\n只不过，在大结界建立之后，千年未曾露面的二神来到了“神隐”了的幻想乡大陆，她们重建了神明信仰的根基，即守矢信仰，重新在妖怪山北部地区获得了信仰与支配权，最终建立了守矢的宗教国家，而二神仍保持着旧时诹访国的传统，洩矢诹访子本对外界技术毫无兴趣，但神奈子所谓能够帮助其赢得更多信仰的说辞也让她半信半疑。红枫党的出现让她有了些许不安——尤其是当他们公开反对天魔王统治的时候，可神奈子却表现出了截然不同的态度，两神自诹访战争后的结盟关系于是开始出现了裂痕。\n\n而未来某种程度地证明了她不安的来源，结界危机不仅夺走了她天马行空的神力，更夺走了她作为神灵的自尊，但很快，一个比起信仰流失更加可怖的真相又浮出水面，那就是她们千年以来所认为的自己赖以身存的信仰，实际上只不过是一个跨越上古时代的误会罢了，信仰与神明之间并没有直接的联系，神明的本质也只不过是受祝的妖怪罢了。\n\n可是，这根本不可能，诹访国的伟业，千年的神寿与信仰，难道除了伟大的诹访之神以外，就没有人亲自看见神力恐怖下的世外天堂？凭什么，凭什么这个维系了万年宗教的纽带现在必须是谎言呢？诹访子百思不得其解，却没有任何东西能帮助她再找到答案——哪怕是精神药物，但她仅存的理智告诉她，绝不能与神奈子和她的所谓改革同流合污，她早已背弃了作为神明的原则，而她大概也知晓了如今礼崩乐坏的守矢社会走向堕落的根本原因————那就是信仰的被亵渎。八云紫是对的，失去了众神的平衡，幻想乡肯定会走向崩溃与灭亡，而外界的奇技淫巧则都是造成人们丢失信仰的罪魁祸首。\n\n是时候了，把所谓灵能科学的异端学说通通抛开，要重现诹访国的昔日辉光，就要让对守矢，对诹访神明，对她的全能，她的智慧，她的恐怖——重回每一个皈依守矢庇佑领地的国民心中，让他们重新相信神明的存在，重新相信她的存在，重新相信她的神圣与不可侵犯，而诹访国也将同贤者们一同，成为这崩塌之灾中力挽狂澜的弥赛亚，而自此之后，信仰与神威，将重新庇佑幻想乡的每一寸土地，直到永远。"




