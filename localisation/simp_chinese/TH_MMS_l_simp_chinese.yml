#——————————改良———————————#
MMS_kochiyasanae:"东风谷早苗"
MMS_kochiyasanae_traits_1:"北妖怪山共和国总理"
MMS_kochiyasanae_traits_2:"迹现者"
MMS_kochiyasanae_desc:"东风谷早苗的身世曾充斥着神秘与阴谋的色彩，但无数的疑问最终都指向一点，那就是她并不是幻想乡土生土长的巫女，她被认为是神隐事件的一个最为显著的例子，也有人说她遭到了守矢神的绑架——只不过这一观点在东风谷早苗对守矢二神的忠诚面前则不攻自破了。\n\n东风谷早苗在外界曾是守矢遗教为数不多的信仰者之一，也正是这一点的缘故，守矢的神明才找上了她，邀请她成为守矢的巫女话事者。鉴于对目前生活处境的厌恶，她毫不犹豫地接受了进入幻想乡的请求，并受祝成为了守矢的巫女，而在守矢国家中，东风谷早苗也成为了仅次于二神的举足轻重之人物，但她的对信仰的态度明显开明得多，虽然她皈依了守矢的信仰，但她在外界接受过科学思想的教育，这也使得她并没有过于唯心的宗教观念，这也让她对神奈子支持科学技术的观念持赞赏态度。在幻想乡的异变时代，她也代表守矢，同博丽争夺异变的镇压权，以争夺幻想乡的话语权，只不过在此不久之后，更大的危机冲击了幻想乡。\n\n结界危机几乎摧毁了守矢的宗教霸权，但相比起受到重创的二神，东风谷早苗始终力图让守矢顺应新时代的浪潮，她认为结界危机是重塑守矢宗教的机会，但守矢宗教高层的观点则与之格格不入。在整个国家的艰难挣扎中，高层早已分裂为三个势力，而东风谷早苗无疑成为了其中改革派的代言人，即便她支持彻底改革重组，她却仍旧放不下对昔日德高望重的守矢神明的敬仰——尽管她们如今已经沦为各自实力所掌舵的提线木偶，但东风谷早苗无疑十分清楚自己的使命，她必须从幻想的泡影中走出来，面对千疮百孔的守矢之国，无论是新政还是共和，是世俗化还是民主化，她都会全盘接受，要使信仰之物不为虚幻，就务必需要面对现实。"



