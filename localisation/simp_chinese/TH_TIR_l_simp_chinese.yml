TIR_99_fight:0 "九十九共和国国家议会"
TIR_99_fight_desc:0 "\n\n£99_fight_texticon£\n\n\n\n\nY九十九工业共和国国家议会。!\n以下简称4共和议会!，是我国的最高权利机构，也是集中体现人民意志的最高机关。\n\n议会诞生于独立战争后的民主建设时期，由R堀川雷鼓!、t九十九姐妹!及革命战争时期g其他派别!共同协商组建。\n第一届共和议会通过了关于《独立战争后建设方案》草案等一系列决案，并任命R堀川雷鼓!为九十九工业共和国第一任总统，赋予其组阁权等权利。\n\n然而，在总统的第一个任期内，各种问题排山倒海般接踵而至，将整个新生的共和国搅成t一团乱麻!……\n而如今，在共和议会内，t激进主义!势力抬头，更有甚0极端主义者!，妄图以军事政变等手段，夺取国家政权！\n无论在4第二届共和议会!到来前，会有什么样的变动，这个年轻的国家都要做好面对翻天覆地之变化的准备了。\n\n目前，九十九工业共和国国家议会内各派系情况：\n———————————————————————————————————————\nR·建制派!\n               代表人物：\nR堀川雷鼓!（九十九工业共和国总统）\n               影响力：\n             G如雷贯耳!\n\nt·革命派\n!               代表人物：\nt九十九八桥!（全国付丧神劳工总工会总理）\nt九十九弁弁!（第1独立民兵师师长）\n               影响力：\n             O有所听闻!\n\n6·改良派!\n               代表人物：\n6多多良小伞!（幻想乡协作国际成员）\n               影响力：\n             R无人听闻!\n\nL·国民阵线\n!               代表人物：\n8纸灯幽!（付丧神法团党元首）\n0琦木千璃!（民兵组织“清洁团”领袖）\n               影响力：\n                  g未知!\n———————————————————————————————————————\n\nR总统!目前的心理……G自信满满。!\n\n"




















































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































