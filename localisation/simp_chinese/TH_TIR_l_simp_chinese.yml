TIR_horikawaraiko:"堀川雷鼓"
TIR_horikawaraiko_traits_1:"全付丧神共和国总统"
TIR_horikawaraiko_traits_2:"凯旋烈鼓"
TIR_horikawaraiko_desc:"作为千万付丧神中的其中一个，生活在外南雾之湖的堀川雷鼓也许从未有过能够在历史中添上一笔的机会。作为聚落中的音乐家，她在曾无数地方奏乐卖艺，或是招手门徒以维持其生计，虽然平淡的生活日复一日，付丧神们却始终无法无视一个事实——他们从来都是南幻想乡当中最底层的那一批妖怪，即便是被恐惧影响的人类也能够对之指手画脚，而这一切，亦是堀川雷鼓的眼中钉，肉中刺，但她知道，即便自己的鼓声如雷贯耳，付丧神一族的交响乐也无法掀起巨浪。在苦闷与不平当中，来自辉针城的异变让所有饱受欺压的付丧神族眼前一亮，而下克上的理念也是在这时深入了诸人的心中——这当中正包括堀川雷鼓，她同其他鬼人正邪的追随者们来到了辉针城，参与了与巫女巫师的战斗，但在以失败告终后，雷鼓只能回到家乡隐居起来，尽管郁闷再次占据了内心，但她始终在寻求着东山再起之机会。\n灵能饥荒让本就落后的付丧神们的生活雪上加霜，一众流离失所当中，人类工厂主们乘虚而入，而付丧神的长老们则把种族的未来拱手相让，同人类主子们一起，贪婪地吸食着付丧神劳工们的血汗，看着同胞们在生产线上为了零星的灵能供应而彻夜劳作，雷鼓同样也不允许像这样的悲剧继续在付丧神种族中上演，为了寻求救国之道，她只能来到处于革新中心的人间之里，同情劳工的她与人间之里新兴的共产主义团体走得越来越近，并加入了他们的早期社团，但她很快发现，人类的理论并不能在付丧神社会立刻凑效，于是她回到了家乡，创立了社会党，以罢工和抗议声讨着财阀与长老们的剥削恶行。\n但付丧神的未来却从未因此改变，复权会的掌权改变了南幻想乡的历史，而复权军也将开始成为南幻想乡妖怪们挥之不去的梦魇，在家乡遭到偷袭之后，堀川雷鼓带领社会党转入地下，发起了对复权铁蹄的游击战，反抗的隆隆鼓声开始回荡在修曼属九十九地区的四面八方，复权会高层对她咬牙切齿，进行了无数次的明刺暗杀，但雷鼓却从未遭到分毫伤害。三年的游击战，让雷鼓和她的同志们愈发坚韧，终于，社会党与南幻想乡的其他妖怪抵抗者一起，彻底埋葬了为非作歹，恶贯满盈的复权魔鬼，而长老会也随之一同被推倒，新的付丧神共和国在九十九城宣布成立。\n而作为救国英雄，共和国国母的她，也被爱戴她的诸付丧神群众众星拱月，但这远不是她喘息的时候，无论是重建与党争，共和国的一切都任重而道远，而即便是她自己也感受到，如同美酒与蜜饯般的赞美与崇拜，都是如此诱人。大权在握或继续斗争——如同恶魔的怂恿与天使的进谏，一同在她的脑海中回荡着。"

