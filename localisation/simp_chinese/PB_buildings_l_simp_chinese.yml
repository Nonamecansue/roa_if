l_simp_chinese:
 infrastructure:0 "基础设施"
 infrastructure_plural:0 "基础设施"
 infrastructure_desc:0 "此建筑将改善所属地区的基础设施状况，提高您在战略要地的后勤能力及您的陆军部队在本地区的移动速度，并提升此地区的基础资源产出。"
 arms_factory:0 "军用工厂"
 arms_factory_plural:0 "军用工厂"
 arms_factory_desc:0 "此建筑可为所属地区提供生产军事装备的工业能力，或可因需转换为民用工厂。"
 dockyard:0 "海军船坞"
 dockyard_plural:0 "海军船坞"
 dockyard_desc:0 "此建筑可为所属地区提供建造新舰船的工业能力。"
 industrial_complex:0 "工业园区"
 industrial_complex_plural:0 "工业园区"
 industrial_complex_desc:0 "此建筑可为所属地区提供生产民用商品或建造新建筑的工业能力，或可因需转换为军用工厂。"
 air_base:0 "空军基地"
 air_base_plural:0 "空军基地"
 air_base_desc:0 "此建筑可为所属地区提供部署空军飞行器的场所。"
 naval_base:0 "海军基地"
 naval_base_plural:0 "海军基地"
 naval_base_desc:1 "此建筑可延长您的舰队航程，可进行舰船维修，同时也用于海外后勤补给以及资源出口。海军基地可随等级的提升增加补给吞吐量。"
 bunker:0 "陆上要塞"
 bunker_plural:0 "陆上要塞"
 bunker_desc:0 "此建筑可在战斗中对进攻方造成基于建筑等级每级$VALUE|+%0$的进攻惩罚。同时受到来自多方向的攻击时则会降低要塞效果。"
 coastal_bunker:0 "海岸要塞"
 coastal_bunker_plural:0 "海岸要塞"
 coastal_bunker_desc:0 "此建筑可在登陆作战当中对进攻方造成基于建筑等级每级$VALUE|+%0$的进攻惩罚。"
 anti_air_building:0 "防空火炮"
 anti_air_building_plural:0 "防空火炮"
 anti_air_building_desc:0 "此建筑可为所属地区面临轰炸机来袭时提供保护，并对敌军飞行器发动打击。"
 synthetic_refinery:0 "合成炼油厂"
 synthetic_refinery_plural:0 "合成炼油厂"
 synthetic_refinery_desc:0 "此建筑可为所属地区提供"
 synthetic_refinery_amount:0 "$VALUE|Y0=$"
 synthetic_refinery_resource:0 "£resources_strip|$FRAME$"
 radar_station:0 "雷达站"
 radar_station_plural:0 "雷达站"
 radar_station_desc:3 "雷达可使您获得邻近地区的敌军部队情报。\n提高所属地区的雷达站等级，便可增加雷达的有效距离。\n雷达也能为其所属地区提供更好的对空侦察能力，使您的战机接敌时更占优势。\n此外雷达还会提升对海监测敌方舰队的能力。"
 rocket_site:0 "火箭基地"
 rocket_site_plural:0 "火箭基地"
 rocket_site_desc:0 "此建筑可为所属地区提供部署火箭的场所。"
 nuclear_reactor:0 "核反应堆"
 nuclear_reactor_plural:0 "核反应堆"
 nuclear_reactor_desc:0 "此建筑可为所属地区提供用于制造核武器的浓缩铀的生产能力。"
 farm:0 "农业综合设施"
 farm_desc:0 "该建筑可改善邻近地区的粮食供给状况，提供额外的农业资源。"
 medical_center:0 "医疗中心"
 medical_center_desc:0 "此建筑可改善邻近地区药品供给水平，每周需要消耗一定人力维持但可减轻单位受损时的经验损失。"
 research_center:0 "科研中心"
 research_center_desc:0 "此建筑可改善临近地区的科研水平，每周需要消耗一定人力维持运转同时提供微小研究加成。"
 colonial_outpost:0 "殖民地哨站"
 colonial_outpost_desc:0 "此建筑可为我们的事业募集人员，每周需要消耗一定人力维持运转但可增加当地非核心人力。"
 steel_mill:0 "合成矿物厂"
 steel_mill_desc:0 "此建筑可生产少量合成矿物资源，通过技术研究解锁。"
 tesla_tower:0 "特斯拉线圈塔"
 tesla_tower_desc:0 "此建筑允许一个地区连接到全球无线电网，一个提供无线电源的便利系统。未接入该网络的地区将受到工业产能和补给能力的减益。"
 fuel_silo:0 "储油罐"
 fuel_silo_plural:0 "储油罐"
 fuel_silo_desc:0 "此建筑可为你的国家储存更多的§H燃油§!。"
 dam: "大坝"
 dam_plural: "大坝"
 dam_desc: "水坝为地区提供额外的电力，提高工业和资源产出。"
 dam_mountain: "$dam$"
 dam_mountain_plural: "$dam_plural$"
 dam_mountain_desc: "$dam_desc$"
 canal_kiel: "基尔运河船闸"
 canal_kiel_plural: "$canal_kiel$"
 canal_kiel_desc: "为了使运河满负荷运行，基尔运河船闸至关重要，破坏它们将会半永久地妨碍运河的航运和交通。"
 canal_panama: "巴拿马运河船闸"
 canal_panama_plural: "$canal_panama$"
 canal_panama_desc: "为了使运河满负荷运行，巴拿马运河船闸至关重要，破坏它们将会半永久地妨碍运河的航运和交通。"
 nuclear_reactor_heavy_water: "重水核反应堆"
 nuclear_reactor_heavy_water_plural: "重水核反应堆"
 nuclear_reactor_heavy_water_desc: "此建筑可为所属地区提供用于制造核武器的浓缩铀的生产能力。\n使用重水的核反应堆比石墨反应堆建造成本更低，但产出的可用于核武器生产的材料更少。"
 commercial_nuclear_reactor: "民用核反应堆"
 commercial_nuclear_reactor_plural: "民用核反应堆"
 commercial_nuclear_reactor_desc: "此建筑不仅为国家提供用于制造核武器的浓缩铀，同时也为民用经济的发展提供电力。"
 nuclear_facility: "核研究设施"
 nuclear_facility_plural: "核研究设施"
 nuclear_facility_desc: "核研究实验设施允许你启动与利用核能有关的研究项目。"
 air_facility: "空气动力学与航空电子研究设施"
 air_facility_plural: "空气动力学和航空电子设施"
 air_facility_desc: "空气动力学和航空电子研究设施允许你启动飞机、火箭和相关电子产品的研究项目。"
 naval_facility: "海军工程设施"
 naval_facility_plural: "海军工程设施"
 naval_facility_desc: "海军工程实验设施允许您启动与水面舰艇和潜艇相关的研究项目。\n海军工程只能在沿海省份创建。"
 mega_gun_emplacement: "多级加速大口径火炮"
 mega_gun_emplacement_plural: "多级加速火炮"
 mega_gun_emplacement_desc: "这种大口径火炮采用多装药推进原理，旨在实现无与伦比的轰炸射程。它利用一系列地下隧道，将炮弹加速到超音速，然后将其发射到远处的目标。"
 stronghold_network:0 "要塞群"
 stronghold_network_plural:0 "要塞群"
 stronghold_network_desc: "这是一处由大量地堡与坚固阵地组成的广泛的防御系统，其主要使命在于击退来犯之敌，以及确保关键战略区域的安全。"
 land_facility: "陆战设施"
 land_facility_plural: "陆战设施"
 land_facility_desc: "陆战实验设施允许您启动与陆战各个方面相关的研究项目，例如特殊坦克或火炮。"
 biochem_facility: "生物工程与化学设施"
 biochem_facility_plural: "生物工程与化学设施"
 biochem_facility_desc: "生物工程和化学实验设施使您能够启动与生物体、化合物和增强相关的研究项目。"
