GSE_remilia_scalert:"蕾米莉亚.斯卡雷特"
GSE_remilia_scalert_traits_1:"全吸血鬼的霍利.斯卡雷特一世皇帝"
GSE_remilia_scalert_traits_2:"绯红暴君"
GSE_remilia_scalert_desc:"蕾米莉亚.斯卡雷特，或者，伟大而至高无上的神圣斯卡雷特一世皇帝，统治着囊括北雾之湖及幻草原广袤土地的泰坦帝国——大斯卡雷特帝国的巅峰主宰，也许她只是在138的新年之夜之后，才得到从雾之湖妖精和妖怪山所攫取的战利品所铸造的圣座。\n\n可谁曾想过呢，在百年前吸血鬼大族衰亡的动乱当中，蕾米莉亚与其妹芙兰朵露带着残存的族人四处逃窜，最终才在雾之湖北岸的一座洋馆中隐居起来——屈辱地，斩断与先前任何繁荣的关系。她每一天都望着蜷缩在红魔洋馆角落的族人，恐惧地想逃避阳光的魔爪。即便吸血鬼的生命足以持续到雾之湖干涸，忍辱负重的折磨却难以再让吸血鬼们承受百年，再显赫的豪族洋馆，也早已无法再承载吸血鬼一族的宏伟野心。\n\n作为斯卡雷特家族的领袖，蕾米莉亚于是决定不再逃避，吸血鬼必须从洋馆的舒适圈迈出第一步，于是，她发动了红雾异变，利用蔽日红雾，遮挡住伤害吸血鬼的阳光，好让吸血鬼重上地表，再次踏上除了红魔馆以外的土地——毋庸置疑，她的计划失败了，博丽制裁了她的所谓闹剧，并吹散了最后的吸血鬼屏障，尽管怀恨在心，她却也懂得挑战博丽秩序的下场，而且，不论成败，她的地位也在一众吸血鬼的心目中迅速上升，结果就是——她已经成为了红魔馆的闭门皇帝。\n\n只不过，她仍旧等待着机会，等待着，博丽的羸弱秩序，连同荒谬至极的符卡规则一起，崩溃瓦解，灰飞烟灭——她不止一次为此向无上尊荣的路西法祈祷，而在不久后的结界120年，幻想的秩序也言出法随，在吸血鬼们的诅咒中走向覆灭。\n\n而复兴的圣战也在此刻吹响了号角，绝对忠诚的骑士们，运筹帷幄的魔法使，以及这场圣战的统御者，吸血鬼一族，开始了洋馆之外的征服战争，北方的妖精在红魔骑士的轰隆炮声中措手不及，在他们的最后哀嚎中，吸血鬼的恐惧，早已重新降临在了雾之湖上空，在此后的二十年间，它所带来的敬畏与臣服早已不计其数，蕾米莉亚.斯卡雷特也已如愿以偿，她成为了吸血鬼的弥赛亚，如果你在红魔城仔细聆听，那么对神圣斯卡雷特一世皇帝的称颂与讴歌一定不绝于耳，而她的家族头衔——斯卡雷特，也成为了帝国的象征，世世代代，铭刻在吸血鬼尊贵后代的基因与血脉当中。\n\n然而，即便是在尸山血海中深扎根基的帝国圣座也难免有风雨飘摇之时，蕾米莉亚始终醉心在这永恒的荣誉当中，她自很早以前便不再过问国事，她的欢愉也从征服的快感转移到了兴奋药品的迷幻上，帝国议会实际统治着这个国家，正如她一天天被安非他命摧残着的神经元一般，帝国的神经也愈发紧绷，反抗与暴动的恐怖，笼罩着除了红魔城以外的全部地区，但正如吸血鬼们日复一日被灌输并深信不疑的那样，像妖精这样天生的贱种奴仆，绝无任何自主反抗的可能。\n\n无论如何，伟大至高的绯红大帝早已置身于外，她曾拼命地想要抓住帝国的提线，但就现在看来，即便是帝国遗产所为她构筑的安乐窝，也已经足够她挥霍余生了。"

#——————————继任——————————#
GSE_flandre_scalert:"芙兰朵露.斯卡雷特"
GSE_flandre_scalert_traits_1:"全吸血鬼的霍利.斯卡雷特二世皇帝"
GSE_flandre_scalert_traits_2:"红魔托孤"
GSE_flandre_scalert_desc:"在大斯卡雷特帝国统治北雾之湖的数十载岁月里，斯卡雷特一世的响亮尊衔，正如红魔城的红雾，笼罩着吸血鬼们的生活，同样给任何战栗于吸血鬼淫威的奴仆们带来恐怖，但鲜为人知的是，在蕾米莉亚的巨像阴影背后，她的妹妹，芙兰朵露.斯卡雷特，作为斯卡雷特家族的唯二血亲，芙兰朵露却从未在帝国的重大礼仪中露面，也许她忌惮于姐姐的帝权，亦或者是，她想营造一个低调的印象——但这些论断都姑且只能算作茶话闲谈。\n\n自上百年的灾变以来，芙兰朵露从来不是正常的吸血鬼，也许残暴的吸血鬼不在少数，但芙兰朵露旧时的精神状态却足以让任何恶棍都为之胆寒，她拥有极为强大且极具毁灭性的力量，如果和她结上梁子，事实上就等于死刑的宣判，而她扭曲的心理甚至让她连自己也不放过，为了限制疯狂的妹妹，蕾米莉亚只能无奈地将她软禁在与洋馆社会隔绝的地下室中，尽管在外人看来这近乎铁石心肠，但实际上，蕾米莉亚此后一直以各种方式四处求医，一直到公国的扩张时代，外界的先进医术才解释了芙兰朵露的病情，并使她顺理成章地得到了治疗，只不过，当她从这持续了上百年的精神噩梦中解脱出来之时，她的姐姐早已变了一副模样，比起大小姐，任何人都必须尊称她为斯卡雷特大帝。\n\n痊愈后的她变得平静缄默，而蕾米莉亚却日渐癫狂，即便是与之最亲近的她也常不寒而栗，尽管姐姐仍然爱着她——或者说，爱着那个将要成为唯一继任者，成为霍利斯卡雷特二世的她，因此她总是被灌输贵族至上与皇权至高的观念，但她对此并无感觉，只觉得自己豁然开朗的新生活正愈发压抑，她打心底知道，自己绝不会成为姐姐心目中的威严君主。\n\n但一切已经由不得她了。她亲眼看见，那位万世不朽霍利斯卡雷特一世皇帝，倒在她的身边，僵死的眼睛直视着她，悲伤与恐惧同时涌上心头，但更多是迷茫。在对姐姐白事的规划中，她的登基也被提上了日程，芙兰朵露.斯卡雷特——或者，霍利斯卡雷特二世皇帝，将接替先帝之位，再次以斯卡雷特的威严统治着吸血鬼帝国。\n\n可事实果真如此吗？她感知不到任何权力的存在，她只知道帝国议会不同派系的进言上书已经开始让她烦躁，她和被软禁的日子仍然没有任何区别，没有议会的允许，她甚至无法踏出红魔馆半步——既然如此，谁又愿意相信，是她这个蕾米莉亚的妹妹正统治着帝国呢？事实上，任何人都低估了蕾米莉亚的遗产，尽管权力不在于身，斯卡雷特家族的影响力，依旧能够让掌权者不得不为之效忠——这也是芙兰朵露最近才发现的秘密，只不过，她会利用这样的影响力垂帘听政，还是甘于作贵族们的影子皇帝，也许，只有承载了吸血鬼百年历史的古老洋馆才得以知晓。"




GSE_scalertcouncil:"大斯卡雷特帝国议会"
GSE_scalertcouncil_traits_1:"大斯卡雷特帝国议会"
GSE_scalertcouncil_traits_2:"紧急状态"
GSE_scalertcouncil_desc:"历史的无数事实无不向我们证明，即便是牢固的帝国机器，也难以承载日渐严苛的暴政。而至高皇帝的丧钟也已经敲响，霍利斯卡雷特一世皇帝——蕾米莉亚.斯卡雷特，在遭遇妖精刺客的枪击后，当即驾崩辞世，为帝国歌功颂德的联欢，最终成为了一场血腥的出殡，只不过随着斯卡雷特一世一同将被埋葬的，还有帝国长久稳定的假象，以及——帝国的黄金时代。\n\n大斯卡雷特帝国议会在公国时代就已经初现雏形，骑士，魔法使，吸血鬼的政治代表主持着帝国议会的工作，众星拱月着，霍利斯卡雷特一世的华丽皇袍。然而，皇帝身故导致的巨大权力真空，却难以被帝国议会所驾驭，甚至在其强大的向心力中，议会也近乎被撕碎瓦解，为了让帝国早已一盘散沙的政治再度团结起来，§R霍利.斯卡雷特二世§!必须早日登基，以重拾斯卡雷特皇室的威望，但在此之前，帝国议会必须承担起维系帝国社会脆弱稳定的重担。\n\n而最坏的危机远非红魔城的权力角逐，斯卡雷特帝国庞大的国土，实际由大大小小的殖民地军政府所拼凑而成，幻草原抵抗组织，凡派尔共和军，外玄武川自由联盟——每一天都在动摇着帝国的统治秩序，而在此凶煞之时，皇帝的死讯也成为了这些大逆不道者共同行动的信号，我们虽然无法掌握具体情报，但完全可以保证，§R帝国将遭受比以往更加严重的冲击§!"


GSE_despotism_party:"大斯卡雷特帝国议会"
GSE_izayoisakuya:"十六夜咲夜"
GSE_izayoisakuya_traits_1:"大斯卡雷特帝国首相"
GSE_izayoisakuya_traits_2:"幕影骑士"
GSE_izayoisakuya_desc:"如果说有一种忠心耿耿能够称得上肝脑涂地，以至于在为之善后的日子中，仍护卫着其遗产与威信，那么这种忠诚若与十六夜咲夜对斯卡雷特家的矢志不渝相作比，也略显苍白。\n\n尽管作为帝国禁卫军的第一把手，十六夜咲夜的出身却并不光彩——对于吸血鬼来说。她的家族曾赶上数百年前的吸血鬼猎杀热潮，而作为吸血鬼猎手的十六夜家族也在丰厚悬赏的引诱下，来到吸血鬼们的藏身之地——亦不出所料地遭到了俘虏，但吸血鬼大族却一反常态，对作为吸血鬼猎手的十六夜家网开一面，只不过代价是，他们的家族必须世代服侍吸血鬼，十六夜的先祖们对此感恩戴德，而他们也成为了所谓人类骑士的溯源。如此看来，咲夜对吸血鬼的忠诚似乎与生俱来，但蕾米莉亚对她的尤其关注与重用也是她如此敬重大小姐的原因之一，而她也不负其望，接过了指挥禁卫军的权杖。\n\n即便她无比支持斯卡雷特的帝业，帝国带来的生灵涂炭和哀鸿遍野也让她残存的良心隐隐作痛，但在如今华袍加身的大小姐——不，是陛下面前，她也不敢有过多微词，随着蕾米莉亚的身心状况日渐堪忧，专注禁卫军的她也不得不涉猎政务，作为帝国议会中的骑士代表，但很快一个真相就随着她深入政治而愈发清晰，作为所谓帝国三大核心的骑士终归只是极少数，而整个帝国的实际统治权只是掌控在魔法使和吸血鬼贵族们的手中，禁卫军虽然是一支不容小觑的独立力量，但对抗帝国的庞大机器还是过于贫弱，如果失去了斯卡雷特皇室的权威，禁卫军合法性的存亡只不过是弹指之间。\n\n她最不愿意看到的事情恰恰在帝国的周年庆典上发生了，绯红女皇在袭击中撒手人寰，留下了一个肿胀的帝国机器。她强忍失去主人的悲痛来维持着秩序，而另一个不速之客又找上门来。当帕秋莉和黑男爵正在把镇压幻草原暴动的功劳通通往身上推时，憎恶任何变革的吸血鬼保守贵族们则开始尝试扶植起正在权斗中失势的十六夜咲夜，可与其说是支持，不妨说是赤裸裸的威胁，咲夜理所当然的效忠于斯卡雷特家族，自然也就效忠于全体吸血鬼贵族——这一点她无可反驳，而在斯卡雷特二世的背后，帝国议会的提线也不时挑动，对斯卡雷特的忠诚如今毫无意义，而十六夜咲夜就这样被裹挟进入了这个由蕾米莉亚与吸血鬼贵族们一手设立的怪圈中，无论她有多不情愿，禁卫军的机器也要随时听候贵族们的差遣，粉碎温和的或激进的变革派，重建吸血鬼们的秩序。\n\n也许帝国的短暂岁月并没有为她的忠贞不渝作证，但今后的历史也将逐渐证明，她会是一个很好的代言人——仅此而已。"


#——————————改革派——————————#
GSE_patchouli:"帕秋莉.诺蕾姬"
GSE_patchouli_traits_1:"大斯卡雷特帝国首相"
GSE_patchouli_traits_2:"帷幄之臣"
GSE_patchouli_desc:"即便是再野蛮无情的饕餮恶兽，也要凶骇面目之上留有一亩三分地，用以供放头脑，以能够操纵其利爪撕碎猎物。大斯卡雷特帝国尽管浑身血腥与污秽，但让它威赫一时的动力并非完全来自奴役与野性，除了吸血鬼贵族与禁卫骑士之外，魔法使是原则上的帝国政治主力，这也是帕秋莉.诺蕾姬的立足资本。她也许并不是帝国的完全导演者，但却是一个必不可少的推动者。\n\n自百年以前开始，帕秋莉.诺蕾姬就效忠于以斯卡雷特家族为核心的吸血鬼家族，但比起十六夜家的天无二日，帕秋莉和追随她的魔法使们把这种效忠看作一种紧密的合作，仅此而已。而作为红魔洋馆的核心头脑，蕾米莉亚也完全离不开帕秋莉和她的魔法使们，完整的洋馆政治正是在这种密不可分之中形成，并逐渐成为了今后帝国政治的基础。\n\n但吸血鬼的野心并没有将红魔的铁蹄限制在北雾之湖，尽管帕秋莉对公国的过度征服表示了明确反对，但面对蕾米莉亚日渐高升的地位，她和魔法使们也不得不将其作为例行公事，为大斯卡雷特的帝业充当开路工匠，而随着帝国范围的扩大，魔法使们的政治垄断也受到了动摇，帕秋莉最先察觉到这一点，帝国议会将原本不应当归于骑士和吸血鬼的权力都如同切蛋糕一样平均分配，任由这些达官显贵或是自重军阀肆意妄为，用竭泽而渔的奴隶制将帝国数年来积攒的财富一点点耗尽，这无疑是她最不能够容忍的事情，在她看来，无论是黑男爵的自立维新，还是想为帝国臃肿机器充当陪葬品的守旧派们，无一例外，都是在纵容帝国滑进深渊。\n\n而言出法随，作为帝国挽歌的前奏曲，斯卡雷特一世在庆典中遇袭而亡。即便老上司的死让帕秋莉感慨万千，但她也不会就此放弃这个重夺政治的机会，为了让帝国从疯狂的斯巴达体制中走上正轨，帕秋莉早已经决定了对帝国作彻底的改革，以洗刷帝国沾满污血与罪恶的历史，只不过在此之前，绝不能再让吸血鬼和禁卫军阻挡魔法使的道路。\n\n但这也许就能够证明帕秋莉良心犹存吗？连她自己都对此没有足够清晰的认知，从上到下的帝国改革到底意味着什么，也许对她来说，改革只不过是让魔法使重新掌舵政坛的手段，只不过，某种直觉仍在时常提醒她，这只不过是悬崖勒马，但无论如何，在今后对斯卡雷特疯狂历史的记叙当中，即便是再苛刻的历史学家，也会想方设法为帕秋莉说几句好话。\n\n前提是，如果她能够成功的话。"


