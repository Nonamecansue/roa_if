 SocDev.1.t:0 "贫困率下降"
 SocDev.1.d:0 "由于我们的国家政策，我国的总体贫困率大幅下降。失业率有所下降，下层社会的生活水平大幅提高。贫民窟已经开始逐渐空置，犯罪率也受到这一全国性转变的重大影响。"
 SocDev.1.a:0 "好！"
 SocDev.2.t:0 "贫困率增长"
 SocDev.2.d:0 "在全国范围内，贫困已经变得越来越普遍。在一些地区，工作机会几乎枯竭，许多人在街头徘徊，寻找他们能找到的任何工作。政府很清楚，我们的政策增加了全国的贫困，极大地影响了经济健康，降低了民众的生活水准。我们必须尽我们所能来弥补这一点。"
 SocDev.2.a:0 "哦不。"
 SocDev.3.t:0 "工业化进步"
 SocDev.3.d:0 "工厂充满生机，煤炭被铲进锅炉，数千人移居城市从事新的工作。工业带来了巨大的好处和祸端。农业已现代化并机械化，越来越多的人到城镇找工作，他们的工具和才智正是饥饿的经济所需的。虽然这将影响我们的农业基础，但国家的工业能力也大大提高了。"
 SocDev.3.a:0 "现代主义就是未来。"
 SocDev.4.t:0 "工业化退步"
 SocDev.4.d:0 "在城市里，工厂变得越来越空。曾经充满生机的公寓楼如今变得死气沉沉。我们的人民越来越期待农业生活方式能带来稳定和舒适。随着许多人曾经生活的田园生活方式变得越来越普遍，经济受到影响。我们的工业将受到这一社会转变带来的严重影响，但我们的农业基础将从这一变化中受益。"
 SocDev.4.a:0 "必须抵制现代化。"
 SocDev.5.t:0 "文盲率改善"
 SocDev.5.d:0 "教室里挤满了渴望学习的孩子。我们的政策大大提高了全国的识字率。在贫困地区的项目帮助农村地区的许多成年人从文盲变成了可以接受的阅读水平。随着越来越多的人能够做出更好的决定并以更快的速度学习，国家脑力的增加将有助于改善我们的工业和经济基础。"
 SocDev.5.a:0 "书写是文明的奠基石"
 SocDev.6.t:0 "文盲率恶化"
 SocDev.6.d:0 "教室空无一人，书本被遗弃在课桌上，全国大多数人都放弃了接受高等教育的需求。农村地区由于成年人缺乏基本的阅读理解能力而备受煎熬，而他们的孩子也不会因为将书本丢在一边做苦工而过得更好。这将极大地影响我国的工业化能力，并将导致贫困逐步增加。"
 SocDev.6.a:0 "劳动比学习更重要"
 SocDev.7.t:0 "经济健康改善"
 SocDev.7.d:0 "由于我们目前的经济政策，我们的国民生产总值有所改善。正因为如此，我国经济目前的健康和稳定状况已大大改善。"
 SocDev.7.a:0 "市场越繁荣，人民越自由！"
 SocDev.8.t:0 "经济健康恶化"
 SocDev.8.d:0 "不幸的是，由于被抛弃的经济政策或糟糕的决策，我们当前的经济状况恶化了。"
 SocDev.8.a:0 "看来钱也没人当回事了。"
 SocDev.9.t:0 "西化水平改善"
 SocDev.9.d:0 "该国在通往现代西方文明的道路上取得了进一步的进展。古老的部落和老人政治的做法越来越被摒弃，取而代之的是西方式的文化支柱。社区变得越来越依赖现代农业技术，而一些人搬到了新的工业首都，那里的雾霾现在阻塞了曾经空旷的天空。当新一代人展望欧洲的未来时，旧观念被抛弃了。\n\n我们的国家将进一步向现代化、工业化和最重要的西方化国家转变。"
 SocDev.9.a:0 "文明，我来了！"
 SocDev.10.t:0 "更现代化的军事"
 SocDev.10.d:0 "由于我们的军事演习，我们现在有了更好的军队。"
 SocDev.10.a:0 "“遵命，长官！”"


