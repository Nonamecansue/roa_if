 SocDev_Menu_Explanation:0 "§Y社会发展水平§!是一个综合国家各种因素的粗略衡量标准。\n\n在整个发展过程中所作出的决定会对社会进步等级造成§G正面§!或§R负面§!的影响。当社会进步等级到达§C满级§!时，发展水平将不再增加。发展进度的上下限分别为100%或-100%。如果发展水平未达到最大值，它将会升至下一个发展等级。如果发展进度达到了-100%，那么除非当前社会进步等级为最低等级，否则社会进步等级会下降。"
