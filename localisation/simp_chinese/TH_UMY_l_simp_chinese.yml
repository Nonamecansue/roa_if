#——————————新共和派——————————#
UMY_dcdelta: "迪西.德尔塔"
UMY_dcdelta_traits_1:"雾之湖民主共和国总统"
UMY_dcdelta_traits_2:"共和遗孤"
UMY_dcdelta_desc:"同其他在新生的雾之湖政坛上崭露头尖的角逐者们不同，迪西德尔塔生活在相对宽裕的环境当中，而仅次于长老会的阶层使得她得以接受更为高等与优越的教育，也是第一批接触外界知识的妖精学者，在她的导师——格里斯的引导之下，德尔塔成为了宪政共和的信徒，而她也紧随共和派的脚步，加入了新成立的共和政党，并参与了反对长老会的抗议与革新。\n\n也正是因此，她在今后共和国的政治生涯中步步高升，成为了政党内举足轻重的枢纽人物，格里斯也希望能够将她培养成共和国的下一代接班人，可新雾之湖的辉煌终究昙花一现。格里斯的失败改革动摇了她对宪政主义的信心，而军队对劳工运动的肆意镇压也让她认清了一个可耻的事实，格里斯的共和政府已经沦为了经管委的提线木偶，而国家的建设与指导权已经落到了极少数官僚手中，腐败也在这片已然满目疮痍的土地上四处蔓延，对权钱交易与社会黑暗的不满让她与格里斯越走越远。\n\n136季，斯卡雷特的装甲师开进了幻草原的土地，而红魔的兴奋剂僵尸们也在灯枯油竭的雾之湖共和国残躯上四处扫荡，在一片混乱中，迪西德尔塔带着残余的党羽奔向了南方，可迎接她们的，却是南方军政府宣布投降的讯息，而作为政府高官的她自然也成为了变节者们的搜捕目标，在无尽的屈辱与悲哀中，她几经辗转，最终才在辉针城组建了流亡政权。\n\n在东流亡的日子里，斯卡雷特匪帮在首都的焦土政策与惨绝人寰的屠杀事件不断为德尔塔所获知，绝望与抑郁每天都不断撕咬着她的意识，轻生之念也不断从心中萌生而起，直到一天，她得知了雾之湖的抵抗网络，以及格里斯政权仍然存于花海的消息，信心才从万丈深渊中升起，她团结了一同流亡于此的共和国遗孤们，重建了新共和党，与东雾之湖的地下抵抗者们密切联系着。\n\n而重获自由的钟声也日渐临近，在抵抗者们的旗帜下，新共和党人回到了祖国，同革命委员会和沙文党人一起并肩作战，联合体随之在共和国的坟墓上拔地而起，把凶狠的绯红恶魔们逼退到了南幻草原外。\n\n伤痕累累的国家需要休息，而迪西德尔塔的忙碌却才刚刚开始，新的国家浸泡在各种激进思想的狂热当中，而红棕党们的争斗也在把新生的东雾之湖大会搅得天翻地覆，但只有迪西德尔塔知道，东雾之湖真正需要什么，如今，她已经如格里斯之愿，成为了共和主义的领头羊，而她也将在第二共和国今后的道路中，弥补导师的错误与遗憾。"



