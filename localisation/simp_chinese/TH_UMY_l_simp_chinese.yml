UMY_cirno: "琪露诺"
UMY_cirno_traits_1:"东雾之湖妖精大会主席"
UMY_cirno_traits_2:"年轻的解放者"
UMY_cirno_desc:"从妖精共和国建立，到覆灭，再到现在，琪露诺曾成为过不同的角色，她是学堂里成绩倒数的学生，是在乡村阡陌的平凡教师，是初露锋芒的公务员，也是在斯卡雷特殖民东雾之湖的黑暗时代中，拾起反抗旗帜的那一批妖精。\n\n十多年的漫长岁月中,她不知奔波到了多少座奴隶工厂，不知多少次躲在肮脏的下水道中——透过井盖孔看着，那些前来追捕她的斯卡雷特禁卫军；不止一次领导着游击队作战，也不止一次地，看见在眼前堆积的同胞尸首，而她却从未被吸血鬼的恐怖吓倒，她相信斯卡雷特的竭泽而渔终会使其崩溃倒塌，而这一点也在不久的魔法森林战役中得到了证实，她的游击队首先接到了起义军队的消息，然后再是革命委员会与新共和派。\n\n于是这一次，她成为了雾之湖妖精的新领导者，在光复的愿望之下，新生的雾之湖军队击溃了吸血鬼的绯红匪帮，琪露诺理所因当地成为了妖精们的新拯救者，妖精们歌颂她，赞扬她，有的人甚至为她捧上了桂冠，但她始终对这些冠冕堂皇婉言以拒，毕竟，刚从枷锁中解脱的东雾之湖更需要重建与休息，而不是新的铁腕。\n\n然而，东雾之湖妖精大会当中的角逐同样被她看在眼里，她无法搞懂革委会的纲领和沙文党的教条，她的心中只有妖精们来之不易的解放，但即便是她不断的调和努力也无济于事，裂缝与分歧日渐加深，琪露诺早已深知这一点，大帐篷的团结只是童话而已，总会有人站到舞台中央，拔得头筹，而她现在要做的就是让这样的过渡尽可能温和一些些，以免再次触动这片新生土地上的半点伤痕。"
UMY_republicanism_party:"东雾之湖妖精大会"




#——————————雾革委——————————#
UMY_revolyutsiya: "列波露琪亚"
UMY_revolyutsiya_traits_1:"雾之湖革命委员会主席"
UMY_revolyutsiya_traits_2:"革命长子"
UMY_revolyutsiya_desc:"布宁.佩妮曾只是居住在雾之湖畔卑微妖精，她的家庭以捕鱼和摆渡为生，微薄的收入虽然足够一家人果腹，但却无法再给家里的任何成员搭建走向社会上层的台阶。不知从何时起，年轻的佩妮开始对那些流入幻想乡的未知书籍感兴趣，尽管长老会与贤者们都明令禁止这些来历不明的奇技淫巧之物，但她还是借着干活的空闲，躲在不为众人所知的角落阅览这些奇特故事，虽然她很少识得文字，但这些书传达的东西都在向她描述一个从未谋面的大千世界。\n\n而也正是这样的三年后，灵能饥荒的爆发让她的亲人四处离散，在颠沛流离的时光中，一位餐馆老板收留了她，佩妮从此开始在此帮工做杂活，而不久之后，另一件事又引起了佩妮的注意，宪政共和派推翻了长老会政府，格里丝宣布了共和国的建立，而在各地，教授新知识与技术的学堂也陆续开办，佩妮当然不会放过这样的机会，在开明老板的帮助下，佩妮成功踏进了学堂的大门。\n\n共和，科学，技术，这些都是这里最流行的东西,对魔权与神话的恐惧与信仰也烟消云散，学成的佩妮回到雾之湖畔，开起了书店。在工业化时代的后期，佩妮目睹了劳工所受到的不平等待遇与反抗，也看到了格里丝改革的失败，而工厂主与其的不可调和也愈发明显。她走进工人当中，了解了他们的贫苦状况，也决心要结束这样的不公。她收集了许多关于外界的工人活动书籍，并开始发表文章，在认同她想法的旗帜之下，第一批劳工会成员开始了领导工人的维权斗争，罢工与游行成为了她们的常用手段，但工厂主与经管委的血腥镇压让劳工会陷入停顿，佩妮也在罢工中负伤，最后被打入牢房，直到一年后才得到释放，身心俱疲的她只能回到老板家修养。格里丝被架空的露骨事实已经摆在了她的面前，与此同时，她注意到了外界曾记载的工人革命与布尔什维主义，在那些十分震撼的历史描述中，佩妮深感之前作为的无力与软弱，于是她开始拥抱了革命理论与先锋队制度，不久后，她又开始活跃于报纸上，只不过，她这一次是以“列波露琪亚”的名称开始撰写社论，正如她的新名字一样，她本人也在变得更加激进与革命。\n\n在沦陷的岁月中，劳工会在她和数位同志的带领下最终成长为了一支合格的先锋队——雾之湖革命委员会，建立起了广泛的抵抗网络，团结在琪露诺的反抗旗帜之下。\n\n在东雾之湖最终解放的喜悦之后，列波露琪亚也陷入了烦恼当中，在旧日的妖精大帐篷中，沙文党屡次对雾革委发难，而在党内，她不知是要继续掌舵革命，还是要退居二线，让那位回国的同志接过交椅，但无论走哪一条路，她都愿意为雾之湖的革命事业奉献一切，哪怕是生命。"

UMY_freeequelier: "芙莉.伊库尔"
UMY_freeequelier_traits_1:"雾之湖革命委员会主席"
UMY_freeequelier_traits_2:"社会主义新星"
UMY_freeequelier_desc:"格林.芙莉斯特，一个居住于北魔法森林的的孤独妖精，她的父母自她出生起便不知去向，作为一个卖画为生的无名小卒，也许除了五彩缤纷的颜料和逐渐枯竭的灵感，她此生就将这样平淡地过下去。正如绝大多数弱势妖精那样，不公时常降临到她的头上，蛮横催税的魔法使乡绅，穷凶极恶的妖怪土匪，都不停地让她的生活雪上加霜，她的画作也因此具有反抗与发泄的意味。灵能饥荒在魔法森林泛滥后，芙莉斯特也不得不南下旅居，可与其说是旅居，不如说是逃难，几经周折后，她才来到了人间之里，这里此时才刚从起义中恢复过来，幸运的是，她的作品很受一些人类的欢迎，人们纷纷出高价买下她的画，使得她终于暂且脱离了赤贫的境地，此后她一直居住在人间之里，也接触了人类的科学改革，阅读开始成为她绘画之余的消遣，在一年后，她听闻了北边的妖精国家的共和革命，于是起身回到祖国，当她再次踏上东雾之湖的土地上时，革新与欣欣向荣的气氛代替了昔日的迂腐与陈旧，她开始涌现出更多的创作灵感，她的众多作品出现在了共和国的画廊当中，但她仍旧未透露自己的姓名，而同时，劳工会轰轰烈烈的大罢工吸引了芙莉斯特的视线，她开始关注与了解劳工的状况，也创作了反映其生活境地的作品，只不过，这些作品被一一打下，而原因也十分明显——芙莉斯特并未就此放弃，她的作品仍然吸引了众多劳工和劳工会的领导者们，芙莉斯特因此也在暗地中加入了劳工会的活动。\n\n而她的创作生命也在红魔入侵的那一天结束了，一转眼，芙莉斯特就同其他妖精们一样沦为了奴隶工厂的亡国奴，流水线与无限制工时，无尽的训斥与叫骂，无数次的皮开肉绽，无数次的休克与昏迷，让她更与劳工们情同手足，尽管她无法接触到地下妖精们的抵抗网络，但她仍旧抱着复国的希望，坚持着到那一天......她和其他的劳工妖精被应征入伍，而等待她们的，则是下玄武川的可怖绞肉机，她再也无法忍受这般折磨，于是杀死了督战队，带上了一小支妖精部队逃往了玄武川的国土，被妖怪山联军所救后，她留在了天狗帝国，在此后的日子里，由于被注射了兴奋剂药物，她的手抖症状已经让她与绘画绝缘，在惆怅中，她意识到即便是重新拿起画笔，也无法再拯救雾之湖的同胞们与水深火热之中，于是，她重拾了反抗与革命的理想，作为对过去苦难的决裂，她将名字改为“芙莉.伊库尔”，意为“自由平等”，而这同样是她的新理想，在秋日社的帮助下，她与雾革委重新取得了联系，并引渡了同样流亡地外的革命者们。\n\n现在，芙莉伊库尔已经回到了早已解放的东雾之湖大地，在旧日的废土与坟场上，压迫与剥削仍历历在目，芙莉伊库尔早已下定决心，一定要用革命的利剑，将红魔遗毒与压迫者败类们彻底肃清。"

