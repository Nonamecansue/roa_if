UMY_bloodyrevenge: "布拉迪.列文姬"
UMY_bloodyrevenge_traits_1:"全雾之湖妖精复仇联盟统帅"
UMY_bloodyrevenge_traits_2:"绝对狂热"
UMY_bloodyrevenge_desc:"对于布拉迪.列文姬，或者说，达尔克劳兹，她的命运究竟是什么时候开始变幻莫测的呢，也许自她呼吸到这世上的第一口空气开始，悲剧就早已预言。\n\n只不过，她也曾有过一段安宁的时光。达尔克劳兹也曾是在幻草原安宁生活着的普通妖精，即便这和她的贵族身份也有所关系，但她从不因为自己的高贵身份而居高临下，与之相反，她同情与关爱着那些正在贫困与灵能饥荒中挣扎的妖精们，她也因此说服家人组织了慈善与救济活动，而在数年后，共和革新将她所在的家族赶下了高位，但幸运的是，她家摇身一变，成为了新兴工厂主们的一员，达尔克劳兹因此也未受到影响，而格里斯共和派带来的社会革新也深深吸引着她，她也得以接受了高等教育。\n\n也许一切都在向好发展，可正如她的旧名一般，命运的阴云同样笼罩着她今后的道路中。自从她的家业因为改革而被取缔，下坡路就开始了，而且一望无边。在落魄当中，她的家父陷入赌局，而母亲则去从事了贩毒活动，只剩下她一个——还在过去的日子里徘徊，可她早已落得她所怜悯之人同样的境地，只不过，这一次没有人拯救她。在赌徒父亲的一手操弄下，克劳兹被卖到了遥远的东雾之湖的一家黑厂，每日喝着沾满烟灰和蛆虫的米粥，从事着无间断的流水线劳动，而祸不单行，她也沦为了精英子弟们的玩物，无数次被羞辱与虐待，开始让她精神失常。\n\n直到那一天，“救星”们占领了她所在的黑厂，释放了包括她在内的妖精劳工，她对斯卡雷特千恩万谢，可怎么也想不到，她的下一个归宿，就是红魔疯狂的炼药锅。她被抓到了旧东幻草原的集中营，但更可怖是是，这里只是一个披着监狱外衣的魔法使研究所。接下来的每一天，她都被绑在冰冷的钢床上，被注射各种由斯卡雷特研究局制造的军用药剂，成为了斯卡雷特兴奋剂产业案板上的实验白鼠，而她也只能任由那些摧残着她肉体的罪恶毒剂随着血液流过身体的每一个角落，这还不算完，还有更多的试验……\n\n她连自己也不记得自己是怎样从东幻草原逃出来的了，她只知道，恨，对不公的恨，对折磨的恨，对吸血鬼的恨，对变节者的恨，以及对命运本身的恨，她的魂灵已经所剩无几，全由数十年的怨念来填充。\n\n她回到了起义后的东雾之湖，她一直在寻找方法，一个将那些摧毁着她与像她那样的妖精的人，不，是恶魔，把它们碾碎，把它们撕烂，焚烧它们的腐败尸首，挫骨扬灰。\n\n事实证明，复仇的确是一个强有力的招牌，但对克劳兹来说——不，克劳兹早就死了，连着理智一起，她的尸首早已在蹂躏中不成人形，取而代之的是一个盛满了一切仇恨的容器，布拉迪.列文姬，这完全不够，她十分欣赏核子武器的力量，也深深崇拜芥子气带来的完全净化，§R是时候将她酝酿已久的计划付诸行动了，如果足够幸运，那么整个雾之湖都将在这场末日圣战中，化为熔炉，化为炼狱。§!"



