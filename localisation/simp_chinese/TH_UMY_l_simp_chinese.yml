#——————————沙文党——————————#
UMY_axes: "艾克西斯"
UMY_axes_traits_1:"东雾之湖妖精领袖"
UMY_axes_traits_2:"第三派"
UMY_axes_desc:"如果说幻想乡走向现代化的进程中，有千万个离奇的故事，那么艾克西斯的故事也许就是诸多荒诞中的其中之一。艾克西斯亦是土生土长的雾之湖妖精，尽管她的商人父母所赚得的财富让她自出生起就过上了三年的优裕生活——可也仅此三年，她的家庭就因为摊上利润骗局而走向破产，此后她一直在诸多亲戚手上辗转，正如无法归根的落叶，不稳定的家庭也让艾克西斯颇为乖戾，但她也数次发誓要搞一番大事业，因此在共和制后的工业化时代，她把剩下的家产都投入了她颇为青睐的企业当中——然后无一例外都在经济改革中大受亏损，落魄至极的她也被唯一接纳她的亲戚扫地出门，她只能在各地游荡，一度住在下水道里，也接了不少黑色的商业活。\n\n事业的各种失利让她恨透了雾之湖共和国和格里斯政府，她开始参与一部分保皇与保长老会组织的集会，但当她得知这些不懂变通的老登们居然连灵能工业化都反对时，于是毅然退出了这些活动。在离开保守派大本营之后，劳工会所组织的罢工运动让她眼前一亮，她第一次见识到了工人的力量，尽管罢工遭到镇压，但艾克西斯还是加入了劳工会，在组织里她得以阅览了众多外界书籍，尤其是索雷尔的书籍，让她对精英政治与种族主义颇为青睐，而劳工会宣扬的泛幻想乡劳工团结也开始令她反感，她开始自发撰写纲领，宣扬所谓种族劳工主义的思想，并在工厂与劳工会的地下报刊里大肆宣传，由于劳工会的高层因为被逮捕而陷入瘫痪，艾克西斯的奇异论调并没有被组织，甚至让她收获了第一批信徒，她也在众星捧月中步步高升，在劳工会建立了党中之党，她的肆意妄为引起了左派的警觉，终于她在工厂中宣扬影响力之时，对她分裂劳工会感到忍无可忍的激进工人把她拉下讲台，在饱尝了一顿汉满全席之后，艾克西斯和她的羽翼们被逐出了劳工会。\n\n而在此后，当雾之湖战争正把格里斯政府迅速碾碎之时，艾克西斯也转入了地下活动，在旧党羽的协助下，她也成立了东雾之湖沙文党领导抵抗运动，只不过，沙文党一直与琪露诺的抵抗网络相互独立，她们从来都独立领导行动，并依靠各种恐怖袭击的方式来打击斯卡雷特的殖民。在地下抵抗中，艾克西斯总结了自己在旧劳工会里提出的纲领，推崇以劳工活动为基础的种族法团主义运动，她另类的种族主义在哀鸿遍野的东雾之湖得到了与雾革委相当的支持。\n\n东雾之湖起义之后，艾克西斯出乎众人意料地宣布加入了抵抗网络，沙文党表现出的惊人战斗力也令一众起义者颇为赞赏，而艾克西斯也在参与抵抗的名誉中“加冕”为沙文党的至高领袖，在现今的雾之湖大会里占有与雾革委同样的席位。艾克西斯也曾把一切当做是美梦一场，但她更清楚，安于现状只会导致覆灭，只有将沙文党面前的敌人通通消灭，东雾之湖妖精们的复国与复兴才能实现。"

