NCT_tengurepubliccongress_desc:"终于，摇摇欲坠的腐败帝国已经迎来了自己的终局，帝国立宪的满纸谎言在现实的照妖镜下不攻自破，以它为蓝本的帝国议会从圣坛跌落而下，在天守阁的大地上摔得粉碎，它所庇护着的牛鬼蛇神也四处逃窜，无处遁形。\n\n国民大会在火炬与刀锋中新生，依照人民的意志，以及进步的发展，自由的希望被寄托在她之上。旧日的黑暗，新生的美德，以及§R起义的鲜血§!，共同汇聚成为了新天狗共和国的三色旗帜，正如外界的法兰西一样，全幻想乡的启蒙之光将在妖怪山再次升起。\n\n皇权的反对者们齐聚一堂，无论是§G自由民主的新公民§!，还是§W军官爱国者§!，无论是§Y强硬的种族派§!，还是§R拾起红旗的第三等级们§!——明天，明天即是新生之日，明天即是审判之日，明日他们都将得知上苍的安排！\n\n§K革命万岁!§!§R共和国万岁!§！"

