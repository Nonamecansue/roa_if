EOT_iizunamarumegumu:"饭纲丸龙"
EOT_iizunamarumegumu_traits:"守墓者"
EOT_iizunamarumegumu_desc:"结界146季，随着新年钟声敲响，饭纲丸龙作为天狗帝国首相的任期，又添上上了一年，她是立宪改革后的第三位首相，但也许这项职务，再后继无人了。\n\n饭纲丸同其他帝国幕僚一样，作为相对长寿的鸦天狗，她甚至还亲历过红枫党人的起义，见证了天魔王神权衰弱到君主皇权的进程，再后来，工业化将帝国引向了前所未有的高度，而她也是立宪的主要支持者，尽管她在接下来的两次选举中都败于别党官僚之手，但她也并未遭到清算。\n\n最后，在支持发动下玄武川战争的内阁倒台后，她接手了帝国首相的职务，只不过，天狗帝国的昌盛国运已经在天魔王的挥霍中消耗殆尽，在破产的经济与国民的怒吼中，它的国柞已经走到了尽头，比起国家首脑，饭纲丸龙更像一个守墓人。\n\n她的一切作为和改革都不再凑效，贵族财团在谋取议政，而投机官僚则开始自谋出路，帝国议会早已名存实亡，至于天狗皇室，他们大都沉浸在工业化后的帝国幻想当中。\n\n时间在流逝，饭纲丸的耐心也在不断被消磨着，红枫党的儿女们早已为帝国备好了寿材，除此之外的各路人物都在暗流涌动着，而若是不想让自己也一同被这即将到来的风潮所埋葬——\n\n她，也就必须作出抉择了。"
