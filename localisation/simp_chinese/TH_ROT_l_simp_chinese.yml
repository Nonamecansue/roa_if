#——————————秋日社——————————#
ROT_furaikei:"风雷启"
ROT_furaikei_traits_1:"天狗革命议会议员"
ROT_furaikei_traits_2:"启蒙者"
ROT_furaikei_desc:"在几乎窒息到极点的旧天狗等级社会里，底层阶层的天狗平民没有任何可以翻身的余地，生来贫富贵贱，皆为“上天”之安排，工作被祖祖辈辈固定继承下来，或者说，一个家族就这样被阶层所定的工作捆绑着，正如一道无形的枷锁。同绝大多数天狗一样，风雷启早年也生活在这样“第三等级”的社会中，尚且年幼的他也许是受母亲的影响，对天魔王的神圣权威颇为崇拜，但这种崇拜与其说是恐惧与信仰，不如说是对英雄偶像的敬仰——毕竟他很早就听说了天魔王领导着大天狗战胜鬼族的各种故事。\n\n父亲去世后，仍在少年的风雷启为了支撑起家庭，也不得不做上了父亲的工作——裁缝，虽然时有入不敷出，但也能勉强生计，只不过，有一件事正在改变，那就是他对神话故事中大天狗的印象，尽管在故事中他们如此英勇，但风雷启却完全无法把那些满眼轻蔑与蛮横无理的贵族老爷们和那些斩杀鬼族的天狗英雄们想到一起。又过了些时日，灵能饥荒开始肆虐妖怪山，所到之处，皆是饿殍与死尸，风雷启家也被迫逃到了首都，母亲与兄弟姐妹们纷纷在路途上撒手人寰，而他则只能只身前往了天守阁。\n\n幸运的是，他与已经开设了新厂的舅舅相认，从此寄宿在了舅舅的家庭中，此时他已正值青年，而帝国也在酝酿着各种改革。舅舅为了让他能有能力做帮工和监工，把他送进了新开设的学堂当中，属于他的新视野大门才得以敞开，而随着他愈发深入了解历史，天魔的神像就在他的心中愈发动摇，直到后来，他得知了天魔王诱骗与镇压红枫党人的历史，才断然抛弃了天魔作为偶像，在他研究历史之余，他也对外界的政治与社会科学有所涉猎。\n\n毕业后的风雷启并没有回到工厂，而是成为了一名记者，此后又去了射命丸文旗下的报纸媒体工作，无论在哪，他都致力于为劳工与底层群众发声，他参与了数次天狗劳工自发组织的大罢工，但帝国的数次血腥镇压都让劳工运动备受打击，而因为等级导致的麻木不仁也影响着劳工的团结，镇定思痛之后，风雷启认为，一场针对帝国贵族与工厂主高层的劳工革命是不可避免的，而不仅需要生产资料革命，风雷启也主张雷厉风行的社会文化革命，用新公民的美德来驱除现在的市侩与投机，他重新召集了旧友，在赤叶社纲领的基础下，重新成立了秋日学社，从此开始在激进派中广泛活动。\n\n在彻底推翻帝国的革命中，风雷启与秋日社也充当了先锋旗手的角色，尽管帝制已经倒塌，但社会革命的重任仍旧在每一个秋日社成员的肩上，风雷启清楚，直到把旧势力与神权彻底驱除之前，软弱都是绝对不应当允许的东西，“没有恐怖的美德是软弱的”，这也是风雷启的信条，无论是外界还是幻想乡的教训都历历在目，作为舵手，他一刻也不能畏缩，必须拼上全部的命运，去与名为愚昧和黑暗之物决死，直到最后一刻。"

