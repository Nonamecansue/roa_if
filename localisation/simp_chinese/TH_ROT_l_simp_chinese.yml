#——————————团结党————————————#
ROT_hironorihiuda:"弘则德威"
ROT_hironorihiuda_traits_1:"天狗社会民族国统帅"
ROT_hironorihiuda_traits_2:"统御者"
ROT_hironorihiuda_desc:"如果有什么能够形容弘则德威这样的角色，那么即便是强硬无情诸类说辞也显得过于苍白。作为一概鸦天狗军官贵族，他为自己的家族与天狗国业而自豪，随之则是对进步革新的厌恶。作为长寿的鸦天狗，他青年时代参与了对红枫党的镇压，即便他始终忠于帝国与天魔，但上层的奢靡与软弱让他对从来应以为傲的地位与身份感到怀疑。数十年后，立宪革新将天狗帝国引向了新的高度，面对轰隆作响的先进工业，他无不为旧时代的迂腐保守而感叹，可即便如此，他仍旧不能容忍立宪带来的国家纲纪崩坏。\n\n而下玄武川战争的耻辱失败也令他大跌眼镜，作为主战派军官的他也遭到革职，在赋闲之后，贵族的腐败与动摇之事也不断为他所知，他才算弄清了战争失败的根本原因，不仅如此，国内的激进劳工运动也将帝国社会弄得乌烟瘴气，这些事实让他认清了一个可能性，那就是传统的崩坏，天狗之间的对立，无一例外的，都是天狗帝国如今一片凋敝的万恶之根，为此，他吸引了一部分追随者，以团结天狗为纲领，开始着手于活动在政治舞台，大天狗贵族们视他的组织尤同弥赛亚一般，千方百计地支持他们对抗民主阵线与秋日社，但弘则德威对这些早已堕落的显贵子弟根本不屑一顾，甚至在即将到来的共和革命中，团结党也放任天魔政府自生自灭，毕竟再高明的医术，也救不活一个大脑腐烂的病号。\n\n不过事实上，这只是弘则德威计划的其中一步而已。\n\n推翻天魔的共和政府照样陷入可悲的内斗当中，而弘则德威早就摸清了革命大帐篷的实质，国民的耐心正在被动乱与崩坏消耗着，而待到他们的容忍达到极限之际，自然就是团结党出场之时。"

