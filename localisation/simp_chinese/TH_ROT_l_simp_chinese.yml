#——————————民主阵线——————————#
ROT_keneirikki:"见影立辉"
ROT_keneirikki_traits_1:"国民大会首席议员"
ROT_keneirikki_traits_2:"尽瘁者"
ROT_keneirikki_desc:"见影立辉曾只是一个在北方以开设律师所为生的普通天狗——这样的职业使得他在今后的道路上与政治愈发接近，他对立宪改革后的生活十分满意，但对帝国议会的民主性仍然颇有微词，尽管他时常写文章批评议会的官僚寡头主义，但他却仍然对立宪体制抱有幻想。\n\n第二次首相选举的舞弊行为被见影立辉看在眼里，不只是他，天魔皇室操纵主战内阁的提线被妖怪山的天狗国民看得一清二楚，天魔王不过是换了一种方式继续着他的专制统治。这样的事实促使见影立辉逐步成为了一名广泛活动着的民主共和活动家，他曾想利用学生与劳工的请愿来引起上层哗变，但在帝国警察不长眼睛的枪口面前，和平改革与过渡的幻想被尽数撕毁，面对一具具为民主化事业而殒命于天魔屠刀下的青年尸体，见影立辉不再相信上层改革的可能性，而是与正在筹备武装暴动的秋日社以及激进共和派团体合作，这也使得他在国民大会中一度成为改良民主派的领袖，同时也当选为国民大会的首席议员。\n\n见影立辉在革命中十分吃力地维持着小资产阶级与劳工的团结，大会内的各种矛盾让见影立辉积劳成疾，在革命最终胜利之后，他已经确诊为了晚期胃癌,但组建共和国临时政府的任务仍旧迫在眉睫，他只能一面阻挡着秋日党人的激进专政，一面为今后的民主选举扫清道路，也许对于已经进入生命倒计时的他来说，这已经是最后力所能及的事情了。"


ROT_shameimaruaya:"射命丸文"
ROT_shameimaruaya_traits_1:"天狗共和国总统"
ROT_shameimaruaya_traits_2:"炬言者"
ROT_shameimaruaya_desc:"在结界危机的数十年前，在靠近九天瀑布的城镇上，总是有这样一群鸦天狗小孩，他们戴着十分老旧的外界相机，四处取材，把拍到的照片交给报社，最后再从报社那里拿到报纸，四处叫卖——这就是射命丸文最早的生活，像她那样的天狗孩子们是报社手上十分廉价的劳动力，而他们低价卖出的报纸也是独属于大天狗们的消遣之物。只不过，同其他孩子不同，射命丸文热爱这份工作，或者说，她也有一个梦想，希望自己有一天能够开设自己的报社，自己取材，自己撰写新闻，把天下的奇闻异事带给天狗社会的每一个角落。\n\n射命丸文作为少数的灵能强大者，拥有着一定的保护妖怪山的能力，不仅如此，她对工作的孜孜不倦也得到了作为媒体管理者的饭纲丸龙的赏识，她也得以从零起步，开办自己的报社，也就是后来的文文媒体。与上层天狗的意愿不同，射命丸文讨厌那些歌颂神明贵族的冠冕堂皇，而一直着重关注着天狗中下层人群的生活与命运，这也让她和她的报社颇受诽谤，但她仍然坚持着自己的梦想，和其它天狗们的媒体竞争着。\n\n然而，日复一日风平浪静的生活，终归是蒙蔽在少数天狗眼前的假象，红枫党人的起义撼动了整个天狗社会，射命丸文也被命令加入了对红枫党人的镇压，尽管她万分抗拒，却只能看着在大天狗弹幕面前近乎手无缚鸡之力的起义者们被屠杀，但比起这一点，她更惊讶于红枫党人最终的胜利，天魔以协商解决了问题，可在这之后，红枫党人仍旧遭到了十分残酷的清算。\n\n风暴过后，生活又恢复如初，但射命丸文却从未忘记这一切，出于愧疚，抑或是打心底的支持，她与一部分记者们秘密撰写了红枫党人反抗的相关历史，并将之封存起来，等待着能够真相大白的那一天。再后来，灵能的大流失，让包括射命丸文在内的大妖怪都失去了其能力，她本想借着文文报社的资本，暂且在乱世中度过余生，帝国的立宪改革又引起了她的关注，她回想起了之前撰写的红枫党历史，将其重编后便开始出版，多个学生团体也开始将文文报社作为发表观点的场地，在与他们的接触与交流中，文也开始认同外界的观念，尤其是关于民主共和之说，文的报社因此也成为了众多异见者的庇护所，在对政治的日渐关注中，射命丸文也萌生了参与政治运动的想法，于是，她开始与见影立辉的合作，将民主联合阵线在地下组织起来，旨在实现二次改宪，实现民主化与共和制。在成为民主运动的领导者后，射命丸文的身份开始逐渐暴露，直接导致帝国政府封禁了她的报社，但她并未一蹶不振，文文报社在地下重新被组织起来，并与一同转入地下的花果子报社合并，至此，射命丸彻底告别了从前的生活，开始完全投入到地下民主运动当中。\n\n作为国民大会的主要领导者，射命丸文与秋日党人一起，共同主导了天狗的大革命，而在共和国成立后，她也获得了总统提名，虽然她本想在革命后继续经营报社，但国民的呼声让她有了些许动摇，正如民主的原则一样，天狗们选择了她，那么作为久经考验的民主斗士，她也应当将自己对革命——对民主的承诺，付诸于现实当中了。"


ROT_kurobaneshie:"黑羽紫慧"
ROT_kurobaneshie_traits_1:"天狗共和国总统"
ROT_kurobaneshie_traits_2:"破枷者"
ROT_kurobaneshie_desc:"就黑羽紫慧曾经的身份而言，也许并没有什么人预料到，她今日会成为妖怪山民主旗手中的其中一位。不比卑躬屈膝的劳工，亦或是得过且过的中产阶级，黑羽家族正处于天狗社会金字塔的上层，而作为大天狗贵族千金的黑羽紫慧也自小接受了良好的教育，只不过，她对上古经书与神学教条毫无兴趣，而她对天狗贵族与天魔王族的神圣性也有所质疑。青年时代的黑羽紫慧正赶上立宪革新与社会开放的大浪潮，她无数次瞒着严厉的家父，参与了多个天狗学生团体的活动，而与此同时，她也在逐渐成为王权的异见者，她了解越多的外界思想，她越对自己的原生家庭的极端压抑而反感，最终在一场争吵中，黑羽紫慧离开了家，她的家父也视她为耻，与她断绝了关系。\n\n离开家后的黑羽紫慧失去了贵族身份，成为了普通天狗国民中的其中一员。在学社朋友的介绍下，黑羽紫慧来到了花果子念报旗下的媒体工作，也成为了民主派电台的播音员。玄武川战争爆发后，电台被帝国政府以战时名义封禁，此后，黑羽追随了最大的民主意见派，并在见影立辉的帮助下成为了民主阵线的地下议员，作为较为激进的自由派，她极其反对与秋日社结盟，反对任何伤害民主制的革命专政。在国民大会取得政权后，黑羽紫慧开始着手于与射命丸文竞争，成为新的天狗共和国总统候选人。\n\n也许在回顾这些履历后，黑羽紫慧仍旧不会后悔当时抛弃贵族头衔的冠冕，转而拥抱国民，拥抱她所热爱着的自由与民主，流血的革命，让她亦深知国民自由的来之不易，在当选为共和国总统之后，黑羽也绝不会向神权与专制让步，一切枷锁与牢笼都将在自由的火炬中化作灰烬，而它的光芒将把妖怪山愚昧黑暗的每一处角落照亮——这就是她的追求。"


ROT_progressivism_party:"妖怪山民主联合阵线"

#——————————爱国协会——————————#
ROT_kiritukiroen:"雾月狼烟"
ROT_kiritukiroen_traits_1:"天狗共和国执政官"
ROT_kiritukiroen_traits_2:"救国者"
ROT_kiritukiroen_desc:"天狗一族的伟大，哪怕是旧日支配妖怪山的鬼族遗族们也不得不叹为观止，自天狗从鬼族的魔爪之下独立以来，她就在不断创造着幻想乡的奇迹，无论是技术革新，还是旷日持久的征服与霸权，天狗都名列前茅——这也是雾月狼烟眼中的祖国。|n\n他来自为数不多的天狗小贵族家庭当中，尽管没有大鸦天狗们高贵，雾月狼烟也得以以非同常人的眼光扫视诸人，他的父亲是一名勇猛的帝国军官，尽管他在出生后才知晓他的事迹，但这也让雾月狼烟发小就将父亲视作榜样，为此，他参加了军队，并以优异的成绩考进了帝国军校。在训练与学习中，他对一部分鸦天狗贵族子弟的色厉内荏十分反感，他因此认为，正是贵族的软弱才让天狗的军容十分涣散，必须把这群平庸之士踹出军队，才能够让天狗重振前大结界时代的荣光。\n\n而立宪改革也在他的军旅生涯中留下了深刻的一笔，待到他晋升军官之时，工业化对天狗乃至妖怪山的改变给他留下了深刻印象，天狗一族也在新浪潮中欣欣向荣，这让他的爱国情绪极为高涨，而报国的机会也在玄武川战争的到来而降临眼前，只不过，即便他与他的旅队在战斗中骁勇善战，但斯卡雷特近乎行尸走肉一般的妖精军队把兵士们的豪情壮志浇灭得一干二净，即便抢林弹雨把那些妖精的四肢与头颅打成筛子，她们也拖着耷拉着的断肢与开花了的头颅推进着战线，雾月狼烟从未见过这样恐怖疯狂的军队，只能在补给短缺的情况下仓皇撤退。\n\n回到祖国的雾月狼烟惊魂未定，他差点患上了战后综合创伤，但未等到他喘息，另一件晴天霹雳又从天而降，天狗帝国与吸血鬼帝国居然签订了和谈协定，并以割让了河童盟友的土地作为交换。得知此时的雾月狼烟怒不可遏，战时的恐惧被一扫而空，而帝国议会频频出现的腐败与丑闻也在败坏着天狗的形象，他自此意识到，依靠天魔王和他的鼠辈亲信们，绝无一日可实现天狗的复兴，他开始在军中秘密结社，建立了反对帝国政府的爱国协会。与此同时，雨后春笋般生长出来的民主共和派们引起了他的注意，尽管他对民主谈不上兴趣，但他从这些新兴的天狗一代看到了未来的希望，于是带领爱国协会集体支持了民主阵线与秋日社的革命运动。\n\n在革命过后，雾月狼烟却并没有迎来想象中的天狗新生，相反，一个内斗与争纷不断的所谓民主政府取代了帝国，分裂与内斗时刻在这个所谓的天狗国民大会中上演，无论是乳臭未干的毛头小子，还是迂腐顽固的耄耋老登，都各自在帝国的尸首上粉墨登场，而对于雾月狼烟来说，这群人与旧时帝国议会的腐败官僚别无二致，他对大会的飘摇不定仍旧给予着忍耐，但他已经愈发感知到，绝不能把天狗的未来交给这些醉醺醺的舵手们，天狗也许不需要民主，但她当然需要共和，只不过，共和国更需要一群强有力的角色，一群能够将新生的她领向复兴与光荣的爱国者们，至于这样的角色是谁，雾月狼烟与爱国阵线也许早已给出了答案。"


ROT_republicanism_party:"天狗爱国协会"

#——————————保皇佬————————————#
ROT_chibamasahiko:"千葉雅彦"
ROT_chibamasahiko_traits_1:"天狗第二帝国公主"
ROT_chibamasahiko_traits_2:"卫冕者"
ROT_chibamasahiko_desc:"当革命法庭的刀锋将天魔王的脖颈连着君主制的脊梁骨一同切断之时，为之喝彩欢呼着的无套裤汉和革命者们也许自以为，天狗国家从此将彻底与君主制绝缘。在万众天狗国民沉浸在革命的自由和复仇的杀戮中时，帝国的残党们早已潜伏在革命恐怖的阴影当中，千葉雅彦便是他们的一大魁首。\n\n自从天魔皇室与大天狗贵族的专制被推翻后，作为皇族公主的千葉雅彦就一直在天狗共和国东躲西藏，如果没有大革命，她完全有望成为天狗帝国的一大皇储——只不过现在也一样，她和贵族残党们在撑过了暴民清算的恐怖之后，开始以贵族幸存者庇护组织的名义重组了代表贵族们的合法政党，即便是对她自己来说，她们的党派能够在国民大会，甚至是秋日社眼皮子底下存在一天都算是一大奇迹。\n\n共和国临时政府的摇摇欲坠，给了千葉雅彦足够的喘息之机，并且，国民大会的分裂也给了他们不少可乘之机，在千葉雅彦和贵族残党们的软硬皆施下，国民大会开始多了不少为贵族发声的议员，而面对秋日社的虎视眈眈，贵族也不再畏惧，毕竟，天狗国民已经在将近三年中的革命狂热中散去热情，革命者们的茶馆里如今人去楼空，当他们的最后支持者也开始动摇之际，就将是时候着手对这些叛党们的清算了。\n\n至于千葉雅彦，也许自一开始，大工厂主和贵族们就答应了让她担任帝位的条件，只不过在如今的天狗第二帝国，她完全没有天魔王那样的实权，甚至没有帝国议会时代的主动权，而导演着这一切的贵族和工厂主们早已达成了他们的目的，正如红枫党人一样，无论是国民大会，文果报社，还是什么秋日学社，无一例外的都将被弹冠相庆的复辟贵族们抹去痕迹，革命只不过是天狗子民们一时的低级娱乐，在吃喝玩乐之后，他们当然又会臣服与一切照旧的秩序之下，而对于这一切的始作俑者，重生的帝国机器自然会让他们的一切残党都血流成河。"

