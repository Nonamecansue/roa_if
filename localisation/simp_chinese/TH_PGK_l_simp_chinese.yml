PGK_progov:"临时政府"
PGK_progov_traits_1:"玄武川共和国临时政府"
PGK_progov_traits_2:"共和方舟"
PGK_progov_desc:" 赶在天狗革命者们之前，河童们再不可能继续忍受长老会的统治一分一毫了，他们只要愈发退缩，长老会和买办强盗们的盘剥就愈发深重，而如今高高飘扬的黄白蓝三色旗已经证明，河童群众绝非温顺的待宰羔羊。\n\n临时政府在南方揭竿而起，不仅是为了河童劳工，也是为了河童以及全玄武川的独立与解放，为了达到这个目的，临时政府团结了一切可团结之力量，从§G技师革命者§!到种族工厂主，从§R第三等级§!到§O国家至上派§!，新的共和国将把腐朽的贵族统治秩序从下至上连根拔起，堕落不堪的长老会如今已经众叛亲离，它的买办主子也无不仓皇地逃离玄武川，它如今的一切所谓镇压，都不过只是断脊之犬的最后狂吠。\n\n无论这艘承载着数万河童共和理想的自由方舟今后会航向何处，整个玄武川都将在这一夜春风中脱胎换骨，迎来属于自己的新生。"



POK_egawasando:"江川山道"
POK_egawasando_traits:"迂腐者"
POK_egawasando_desc:"河童自从鬼族魔爪之下独立的那一天起，就在长老会的支配下度过了数不尽的春秋，世袭的玄武川长老会，数百年来一成不变，唯一仍然鲜活着的则河童种族本身对科学与技术的追求，但垄断着一切农业的长老会对之完全不屑一顾，无论玄武川的子民们如何发明创造，长老会始终畏首畏尾地圈着玄武川的一亩三分地，始终不敢，或者说，顽固地不希望向进步迈出一步。\n\n江川山道则是着众多长老会贵族中的一个缩影，但好巧不巧，在他担任执政官之后，革新的浪潮就将妖怪山和他们的圣座一同摇得天翻地覆，渐渐的，河童技师们开始拥有了完全可以与长老会叫板的资本，那就是灵能工业，长老会极度厌恶变革，但他们还是被迫将自己的“政府”进行了改良，以便能和幻想乡周围的共和制或是宪政国家滥竽充数。\n\n连同玄武川的宝藏一起，长老会的腐败与软弱在这对飞来财富的处置中尽数显露，在河童们众目睽睽之下，长老会把天狗商人和人类商人请到了自己的祖国，挤压他们的产品，摧残他们的商业，自然也包括灵能工业在内，也被一心敛财的长老会贵族们收入囊中——只不过，他们最多也只是从买办主子的脂肪下刮下一点肥油罢了。\n\n面对长老会的卖国之行，即便是最温和的绥靖者也难以平静，而面对他们日渐激进的反抗，气急败坏的长老会只能请来天狗老大的帝国宪兵。事实证明，长老会的任何战略眼光都是极为失败的，他们稀里糊涂地跟着天狗帝国参加了下玄武川战争，却在是非不明的和谈中割让了东南方的广袤土地，国家的分裂，更让长老会的统治权威堕入谷底，但贵族们仍旧毫不在乎，正如江川山道和他的长老会幕僚们一样，无论是什么经济危机，还是买办卖国，他们只需在酒池肉林中尽情享受，就能够把这一切抛之脑后。\n\n§R而事实恰恰相反，河童们的愤恨之火早已熊熊燃烧，长老会的掩耳盗铃再不长久了，也许下一次，这群历史的古董们再次迎来的，就是自己的丧钟。§!"

POK_republicanism_party:"玄武川河童长老会"