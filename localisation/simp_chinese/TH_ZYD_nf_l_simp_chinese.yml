  ZYD_tudijiaoyisuode_idea:0 "土地交易所得" 
  ZYD_tudijiaoyisuode_idea_desc:0 "实际上我们才是东边村落土地交易的最大买家兼卖家，似乎目前他们的情况有点不太好并且开始对我们产生敌意，可是商人不就该这样吗？！"   

  ZYD_TheEndlessSurgeOfGhost_idea:0 "不断涌现的亡灵"
  ZYD_TheEndlessSurgeOfGhost_idea_desc:0 "由于三途河关闭了和我们之间的道路，那些本来奔向冥界的亡灵不得不滞留在我们的土地上。尽管我们已努力在想办法安置他们，但随着时间的推移，他们的数量任在增长，并和我们发生了严重冲突，我们必须尽快解决他们！要么接纳他们作为我们的一员，要么就送他们立地成佛！"

  ZYD_TheRiftofLifeandDeath_idea:0 "生与死的隔阂"
  ZYD_TheRiftofLifeandDeath_idea_desc:0 "亡灵的涌来彻底打破了我们社会的旧有秩序。在这个新旧交替的时代，生者对亡灵的猜忌与敌意日益加剧，而亡灵也在社会边缘寻求自己的位置。信任正在崩塌，冲突正在酝酿，中有道正走向分裂的未来。"

  ZYD_SmugglingCrisis_idea:0 "走私危机"
  ZYD_SmugglingCrisis_idea_desc:0 "中有道曾是一个繁荣的商业国度，和周边国家展开了良好的贸易合作。然而，随着亡灵对社会秩序的冲击，开始有一些不法分子在我们视线之外进行非法贸易，暗中操控黑市和走私网络。这些走私活动不仅吞噬了我们珍贵的资源，也严重侵蚀了国家的财政和社会秩序。"

  ZYD_BacktheSmugglingNetwork_idea:0 "支持走私网络"
  ZYD_BacktheSmugglingNetwork_idea_desc:0 "尽管他们控制的走私网络腐蚀了国家的根基，但这些地下组织在物资流通方面有着我们难以比拟的效率。如今，我们可以选择继续打击他们，也可以将他们纳入体制，予以扶持和监管，让这股暗流为我们所用——哪怕代价是进一步模糊法律与权力的界限。"






  ZYD_TheEndlessSurgeOfGhost_category:0 "亡灵涌来"
