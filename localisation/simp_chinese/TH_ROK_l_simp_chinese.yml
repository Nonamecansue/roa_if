#——————————种族派—————————————#
ROK_kawabejouji:"川辺常治"
ROK_kawabejouji_traits_1:"全玄武川河童最高统领"
ROK_kawabejouji_traits_2:"匠律者"
ROK_kawabejouji_desc:"川辺常治来自下玄武川的中层技师家庭，在前结界危机时代，川辺常治在安宁的生活中与政治并无联系，即便是在长老会放入外资之后，川辺常治的家业也侥幸地跻身于这些强大的工业寡头当中。\n\n但恰恰在他接手了这一切之时，下玄武川战争爆发了，他和家人只能向北撤离，留下将在一众废墟中寻得归宿的产业，他作为难民得到了收容，他也曾希望参军，和妖怪山联军一起，夺回下玄武川的土地，而当他正要上战场之时，贤者调停了战争，但令他愤怒且无法理解的是，贤者在所谓的和谈中将包括自己家乡的下玄武川大地通通割让给了吸血鬼帝国，而长老会与天狗帝国却默许了这样的不公发生在自己的祖国，霎时间，玄武川的河童种族主义高涨，川辺常治跻身于这批狂热的河童队伍中，他加入了多个种族主义社团，接触了法团主义以及外界国家社会主义，而在对战争的反思中，川辺常治着眼于工业的重要性，认为应当在法团经济基础下，利用国家性的工业纪律，来让劳工服从于生产，并摧毁所有的买办与大资本垄断——以这样的思想为主导，玄武川国家党由他一手建立起来，尽管厌恶激进革命的雅各宾派和优柔寡断的技师同盟，川辺常治还是选择了与地下反对派实用性的合作。\n\n如今，国家党早已借助共和派之手，除掉了卖国求荣的长老会，而川辺常治的愿景则已经近在咫尺，为了实现玄武川河童的复兴与统一，必须要将整个国家改造成一座强有力的铁腕工厂，以统一山童与下玄武川的纲领，发动足以震撼八坂神明与吸血鬼帝国的泰坦机器，从此再无回头之余地。"

