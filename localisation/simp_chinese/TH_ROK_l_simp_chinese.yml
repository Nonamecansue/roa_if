#——————————技师同盟——————————#
ROK_kawashironitori:"河城荷取"
ROK_kawashironitori_traits_1:"玄武川共和国总统"
ROK_kawashironitori_traits_2:"进取者"
ROK_kawashironitori_desc:"在这场大革命发动之前——在遥远的结界20年代，河城荷取的名字鲜为人知，她既不是技师，也不是农民，而只是一个再低贱不过的修理工，她曾有一个短暂的家庭，也就是同姐姐相依为命的那段时间，而自从见取不知所踪之后，荷取几经周折，最终才被一个技师师傅收留。在今后，荷取就随着自己的师傅一起，在玄武川，乃至是妖怪山四处奔波着，尽管每一次的游走，都伴随着极为繁重的工作，但她仍旧乐于跟在师傅身边学习技术，师傅也没有丝毫吝啬，把毕生的所知所学都传授给她，就如同对待自己的孩子一般。\n\n在数十年后，拥有自己作坊的河城荷取告别了年迈的师傅，也因为她自己的特殊灵能能力，她得到了长老会的重用，与青川清告一同，在为妖怪山服务的秘密科学研究所工作，尽管作为内部人员的她必须对科研所的一切保密，但她仍旧向技师大众普及了一部分被高层垄断的技术，引起了长老会的不满，青川清告也趁此机会，把河城荷取排挤出了科研所。\n\n只不过，她的科研生涯从未就此结束，尽管作坊的经营仍旧繁忙，她却仍旧刻苦地钻研着那些此时还难以流入的外界技术，联合一部分技师朋友一起，开发了最早的电气技术，这样的成就让她在妖怪山名声大振，但也让她成为保守派众矢之的的对象，很快，她就被长老会以协助红枫党的名义而逮捕。\n\n这段近乎虚无缥缈的时光让河城荷取十分恍惚，待到她被释放之时，已经是结界125年，她开始投身于新兴的灵能产业工艺当中，并进入了天狗能源企业，成为了一名技术顾问，在这里，她对技术革新的喜悦在一天之内就被浇灭，先进的工业培育着的却是啃食劳工的流水线机器，而科研所也在为战争机器研制着各种残酷与恐怖的武器。与此同时，故国在战后的动荡也让她无比揪心，她回到九天瀑布，团结了旧友，建立了技师同盟，并着力为失去地位的技师发声，反对长老会的共和派们也开始逐渐加入她的结社，在潜移默化中，她也开始支持共和制——尽管她从未想过入主政治，她仍旧被推举成为了玄武川最大地下反对党的领袖。\n\n而随着河童处境的恶化，共和革命的大帐篷也被组织起来，无论是旧亲还是新识，河城荷取都乐于将他们团结在临时政府的旗帜之下，在推翻长老会之后，她也准备好与实际派竞选总统，但对她来说，政治只是她改变妖怪山的手段，科学一定要用来引领进步，而不是制造毁灭——这是她前危机时代就立下的原则，而如今她也会将这一原则贯彻至终。"


ROK_progressivism_party:"卡帕技师进步同盟 理想派"
ROK_kitaeyumeten:"北江梦天"
ROK_kitaeyumeten_traits_1:"玄武川共和国总统"
ROK_kitaeyumeten_traits_2:"理纲者"
ROK_kitaeyumeten_desc:"玄武川的技师也许有千千万万，但真正能够脱颖而出的，却从来是极少数，除了河城荷取，北江梦天也在这批出色的河童之列。只不过她并未生活在玄武川，而是生活在从来都与新鲜事物相挂钩的天狗帝国境内，她的父母作为顶流的科研人员得到了帝国的重用，这也使得她受到了精英式的培训，旨在让她同自己的父母一般，从事高精尖的技术攻坚。\n\n在她的求学生涯中，她先后参与了帝国电气化的各种项目，还在最新灵能应用的研究上大有建树，这也让以她为代表的精英河童得到帝国的重视。但从学院毕业后的北江梦天并未留在帝国，而是回到了自己未曾谋面的玄武川，她不愿为帝国的政治目的服务，只希望能用自己的学识造福祖国。\n\n只不过，玄武川和她想的近乎大相径庭，长老会早已把每一寸丰腴肥沃的地势都拱手让给了外国工厂主，而在他们的一手操纵下，技师们也纷纷走向破产，投入到买办工厂的流水线当中，更令她气愤的是，长老会甚至容许外国科技企业取缔本国的研究院，这对整个玄武川国家来说，无异于科学自杀，她数次要求向长老会反映国家以及河童技师的现状，但都无一例外被冷落。\n\n上书无果后的北江梦天意识到了长老会的傀儡性，她不能再容忍这些卖国贼继续掌控国家，于是，她也加入了同为地下反对派的技师同盟，但比起过于理想的纲领，北江梦天认为当务之急是建立河童们自己的工业产业，把买办资本赶出玄武川，在这样观点的影响下，她成为了新河童小工厂主的代言人，与技师同盟的主力不相上下。她当然知道，新工厂主们完全也是人人自危的投机者，但这一切只是她独立共和国算盘中的其中一环，只有在实际与效率的政策中，玄武川国家才能走向真正的独立自主。"

ROK_republicanism_party:"卡帕技师进步同盟 实际派"
#——————————雅各宾委员会————————#
ROK_kawashirokenshu:"河城见取"
ROK_kawashirokenshu_traits_1:"全玄武川雅各宾武装委员会主席"
ROK_kawashirokenshu_traits_2:"逐日者"
ROK_kawashirokenshu_desc:"什么样的生活，才足够锻造一个革命者呢，苦其心志，劳其筋骨，饿其体肤，空乏其身？也许河城见取的生活就足以将命运的恶意展露得淋漓尽致。\n\n河城见取并非举目无亲，河城荷取是其妹，河城姐妹本过着艰难但平静的生活，但不知从何时起，她们的邻里街坊开始传着一个流言，一个关于她们，或者说——关于河城见取本身的谣言，她并非与荷取为同父之人，甚至更甚者，有她的父亲或母亲为人类一说，但总而言之，都最终会指向河城见取本人是一个混种河童的事实，她一度遭到各种驱逐与厌恶，最终无法忍受蜚语流言的她离开了玄武川，与妹妹相离散——这一别，两人再未见面。\n\n不知向东漂泊了多少岁月，河城见取不知何时已经来到了陌生的旧地狱，她在无法地带被当地的矿场贵族抓住，成为了开采地底灵魂的矿工，她每日的工作都在灼热，恐怖，和低声下气中度过，在无尽的仇恨中，河城见取终于对贵族老爷动了杀心，只不过，她的计划失败了，她被身无分文地流放到东北方的荒凉地带，本来已经死心了的她，这时却在无人区中遇见了旧都管理者星熊勇仪，她很痛快地帮助了见取，并帮助她来到旧都城居住，并引荐她来到旧都卫队中服役，她的军旅生涯数十年如一日，如今她已经是一概军官，但生活并未就此结束——因为结界危机就要到来了。\n\n在古明地整合战争中，她与星熊勇仪同站在了旧地狱共和派的那一边，在合众共和国成立后，她阅览了众多外界书籍，也理清了自己苦难的来源，但她并不认可古明地觉建立的共和政体，并不是因为她反对共和制——而是古明地觉的政权只像是她与工厂主幕僚们的家长制国家，她开始成为军中的反对派，也因此与上司发生了冲突，而这一切则以她离开旧地狱而告终。\n\n她回到了阔别已久的玄武川，如今这里已经成为了齿轮与烟囱的世界，但她还来不及感叹家乡的新变化，下玄武川战争就将妖怪山拖入了深渊，她指挥着部队与天狗并肩作战，但下玄武川远比任何战场骇人，她负伤被送到了大后方的天狗帝国境内，直到数月后才得知战事结束的消息。\n\n而她并没有返回祖国，因为一个声名远扬的天狗组织已经吸引了她，那就是风雷启的秋日学社，她成为了秋日社的追随者，风雷启也将她发展为了军中的激进革命派，她在此期间认清了下玄武川战争的本质，而亦知晓了长老会的腐朽，在秋日社中两年后，河城见取以归国军官的名义回到了玄武川，并在军中发展了同志，以秋日社分部的名义，建立了雅各宾委员会，成为了军装的激进组织，在地下与其他的反建制者们一起，等待着长老会的最终毁灭。\n\n在共和国顺利建立后，河城见取已经成为了国会中的第三等级代表，而于此同时，她的手上也有近乎全玄武川的革命军队，她并不希望流血牺牲换来的革命政权又一次成为工厂主掌权的工具，一场革命后的再革命，在所难免。"

