 GER_land_cruiser_equipment_1_desc: "P.1000鼠式陆行舰是德国在二战期间开发的超重型陆行舰概念车。由克虏伯公司在1942年提出，该设计设想了一个1000吨的装甲庞然大物，配备两门280毫米舰炮，多个副武器，装甲厚达360毫米。鼠式陆行舰的目的是作为一个移动堡垒，能够压制任何战场上的对手。然而，由于其巨大的尺寸，高燃料消耗和后勤上的不可行性，该项目被认为是不可行的，并最终在1943年被取消。"
