 transport_chopper_equipment_desc:0 "在1910年代，欧洲战场的某些特定地区使用了一种略显原始的设计，即“大战秃鹫 ”，它是根据声音与蜂群的声音进行比较而命名的。见证了在伊比利亚和意大利的服役，秃鹰在海上为部队提供补给方面很有用。"
 transport_chopper_equipment_2_desc:0 "改进了大战设计的秃鹫II型，在短距离上提供和运输部队的能力得到了提高。比起它的大战祖父秃鹫 II型更灵活、更快速。似乎可以完美地应对任何即将到来的冲突。"
 transport_chopper_equipment_3_desc:0 "秃鹫III型采用了两种旋转叶片发动机系统，为上一代运输机提供了相对快速、灵活的替代方案，是相对于秃鹫II型的巨大进步。正如士兵们称之为“篮球手”一样，它是运输工作的合适工具。"
 attack_chopper_equipment_1_desc:0 "运输直升机是一个自20世纪20年代以来一直设想的概念，当时军方试图将其在大战期间取得的运输技术进一步军事化。然而，重量和速度的问题让这一设想变得渺茫，直到最近为止。运输直升机成功克服了种种困难，提供了一种廉价的近距支援机替代品。"
 attack_chopper_equipment_2_desc:0 "随着我们对物理定律的理解继续加深，我们在天狼方面取得了更多的进展。天狼II型很大程度上改正了第一代天狼系统的缺点，作为一种攻击型秃鹰战机，它能够飞越更远的距离，更有效地分割敌军。"
 attack_chopper_equipment_3_desc:0 "天狼III型是人类创造的最快的秃鹰战机之一，它是战场上的奇迹，在空中呼啸的声音让敌人战栗不已。由于成本低廉，天狼III型是近距支援机的一个极好的替代品，它证明了自己是战争的未来。"
 motorized_equipment_desc:1 "使用卡车来转移部队、补给，以及提高部队摩托化。"
