 modern_tank_destroyer_equipment:0 "现代陆行舰歼击车"
 modern_tank_destroyer_equipment_desc:0 "现代陆行舰歼击车是早期轻型和中型陆行舰歼击车的进化，改良了机动性和对重装甲的潜行能力。"
