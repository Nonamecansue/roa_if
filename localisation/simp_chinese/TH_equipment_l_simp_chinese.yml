#————————————机械狼蛛——————————#
 gw_automat_1:0 "机械狼蛛 I型"
 gw_automat_1_desc:0 "机械狼蛛是在后复权战争时代涌现出的众多军事发明创造中的其中一列，这种机动装甲依照狼蛛的外形以及关节肢体设计而成，具有极高的机动性和灵活性，能够克服诸如山地，森林等对普通装甲不利的地形。"
 gw_automat_2:0 "机械狼蛛 II型"
 gw_automat_2_desc:0 "机械狼蛛是在后复权战争时代涌现出的众多军事发明创造中的其中一列，这种机动装甲依照狼蛛的外形以及关节肢体设计而成，具有极高的机动性和灵活性，能够克服诸如山地，森林等对普通装甲不利的地形。"
 gw_automat_3:0 "机械狼蛛 III型"
 gw_automat_3_desc:0 "机械狼蛛是在后复权战争时代涌现出的众多军事发明创造中的其中一列，这种机动装甲依照狼蛛的外形以及关节肢体设计而成，具有极高的机动性和灵活性，能够克服诸如山地，森林等对普通装甲不利的地形。"
 gw_automat_4:"机械狼蛛 IV型"
 gw_automat_4_desc:0 "机械狼蛛是在后复权战争时代涌现出的众多军事发明创造中的其中一列，这种机动装甲依照狼蛛的外形以及关节肢体设计而成，具有极高的机动性和灵活性，能够克服诸如山地，森林等对普通装甲不利的地形。"
 gw_automat_5:"机械狼蛛 V型"
 gw_automat_5_desc:"机械狼蛛是在后复权战争时代涌现出的众多军事发明创造中的其中一列，这种机动装甲依照狼蛛的外形以及关节肢体设计而成，具有极高的机动性和灵活性，能够克服诸如山地，森林等对普通装甲不利的地形。"



#————————————电气犰狳——————————————#
 tripod_automat_0:0 "电气犰狳 I型"
 tripod_automat_0_desc:0 "正如外界人长久以来的发明思路一样，动物永远是最好的设计师，电气犰狳的设计灵感来源于犰狳这种动物，利用对犰狳体型结构的模仿与装甲结合，电气犰狳能够灵活地在地底穿行，执行各种隐蔽任务，包括伏击，战略资源运输等，也能够进行矿物勘探与工程挖掘。"
 tripod_automat_1:0 "电气犰狳 II型"
 tripod_automat_1_desc:0 "正如外界人长久以来的发明思路一样，动物永远是最好的设计师，电气犰狳的设计灵感来源于犰狳这种动物，利用对犰狳体型结构的模仿与装甲结合，电气犰狳能够灵活地在地底穿行，执行各种隐蔽任务，包括伏击，战略资源运输等，也能够进行矿物勘探与工程挖掘。"
 tripod_automat_2:0 "电气犰狳 III型"
 tripod_automat_2_desc:0 "正如外界人长久以来的发明思路一样，动物永远是最好的设计师，电气犰狳的设计灵感来源于犰狳这种动物，利用对犰狳体型结构的模仿与装甲结合，电气犰狳能够灵活地在地底穿行，执行各种隐蔽任务，包括伏击，战略资源运输等，也能够进行矿物勘探与工程挖掘。"
