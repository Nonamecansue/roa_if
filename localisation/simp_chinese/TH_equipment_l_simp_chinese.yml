 medium_plane_airframe_1:0 "基础中型机身"
 medium_plane_airframe_1_desc:0 "通过应用最近开发的最新技术，这种机身比类似尺寸的前代机身的能力要大得多。"
 medium_plane_airframe_2:0 "改进型中型机身"
 medium_plane_airframe_2_desc:0 "利用现代化生产技术，这种机身使得飞机能够携带更大的载荷执行更长距离的任务。"
