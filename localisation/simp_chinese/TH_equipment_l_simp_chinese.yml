 heavy_tank_aa_chassis_2:0 "改进型重型自行防空炮"
 heavy_tank_aa_chassis_3:0 "先进型重型自行防空炮"
 main_battle_tank_chassis:0 "现代陆行舰底盘"
 modern_tank_chassis:0 "现代陆行舰底盘"
 modern_tank_chassis_desc:0 "一款现代化的底盘，大量借鉴了之前的中型陆行舰设计，但更加强调速度和机动性，同时也允许携带比通常的中型陆行舰更厚的装甲和更强的火炮。最终的结果就是得到了一款可以担任各种角色的战车。"
 main_battle_tank_chassis_desc:0 "经验表明，轻型、中型和重型陆行舰的设计变的越来越趋同。重型陆行舰逐渐变得更具机动性，而轻型陆行舰则携带更重的武器和装甲以求生存。因此，设计者逐渐将所有这三种设计统一为一种类型，即通用主战陆行舰。"
 modern_tank_chassis_1:0 "现代陆行舰底盘"
 modern_tank_artillery_chassis:0 "现代自行火炮"
 modern_tank_artillery_chassis_desc:0 "一款现代战车，旨在作为一种功能齐全的火炮，可以跟上现代陆行舰的步伐，并可以抵御战场上的任何威胁"
 modern_tank_artillery_chassis_1:0 "现代自行火炮"
 modern_tank_destroyer_chassis_desc:0 "一款现代战车，旨在对敌方陆行舰的攻击进行快速反击，同时并具有相对应的装甲防护和机动性。"
 modern_tank_destroyer_chassis_1:0 "现代陆行舰歼击车"
 modern_tank_destroyer_chassis:0 "现代陆行舰歼击车"
 modern_tank_aa_chassis_desc:0 "一款现代战车，旨在保证机动性和防护性以抵御敌方的空中袭击。"
