 basic_medium_tank_chassis_short:0 "1938 中型"
 basic_medium_tank_chassis_desc:0 "虽然轻型陆行舰再过去一段时间内已经成为机械化部队的支柱，但很明显它的增长潜力以濒临耗尽。在不远的未来，我们将会需要一款更大的但仍然保持着卓越机动性的战车。"
 improved_medium_tank_chassis:0 "改进型中型陆行舰底盘"
 improved_medium_tank_chassis_short:1 "1940 中型"
 improved_medium_tank_chassis_desc:0 "基于上一代中型陆行舰的设计经验，显然我们需要一款具有更大承载能力的陆行舰底盘，才能保证它们的战斗力。"
 advanced_medium_tank_chassis:0 "先进型中型陆行舰底盘"
 advanced_medium_tank_chassis_short:0 "1943 中型"
 advanced_medium_tank_chassis_desc:0 "武器系统重量的快速上升以及陆行舰对装甲厚度越来越依赖，使得我们急需一款更大的底盘，这将使我们的中型陆行舰的尺寸更接近于早期的重型陆行舰。"
