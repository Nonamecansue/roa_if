 medium_tank_flame_chassis_0:0 "战间期型中型喷火陆行舰"
 medium_tank_flame_chassis_desc:0 "一款中型战车，在其炮塔中携带火焰喷射器用以攻击防御工事和房屋。"
 medium_tank_flame_chassis_1:0 "基础型中型喷火陆行舰"
 medium_tank_flame_chassis_2:0 "改进型中型喷火陆行舰"
 medium_tank_flame_chassis_3:0 "先进型中型喷火陆行舰"
 heavy_tank_flame_chassis_0:0 "战间期型重型喷火陆行舰"
 heavy_tank_flame_chassis_desc:0 "一款大型战车，在其炮塔中携带火焰喷射器用以攻击防御工事和房屋。"
 heavy_tank_flame_chassis_1:0 "基础型重型喷火陆行舰"
 heavy_tank_flame_chassis_2:0 "改进型重型喷火陆行舰"
 heavy_tank_flame_chassis_3:0 "先进型重型喷火陆行舰"
 light_tank_flame_chassis:0 "轻型喷火陆行舰"
 medium_tank_flame_chassis:0 "中型喷火陆行舰"
 heavy_tank_flame_chassis:0 "重型喷火陆行舰"
 amphibious_tank_chassis:0 "两栖陆行舰底盘"
 amphibious_tank_chassis_desc:0 "一种专门设计用于漂浮的小型底盘，为此其对携带的武器尺寸和装甲厚度有着严格的要求。"
 amphibious_tank_chassis_1:0 "两栖陆行舰底盘"
 gwtank_chassis:0 "战间期型陆行舰开发"
 gwtank_chassis_desc:0 "陆行舰在世界大战中证明了自己是一种强大的武器。尽管在此之后陆行舰发展放缓，但毫无疑问，它将在未来的战争中发挥重要作用。"
 combatagate_equipment:0 "斗兽"
 combatagate_equipment_0:0 "原型斗兽"
 combatagate_equipment_0_desc:0 "与1920年发明，是肉牛增产项目的失败副产物，后被拿来当作冲击骑兵的替代品。这些生物会在高度活跃的状态下向敌军放出，在十二到十四小时后会根据预设的生物钟死于器官衰竭，减轻了善后的工作量。"
 combatagate_equipment_1:0 "突击型斗兽"
 combatagate_equipment_1_desc:0 "突击型斗兽的原型斗兽的人工进化产物，其存在的意义要么是在上帝脸上吐痰，要么是证明上帝早就抛弃了我们。这种新型斗兽比起动物更像是一团转基因肉块，它们的生理结构极度不稳定，暴露在氧气下后会在数分钟内就开始分解。近在眼前的死亡似乎能激励它们更凶悍地战斗。"
 combatagate_equipment_2:0 "猎手型斗兽"
 combatagate_equipment_2_desc:0 "这种新型斗兽是由最顶尖的遗传学科技改造而成，被赋予猎手之名。它的每一个细胞，每一个有机分子都是为了纯粹的杀戮和战斗而生。高级脑功能已被锁死，使控制员可以可以通过化学标记和电击来指挥兽群作战。"
 hardsuit_equipment:0 "动力甲"
 hardsuit_equipment_desc:0 "$hardsuit_desc$"
 hardsuit_equipment_0:0 "$hardsuit_equipment$"
 hardsuit_equipment_0_desc:0 "$hardsuit_desc$"
 razormaiden_augments_equipment:0 "刀锋少女强化身体组件"
 razormaiden_augments_equipment_0:0 "刀锋少女强化身体组件"
 razormaiden_augments_equipment_0_short:0 "刀锋少女强化身体组件"
 razormaiden_augments_equipment_0_desc:0 "虽然从未在战时进入服役，战间期许多机械狂热者都以自身为实验品，不断地追求着更快，更高与更致命的极限。此类实践推动了刀锋少女的发展。其为一种独特的特种作战单位，主要由高度增强过的女性组成。这些单位无处不经过改造，使她们成为了迅捷的杀戮机器，某些更是在字面上武装到了牙齿。"
 jet_trooper_suit_equipment: "喷气战士装备"
 jet_trooper_suit_equipment_0:0 "$jet_trooper_suit_equipment$"
 jet_trooper_suit_equipment_0_desc:0 "喷气战士装备能让经过特殊训练的士兵以极高的速度机动。该装备中的喷气背包使用水氢化合推进剂，其可达到的飞行速度和高度堪称科幻。装备套装中还包含了单兵武器和索敌目镜。"
 replicated_biomass_equipment:0 "复制有机物"
 replicated_biomass_equipment_desc:0 "任何军队都梦想着能有一群可以毫无迟疑执行任何命令的士兵。而现代科技能在某种程度上将这个梦想变为可能。复制体的高级脑功能被有意阉割了，但其剩余的智力足够它们理解并执行收到的命令，不管这命令有多离谱。\n\n现在，我们可以放手让这些量产生物去填线，从而将更多的精力放在高精尖的核心力量上。"
 replicated_biomass_equipment_0:0 "复制有机物"
 naval_equipment:0 "舰船"
 destroyer_1:0 "驱逐舰 I型"
 destroyer_2:0 "驱逐舰 II型"
 destroyer_3:0 "驱逐舰 III型"
 destroyer_4:0 "驱逐舰 IV型"
 destroyer_1_desc:0 "为了确保运输船的安全，第一次世界大战的驱逐舰需要更改它们的定位并改变它们的设计。新的设计将拥有更多的鱼雷来增加与敌人交火的机会。"
 destroyer_2_desc:0 "更长的鱼雷射程和更快的装填时间，外加诸如高角炮塔的新设计将使我们的驱逐舰变成更高效的多面手。"
 destroyer_3_desc:0 "为了应对来自空中以及水下的威胁，新型驱逐舰必须装备有雷达和更加先进的防空与反潜武器。"
 destroyer_4_desc:0 "现代驱逐舰必须拥有多种不同的索敌装备，新型的深弹投放系统以及与以前的驱逐舰相比更大的吨位。"
 light_cruiser_1:0 "轻巡洋舰 I型"
 light_cruiser_2:0 "轻巡洋舰 II型"
 light_cruiser_3:0 "轻巡洋舰 III型"
 light_cruiser_4:0 "轻巡洋舰 IV型"
 light_cruiser_1_desc:0 "快速灵活的轻巡洋舰仍然是执行侦察任务的一个不错的选择。"
 light_cruiser_2_desc:0 "虽然战后的条约对轻巡洋舰提出了诸多限制，但是人们还是在条约的限制内设计出了火力出众的轻型船只。"
 light_cruiser_3_desc:0 "现在条约的限制解除了，人们可以设计更大也更重的巡洋舰，不过较弱的火力使它们还只能被划分为轻巡洋舰。"
 light_cruiser_4_desc:0 "由于战术中常常被用于保护其他大型船只，现代轻巡洋舰可以摆脱过去的种种限制并专心应对来自空中的威胁。"
 heavy_cruiser_1:0 "重巡洋舰 I型"
 heavy_cruiser_2:0 "重巡洋舰 II型"
 heavy_cruiser_3:0 "重巡洋舰 III型"
 heavy_cruiser_4:0 "重巡洋舰 IV型"
 heavy_cruiser_1_desc:0 "华盛顿海军条约设立的目的就是为了避免巡洋舰以及其他舰种的竞赛，然而这看起来是不可避免的。通过削弱装甲，军舰上可以装备的武器大大增多。"
 heavy_cruiser_2_desc:0 "虽然人们在条约中做了很多努力，但是在轻巡洋舰上装备更重的武器仍然是一种很有效的方法，尽管装甲依然十分贫弱。"
 heavy_cruiser_3_desc:0 "由于越来越多的国家开始无视条约的限制，人们现在可以建造装甲更重更平衡的重巡洋舰了。更好的防空武器能使它们在对空战斗中发挥更大的作用。"
 heavy_cruiser_4_desc:0 "这些重巡洋舰的最终型号往往更长、更大也更重，它们还装备有高射速的速射武器。"
 battle_cruiser_1:0 "战列巡洋舰 I型"
 battle_cruiser_2:0 "战列巡洋舰 II型"
 battle_cruiser_3:0 "战列巡洋舰 III型"
 battle_cruiser_4:0 "战列巡洋舰 IV型"
 battle_cruiser_1_desc:0 "一战之后战列巡洋舰的火力竞赛催生出了几种火力强大，牺牲了装甲来获得相对战列舰的航速优势的设计。"
 battle_cruiser_2_desc:0 "为了保持对现代战列舰的速度优势，改进并且重新定位后的战列巡洋舰装甲更加贫弱，但它们现在拥有了更好的火控、索敌以及对空防御系统。"
 armor_desc:0 "用钱可以买到的最大最强的装甲。"
 battleship_1:0 "战列舰 I型"
 battleship_2:0 "战列舰 II型"
 battleship_3:0 "战列舰 III型"
 battleship_4:0 "战列舰 IV型"
 battleship_5:0 "战列舰 V型"
 battleship_6:0 "战列舰 VI型"
 battleship_1_desc:0 "虽然有些人认为战列舰是属于过去的海战的古董，但是另一些人认为它们是人类有史以来最令人印象深刻的舰船。没有人会否认这些战列舰竞赛的遗物是人们建造过的火力最强大、装甲最坚实的军舰。"
 battleship_2_desc:0 "在不打破海军条约限制的前提下，新一代的战列舰与之前的设计相比拥有更好的稳定性以及更远的航程。"
 battleship_3_desc:0 "只要使用得当，拥有更厚的装甲，更强劲的引擎，大口径的火炮以及更强的防空能力的战列舰在空军慢慢变成主角的海战中仍可找到自己的一席之地。"
 battleship_4_desc:0 "各国海军都在思考战列舰还会面对什么重大威胁。最终，人们发现强大的武装和防空火力显得比从前任何时候都更为重要。"
 SH_battleship_1:0 "超重战列舰 I型"
 SH_battleship_2:0 "超重战列舰 II型"
 SH_battleship_1_desc:0 "在当前的世界形势下遵守海军条约已经变得完全没有必要了。挣脱了种种限制之后，我们现在可以全心全意地建造能同时对付数艘较小敌舰的、有史以来最重并且装备最优良的战列舰。"
 SH_battleship_2_desc:0 "我们在之前的超重战列舰上装上了更强大的武器以及改装过的火控系统。"
 carrier_1:0 "航空母舰 I型"
 carrier_2:0 "航空母舰 II型"
 carrier_3:0 "航空母舰 III型"
 carrier_4:0 "航空母舰 IV型"
 carrier_5:0 "航空母舰 V型"
 carrier_6:0 "航空母舰 VI型"
 carrier_1_desc:0 "很多军事理论家相信未来是属于海军航空兵的。老旧的主力舰以及邮船改装的航空母舰将是这些新理论的第一个试验场。"
 carrier_2_desc:0 "第一种专用航空母舰的设计工作开始了，我们必须确保这种航空母舰在不违反海军条约的前提下，有足够远的航程和足够快的速度来跟上舰队中其他的军舰。"
 carrier_3_desc:0 "改进的建造方式以及诸如甲板边升降机这类的更加专业的系统使这些航空母舰可以更高效的携带更多飞机。"
 carrier_4_desc:0 "随着海军条约被越来越多的国家所无视，我们现在可以建造能携带前所未有的数量的飞机来确保制空权的航空母舰了。"
 submarine_1:0 "潜艇 I型"
 submarine_2:0 "潜艇 II型"
 submarine_3:0 "潜艇 III型"
 submarine_4:0 "潜艇 IV型"
 submarine_1_desc:0 "潜艇是擅长于对付无武装的运输船的暗影猎手。这些一战时期的早期型号为新海战方式的出现铺平了道路。"
 submarine_2_desc:0 "新的潜艇拥有更好的武装以及更佳的稳定性，它们在设计中就考虑到了海军战术的最新发展并拥有更大的航程来满足袭击更远的航运路线的需要。"
 submarine_3_desc:0 "关于潜艇在舰队中除了袭击运输船之外还应担任什么角色目前还有很大争议。各国海军都需要一种速度、航程以及武器三方面较为均衡的潜艇。"
 submarine_4_desc:0 "现代潜艇有着更深的测试潜深和更为优化的布局。根据战场上得到的经验，人们还为它们安装了更加合理的武器以及引擎。"
 ship_hull_light_1:2 "早期驱逐舰船体"
 ship_hull_light_2:2 "1936驱逐舰船体"
 ship_hull_light_3:2 "1940驱逐舰船体"
 ship_hull_light_4:2 "1944驱逐舰船体"
 ship_hull_light_1_desc:0 "为了确保运输船的安全，第一次世界大战的驱逐舰需要更改它们的定位并改变它们的设计。新的设计将拥有更多的鱼雷来增加与敌人交火的机会。"
 ship_hull_light_2_desc:0 "更长的鱼雷射程和更快的装填时间，外加诸如高角炮塔的新设计将使我们的驱逐舰变成更高效的多面手。"
 ship_hull_light_3_desc:0 "为了应对来自空中以及水下的威胁，新型驱逐舰必须装备有雷达和更加先进的防空与反潜武器。"
 ship_hull_light_4_desc:0 "现代驱逐舰必须拥有多种不同的索敌装备，新型的深弹投放系统以及与以前的驱逐舰相比更大的吨位。"
 ship_hull_cruiser:0 "巡洋舰"
 ship_hull_cruiser_desc:0 "舰队中的骨干，巡洋舰承担了诸多重要职责，从轻巡洋舰的侦查与护卫工作到重巡洋舰支援战列线的工作。"
 ship_hull_cruiser_1:1 "早期巡洋舰船体"
 ship_hull_cruiser_2:1 "1936巡洋舰船体"
 ship_hull_cruiser_3:1 "1940巡洋舰船体"
 ship_hull_cruiser_4:1 "1944巡洋舰船体"
 ship_hull_cruiser_1_desc:0 "即使是受到了华盛顿海军条约的限制，巡洋舰仍然是功能最多的舰种。该船体允许建造用于侦察与护卫用途的轻巡洋舰，亦或是用于支援战列线的重巡洋舰。"
 ship_hull_cruiser_2_desc:0 "次世代的巡洋舰具备能够加强其生存性的新式发动机布局，并为专用的飞机弹射器预留了位置。"
 ship_hull_cruiser_3_desc:0 "当世界上的巡洋舰变得更加强大和能干，她们将需要更新和更大的船体以容纳新增的设备。"
 ship_hull_cruiser_4_desc:0 "通过实战中获得的经验影响，最新世代的巡洋舰重新安排了上层建筑的结构以获得更宽广的防空火力射界，并更新了内部的布局以支持雷达的使用。"
 ship_hull_heavy:0 "重型战舰"
 ship_hull_heavy_desc:0 "作为海权的终极象征，这些重甲巨兽在公海上仍然令人敬畏，即使某些专家质疑它们在飞机和潜艇的时代所能扮演的角色。"
 ship_hull_heavy_1:1 "早期重型战舰船体"
 ship_hull_heavy_2:1 "1936重型战舰船体"
 ship_hull_heavy_3:1 "1940重型战舰船体"
 ship_hull_heavy_4:1 "1944重型战舰船体"
 ship_hull_heavy_1_desc:0 "虽然有些人认为战列舰是属于过去的海战的古董，但是另一些人认为它们是人类有史以来最令人印象深刻的舰船。没有人会否认这些战列舰竞赛的遗物是人们建造过的火力最强大、装甲最坚实的军舰。"
 ship_hull_heavy_2_desc:0 "在不打破海军条约限制的前提下，新一代的战列舰与之前的设计相比拥有更好的稳定性以及更远的航程。"
 ship_hull_heavy_3_desc:0 "只要使用得当，拥有更厚的装甲，更强劲的引擎，大口径的火炮以及更强的防空能力的战列舰在空军慢慢变成主角的海战中仍可找到自己的一席之地。"
 ship_hull_heavy_4_desc:0 "这可能是战列舰在海战上的最后一次登场了，所以威力更强大的火炮和防空炮塔将是维持它最后尊严的所在。"
 ship_hull_carrier:0 "航空母舰"
 ship_hull_carrier_desc:0 "在许多年的实验之后，航空母舰作为一种独特种类的战舰慢慢变得成熟。能够搭载越来越多，越来越强大的舰载机，航空母舰即将成为海军力量投射的最终答案。"
 ship_hull_carrier_0:1 "早期航空母舰船体"
 ship_hull_carrier_conversion_bb:1 "改装战列舰船体"
 ship_hull_carrier_conversion_ca:1 "改装巡洋舰船体"
 ship_hull_carrier_1:1 "1936航空母舰船体"
 ship_hull_carrier_2:1 "1940航空母舰船体"
 ship_hull_carrier_3:1 "1944航空母舰船体"
 ship_hull_carrier_conversion_bb_desc:0 "在经历多年的实验后，航空母舰作为一种独特种类的战舰慢慢变得成熟。能够搭载越来越多，越来越强大的舰载机，航空母舰即将成为海军力量投射的最终答案。"
 ship_hull_carrier_conversion_ca_desc:0 "在经历多年的实验后，航空母舰作为一种独特种类的战舰慢慢变得成熟。能够搭载越来越多，越来越强大的舰载机，航空母舰即将成为海军力量投射的最终答案。"
 ship_hull_carrier_1_desc:0 "很多军事理论家相信未来是属于海军航空兵的。老旧的主力舰以及邮船改装的航空母舰将是这些新理论的第一个试验场。"
 ship_hull_carrier_2_desc:0 "第一种专用航空母舰的设计工作开始了，我们必须确保这种航空母舰在不违反海军条约的前提下，有足够远的航程和足够快的速度来跟上舰队中其他的军舰。"
 ship_hull_carrier_3_desc:0 "改进的建造方式以及诸如甲板边升降机这类的更加专业的系统使这些航空母舰可以更高效的携带更多飞机。"
 ship_hull_super_heavy_1:0 "超重型战舰船体"
 ship_hull_super_heavy_1_desc:0 "在当前的世界形势下遵守海军条约已经变得完全没有必要了。挣脱了种种限制之后，我们现在可以全心全意地建造能同时对付数艘较小敌舰的、有史以来最重并且装备最优良的战列舰。"
 small_plane_airframe_0:0 "战间期小型机身"
 small_plane_airframe_0_desc:0 "自世界大战早期开始，航空技术便在迅速进步。这种机身代表了这些发展的顶峰，但它的成长潜能显然有限。"
 small_plane_airframe_1:0 "基础小型机身"
 small_plane_airframe_1_desc:0 "近年来，一系列新技术的诞生使得生产好用的小型飞机成为可能。这种机身代表了这条道路的第一步。"
 small_plane_airframe_2:0 "改进型小型机身"
 small_plane_airframe_2_desc:0 "有了更坚固、更符合空气动力学的结构，这种机身象征着对于基础型号的一次明显的进步。"
 small_plane_airframe_3:0 "先进型小型机身"
