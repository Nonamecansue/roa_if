#————————————绯想天则机甲——————————————#
 quadropod_automat_0:0 "绯想天则机甲 I型"
 quadropod_automat_0_desc:0 "绯想天则机甲本是来自古早时代的河童发明家们昙花一现的灵感，然而在后复权战争时代，绯想天则机甲的设计思路被重新挖掘出来并加以改良，成为了新一代的机动装甲，只不过在后面的设计中，绯想天则机甲被赋予了各种军事性改动，使得原本就具有泰坦铁躯的高大机甲近乎拥有着横扫千军的能力，无论是水陆空三位一体，还是在战斗中所展现出的强大机动性，都使其足以成为比拟末日武器一般的存在。"
 quadropod_automat_1:0 "绯想天则机甲 II型"
 quadropod_automat_1_desc:0 "$quadropod_automat_0_desc$"
 quadropod_automat_2:0 "绯想天则机甲 III型"
 quadropod_automat_2_desc:0 "$quadropod_automat_0_desc$"

#————————————支援装备————————————————#
 support_equipment_short:0 "支援装备"
 support_equipment:0 "支援装备"
 support_equipment_desc:0 "用于支援部队作战的无线电台、吉普车、浮桥和其他装备。"
 support_equipment_1:0 "支援装备"
 support_equipment_1_desc:0 "用于支援部队作战的无线电台、吉普车、浮桥和其他装备。"
#————————————卡车————————————————————#
 motorized_equipment_1:1 "卡车"
 motorized_equipment_1_desc:0 "摩托化是陆军机械化的第一步。民用卡车可以很容易地被用来运输士兵、牵引火炮以及输送装备和补给。这极大地提高了步兵的战略机动能力，使其不再依赖于步行。"
#————————————机械化装备——————————————#
 mechanized_equipment_1:0 "基础型机械化装备"
 mechanized_equipment_1_desc:0 "机械化步兵是利用装甲运兵车或步兵战车进行运输和战斗的步兵部队。机械化步兵与摩托化步兵的区别在于，前者的装甲车辆相比后者的非装甲车辆（卡车或吉普）一定程度上能保护士兵免受敌方炮火的袭击。"
 mechanized_equipment_2:0 "改良型机械化装备"
 mechanized_equipment_2_desc:0 "机械化步兵是装备有装甲运兵车和步兵战车用于运输和战斗的步兵部队。机械化步兵与摩托化步兵的区别在于这些装甲车辆比起摩托化步兵的软面皮轮车辆（卡车或吉普等）一定程度上为步兵提供了免于敌方火力的保护。"
 mechanized_equipment_3:0 "先进型机械化装备"
 mechanized_equipment_3_desc:0 "机械化步兵是装备有装甲运兵车和步兵战车用于运输和战斗的步兵部队。机械化步兵与摩托化步兵的区别在于这些装甲车辆比起摩托化步兵的软面皮轮车辆（卡车或吉普等）一定程度上为步兵提供了免于敌方火力的保护。"
 infantry_equipment_desc:0 "个人和部队使用的步兵武器，以及士兵所需的其他装备。"
 mechanized_equipment_4:"初步三位一体机械化装备"
 mechanized_equipment_4_desc:"与外界的两栖化机械装备的设计思路类似，如果能够为机械化装备开辟出除陆地外的其他战线，那么对后结界危机的战场以及战略将是极具颠覆性的改变，通过将穿梭机与亚光速引擎与机械化装甲结合，不仅能够进一步实现步坦协同，而且在空中或隙间区域的人员运送与支援也能够实现。"
 mechanized_equipment_5:"完善型三位一体机械化装备"
 mechanized_equipment_5_desc:"$mechanized_equipment_4_desc$"

#————————————火炮————————————————————#
 artillery_equipment_1:0 "外界火炮"
 artillery_equipment_1_short:0 "火炮"
 artillery_equipment_1_desc:0 "火炮，是指利用机械能、化学能、电磁能等能源抛射弹丸的身管射击武器，对于曾经的幻想乡来说，在大妖怪和巫师们的绚丽弹幕面前，火炮的地位根本不值一提，但时代终究让幻想乡的一切褪去了神话色彩，露出了其不堪一击的一面，虽然科技有所断层，但外界的火炮依然能够弥补弹幕战斗的火力，甚至比其更胜一筹。"
 artillery_equipment_2:0 "改良型混合火炮"
 artillery_equipment_2_desc:0 "在加农炮管与混合炮弹的完美结合下，第一代混合炮弹火炮已经登上了幻想乡的战争舞台，在今后的无数战争中，满天的炮火将彻底取代旧时代的漫天弹幕，在轰隆炮声中，更是无数敌人的粉身碎骨。"
 artillery_equipment_3:0 "轨道炮"
 artillery_equipment_3_desc:0 "在140s的幻想乡，混合灵能轨道炮无疑是最伟大的武器之一，在极高的电磁动能推动下，混合榴弹将会把目标各个击破，打击精准度也十分可观，避免了任何无效的打击，我们完全能够预料到，轨道炮将在幻想乡建立起强大的技术霸权。"
 anti_air_equipment:0 "牵引式防空炮"
 anti_air_equipment_desc:0 "防空炮主要用来击落敌军的飞机，虽然速射火炮同样对地面目标有效。"
 artillery_equipment:0 "外界火炮"
 artillery_equipment_short:0 "火炮"
 artillery_equipment_desc:0 ""
 artillery_equipment_4:"超先进型灵能伽马炮"



#——————————防空火炮——————————————————#
 anti_air_equipment_1:0 "防空炮"
 anti_air_equipment_short:0 "防空炮"
 anti_air_equipment_1_desc:0 "防空炮主要用来击落敌军的飞机，虽然速射火炮同样对地面目标有效。"
 anti_air_equipment_2:0 "改良型混合防空炮"
 anti_air_equipment_2_desc:0 "使用更强炮弹和炮管的防空火炮可以瞄准高空飞行的飞机。"
 anti_air_equipment_3:0 "先进型混合防空轨道炮"
 anti_air_equipment_3_desc:1 "高级防空炮有着更大的覆盖范围和设计容量，能够打击最快最新的敌机。"
 anti_air_equipment_4:0"超先进型防空伽马炮"
#——————————火箭炮————————————————————#
 rocket_artillery_equipment_1:0 "牵引式火箭炮"
 rocket_artillery_equipment_1_short:0 "火箭炮"
 rocket_artillery_equipment_1_desc:0 "火箭炮比起传统炮组在准确性和稳定性上都要差得多，不过他们拥有多个火箭同时击中单个目标的毁灭性效果。"
 rocket_artillery_equipment_2:0 "先进型火箭炮"
 rocket_artillery_equipment_2_desc:0 "高级火箭炮有着更大的射程和更轻的炮管重量。"
 rocket_artillery_equipment:0 "牵引式火箭炮"
 rocket_artillery_equipment_short:0 "火箭炮"
 rocket_artillery_equipment_desc:0 "火箭炮比起传统炮组在准确性和稳定性上都要差得多，不过他们拥有多个火箭同时击中单个目标的毁灭性效果。"
#——————————反陆行舰炮————————————————#
 anti_tank_equipment_1:0"外界早期反陆行舰炮"
 anti_tank_equipment_2:0 "改良型混合反陆行舰炮"
 anti_tank_equipment_2_desc:0 "大口径火炮用于打击更厚的倾斜装甲防护陆行舰。"
 anti_tank_equipment_3:0 "先进型混合反陆行舰轨道炮"
 anti_tank_equipment_3_short:0"先进型反坦克轨道炮"
 anti_tank_equipment_3_desc:0 ""
 anti_tank_equipment_1:0 "牵引式反陆行舰炮"
 anti_tank_equipment_1_short:0 "反陆行舰炮"
 anti_tank_equipment_1_desc:0 "反陆行舰炮专门使用穿甲弹专门针对陆行舰这样的装甲目标。"
 anti_tank_equipment:0 "牵引式反陆行舰炮"
 anti_tank_equipment_short:0 "反陆行舰炮"
 anti_tank_equipment_desc:0 "反陆行舰炮专门针对陆行舰这样的装甲目标，且通常发射穿甲弹。"
 anti_tank_equipment_4:0"超先进型反陆行舰伽马炮"

#——————————装甲车————————————————————#
 gw_armored_car_equipment:1 "战间期装甲车"
 gw_armored_car_equipment_desc:0 "曾经的装甲车只是民用车辆加上了一层薄钢板，而这款车从一开始设计的时候就是为了配备装甲和轻型武装。"
 armored_car_equipment_1:0 "基础装甲车"
 armored_car_equipment_1_desc:0 "改进的内部布局和额外的弹药存储能够创造一辆更高效的装甲车。"
 armored_car_equipment_2:0 "先进装甲车"
 armored_car_equipment_2_desc:0 "战场形式的变化迫使其需要更重的武器装备和更厚的装甲来击败敌人的轻型部队并幸存下来。"
 armored_car_equipment_3:"改良先进型装甲车"
 armored_car_equipment_3_desc:"随着重型武器的迭代，装甲战车也应当左与时俱进的改造与改良。"
 armored_car_equipment_4:"超先进型装甲车"
 armored_car_equipment_4_desc:"继承了前几代装甲车的全部优势，超先进型装甲车配备了更新化的装甲与火炮武器，相信在这些先进武器的加持下，装甲战车定能称霸一方，"
 armored_car_at_equipment:0 "反陆行舰装甲车"
 armored_car_at_equipment_desc:0 "我们的轻型机械化部队在某个时刻肯定会与敌军装甲部队发生接触。发展一种特殊的反陆行舰衍生装备将给予他们反抗之力。"


#——————————两栖登陆载具——————————————#
 amphibious_mechanized_equipment:0 "两栖登陆载具"
 amphibious_mechanized_equipment_short:0 "履带登陆车"
 amphibious_mechanized_equipment_desc:0 "两栖履带登陆车，或称Amtracs，使得海军陆战队可以在装甲保护下登陆海滩。然而，这会导致更多燃料的消耗。"
 amphibious_mechanized_equipment_1:0 "基础型履带登陆车"
 amphibious_mechanized_equipment_1_short:0 "基础型履带登陆车"
 amphibious_mechanized_equipment_1_desc:0 "两栖履带登陆车，或称AMTRACs，使得海军陆战队可以在装甲保护下登陆海滩。然而，这会导致更多燃料的消耗。"
 amphibious_mechanized_equipment_2:0 "改进型履带登陆车"
 amphibious_mechanized_equipment_2_short:0 "改进型履带登陆车"
