 light_tank_destroyer_equipment:0 "轻型陆行舰歼击车"
 light_tank_destroyer_equipment_short:0 "轻型陆行舰歼击车"
 light_tank_destroyer_equipment_desc:0 "陆行舰歼击车就是在炮塔位置安装了一门固定火炮的陆行舰，其口径超过通常陆行舰的标准。轻型的陆行舰歼击车设计基于轻型陆行舰底盘，这意味着它们机动性很好，但是无法像重型陆行舰歼击车那样携带威力更大的火炮。"
