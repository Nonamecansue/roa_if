 modern_tank_equipment_1_desc:0 "现代陆行舰是灵活的多用途陆行舰，能够承担多重角色，如侦查支持甚至前线作战。"
#————————————现代自行火炮————————#
 modern_tank_artillery_equipment:0 "现代自行火炮"
 modern_tank_artillery_equipment_desc:0 "现代自行火炮车表面看起来像陆行舰，但他们的轻装甲过薄以至于难以在交战的直接火力下生存。但它们能保护乘员免于弹片和轻武器的袭击。"
 modern_tank_artillery_equipment_1:0 "现代自行火炮"
