 basic_heavy_tank_chassis:0 "基础型重型陆行舰底盘"
 basic_heavy_tank_chassis_desc:0 "世界大战的经验表明，一款用于突破敌军战壕，为轻型部队开辟突破口的重型战车是十分需要的。这样的战车必须全副武装，装甲精良，为此牺牲一些速度是可以接受的。"
 basic_heavy_tank_chassis_short:0 "1934 重型"
 improved_heavy_tank_chassis:0 "改进型重型陆行舰底盘"
 improved_heavy_tank_chassis_desc:0 "虽然战争的性质发生了变化，但具有厚重装甲的重型战车仍然有机会突破敌人的防线，或者用于加强防御以抵御敌人的攻击。"
 improved_heavy_tank_chassis_short:1 "1940 重型"
 advanced_heavy_tank_chassis:0 "先进型重型陆行舰底盘"
 advanced_heavy_tank_chassis_desc:0 "随着装甲和火力的进步，一辆现代陆行舰将需要携带极其厚重的装甲和口径更大的火炮来保证自己的作战效能，这就需要一款负重更强的底盘。"
 advanced_heavy_tank_chassis_short:0 "1943 重型"
 heavy_tank_chassis_desc:0 "一款可以携带厚重装甲或重型火炮或者两者兼备的大型底盘。"
