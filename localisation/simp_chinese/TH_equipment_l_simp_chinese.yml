#——————————火车——————————————————————#
 train_equipment:0 "火车"
 train_equipment_desc:0 "火车在由铁路连接补给首都和补给中心中运输补给"
 train_equipment_1:0 "民用火车"
 train_equipment_1_desc:0 "这类火车由军方从民用货运用途接管，其引擎非常适合远距离运输大量补给。然而，民用构造使其在遭受攻击时较为脆弱。"
 train_equipment_2:0 "战时简化火车"
 train_equipment_2_desc:0 "为了降低成本而使用的简化设计，省略了常规货运火车上常见的许多功能。它仍然像普通火车一样脆弱，但更容易替换。"
 train_equipment_3:0 "装甲火车"
 train_equipment_3_desc:0 "火车引擎为重型装甲所保护，不易受到敌人的攻击。它的运载量与其它设计一样多，但生产成本更高。"
 railway_gun_equipment:0 "列车炮"
 railway_gun_equipment_desc:0 "一门通过铁路运输的重炮。"
 railway_gun_desc:0 "铁路可以将重炮快速移动到内陆，使我们能够远程轰炸敌人的阵地并造成大量破坏。"
 railway_gun_equipment_1:0 "列车炮"

