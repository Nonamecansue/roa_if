 ship_hull_submarine:0 "潜艇"
 ship_hull_submarine_desc:0 "现代潜艇与大战中的简陋潜艇大不相同，它比以往任何时候都能胜任，甚至可以非常低廉的成本对大型船只造成威胁。"
 ship_hull_submarine_1:1 "早期潜艇船体"
 ship_hull_submarine_2:1 "1936潜艇船体"
 ship_hull_submarine_3:1 "1940潜艇船体"
 ship_hull_submarine_4:1 "1944潜艇船体"
 ship_hull_pre_dreadnought:0 "前无畏舰船体"
 ship_hull_pre_dreadnought_desc:0 "比无畏舰竞赛时代更早问世，前无畏舰在如今的时代仅拥有极其有限的战斗力。"
 ship_hull_cruiser_panzerschiff:0 "装甲舰"
 ship_hull_cruiser_panzerschiff_desc:0 "知其不可而为之，德国的工程师们成功在巡洋舰的船体上搭载了接近战列舰级别的火炮，其成果是一艘火力超过了任何已知巡洋舰的战舰，但是造价昂贵，航速较慢，并且装甲较为薄弱。"
 ship_hull_cruiser_coastal_defense_ship:1 "岸防舰"
 ship_hull_cruiser_coastal_defense_ship_desc:0 "对于真正的远洋作战来说，它太小了。这种相对便宜的船只为了重型武器和装甲而牺牲了航程。"
 ship_hull_torpedo_cruiser:0 "重雷装巡洋舰"
 ship_hull_torpedo_cruiser_desc:0 "以拆除一些主炮和防空炮为代价，搭载着大量鱼雷发射管的轻巡洋舰。"
 ship_hull_cruiser_submarine:0 "巡洋潜艇"
 ship_hull_cruiser_submarine_desc:0 "较大的潜艇船体针对更长的航程进行了优化。可以配备额外的油箱以增加航程，或者配备小型侦察机。"
 ship_hull_midget_submarine:0 "袖珍潜艇"
 ship_hull_midget_submarine_desc:0 "由少量乘员操作的小型潜艇。高产量弥补了航程和武器装载量的不足。"
 ship_hull_fleet_submarine:0 "舰队潜艇"
 ship_hull_fleet_submarine_desc:0 "由于其长距离的作战范围，这些潜艇可以作为水面舰队的护航和支援力量。"
 ship_hull_nuclear_submarine:0 "核潜艇"
 ship_hull_nuclear_submarine_desc:0 "由于配备了核反应堆，我国的潜艇可以在水下长时间高速运行，成为我国武器库中极其致命的工具"
 ship_hull_mega_carrier:0 "冰航母"
 ship_hull_mega_carrier_desc:0 "一种巨型航空母舰，使用派克瑞特等实验性的冰复合材料建造船体，使得非舰载机也可以在甲板上起降，从而增加了我们海军航空兵的航程"
 EQUIPMENT_SMALL_FIGHTER: "战斗机"
 sam_missile_equipment_1: "地对空导弹I型"
 sam_missile_equipment_1_short: "地对空导弹 I"