TIR_Country_Desc_Topbar:0 "§Y特色内容：\n§W-在共和国的政治风暴中决出胜利者\n-与旧敌新仇展开世界大战\n-带领付丧神们挣脱压迫\n-构建幻想乡的新秩序\n\n§Y时局：\n§W146季的九十九工业共和国正在夹缝中求生。\n\n自付丧神们艰难地从压迫者的统治下赢得独立后，各种问题却§t接踵而至。§W在曾经的§8财阀§W与§0极端主义者§W的残骸上所建立起的共和国成立了临时政府，暂时稳定了局势，却无法浇灭游击队中异见分子们燥热不安的心。九十九工业共和国的政治体系宛如一团乱麻，从最极端的§R革命主义者§W到企图恢复§4幻想秩序§W的顽固分子，只要是能想象得到的，这里都有。\n\n而令临时政府总统——§t堀川雷鼓§W，也是游击队领导人的她最头疼的，便是§Y战后的经济恢复§W和§Y重建工作§W。在政局动荡的情况下，每天都会有人可能想要某个官员的命，更别提正常展开工作了。\n以九十九姐妹为代表的§R激进革命阵线§W、将纸灯幽视为领袖的§8准则党§W、企图让极端主义卷土重来的§0清洁团§W……这些极端分子，使总统不得安宁，如果想要继续维持当下的稳定，就§t绝不能纵容她们继续发展下去。§W\n\n九十九工业共和国是一个§t混乱不堪的草台班子。§W\n\n人类在战败后的活动§t并不能称得上安分守己§W，而§t周边势力的蠢蠢欲动§W也没能让这个新生的国家松一口气，共和国虽有着来自前殖民地的§Y强大工业体系§W，在如今的情况下却完全得不到利用。\n\n而以§5付丧神§W为主体民族建立起的共和国内的种族矛盾也不容小觑，早期从复权政府迁来的§g人类移民§W已有许多在这片土地上扎根，是无可置疑的重要人口组成部分。而来自魔法森林的§L流亡人口§W也不在少数，总之，这一片可怜的终末地，便是新世界§R最旺，最危险的火药桶。"

EOT_Country_Desc_Topbar:0 "§Y特色内容：\n§W-\n-为摇摇欲坠的帝国善后\n-引领公共意志觉醒\n-§R为明日新世界之到来...§!\n\n妖怪山中部的天狗一族，同其他少数小种族一起，自从鬼族离开妖怪山后，就在§P天魔王§!的统治下世代繁衍生活着，尽管天狗们在各个世代一度强盛，但§P天魔王§!的子民们却从未有过如鱼得水的生活，天狗各阶层的森严等级，伴随着坚固的帝国堡垒，为天狗底层套上了沉重的枷锁，除了极少数大贵族和皇族以外，其他天狗绝无任何翻身的机会，终身从事低贱与卑微的工作。\n\n军中异见者§R红枫党人§!于结界50年的起义震撼了天狗帝国，即便到天魔王政府处决他们残党的时候，对万代皇权的怀疑也开始浮现在人人自危的贵族们心头，尽管结界危机后的帝国立宪与工业化进程则让他们松了一口气，但他们还是不得不邀请作为新贵族的工厂主加入§P第二等级§!当中。\n\n然而，立宪与改革带来的繁荣与稳定终归是假象，帝国在经济危机中遭受了滑铁卢，为了转移矛盾的天魔政权指派了主战派宣布了对斯卡雷特的战争，但事实证明，这只不过是另一支政治败笔。\n\n经受危机与战损冲击的帝国从此一蹶不振,§B饭纲丸龙§!内阁取代了主战派内阁，开始实行各种针对帝国体制弊端的改革，但在不可触动贵族与大资产阶级利益红线上，一切措施都是杯水车薪。尽管帝国的根基早已溃烂，但新社会的影子却早已在§R第三等级§!中显现开来。\n\n在不为大贵族们所知的角落中，异见者们窃窃私语，在对路毙尸殍的悼念中，在黄昏工厂的宣传单上，无论是对帝国立宪谎言的揭露，还是对剩饭残羹的厌恶，以及————对§G平等§!，对§B自由§!，对§R美德§!——对新社会的渴望。§R红枫党§!的幽灵仍旧回荡在妖怪山上空,随着她的儿女们一起,等待着明日的到来。"

POK_Country_Desc_Topbar:"§Y特色内容：\n§W-\n-走过§P长老会§!最后的历史\n-协助地下异见者活动\n-§R以及玄武川的重生...§!\n\n时局：\n同兄弟种族天狗们一样，河童在从鬼族统治的枷锁中挣脱之后，也在§B玄武川§!的桃源之地建立了统一的河童国家。自独立以来，河童就表现出对§G科学与技术§!的非凡追求——亦是他们一族的象征与标志，正是在这样的精神图腾引领之下，河童成为了妖怪山科学的先锋，即便是天狗也不得不与之求学，但无论是什么样的社会，总会被分为统治者与被统治者，玄武川的河童们也不例外，落后的社会制度终归束缚着河童们的创造力，§P贵族长老§!始终垄断着众多河童赖以生计的农业，为了能够从长老那里获得粮食，§R底层河童§!们的任何才智都无一例外地将为贵族们服务，修筑他们的豪宅，制造征服的兵器——即便如此，他们的生活也入不敷出，比天狗更加严酷的社会条件摧残着每一个曾怀揣理想的河童们。\n\n而渴望自由的河童们最终迎来了转机，§B结界危机§!的爆发让幻想乡的妖怪迎来了灾难性饥荒，而作为技术先锋的河童们很快在外界研究的启发下设立了§G灵能工坊§!，河童们由此开始有了与长老会对抗的资本，长老会对日渐独立于他们支配的河童社会愈发焦虑，但他们很快看到了压制工坊的方法，河童们即便能够自设工坊，但仅凭他们的商业竞争力，远不足以与新兴的§O天狗与山童大企业§!相抗衡，而玄武川的§P能源开采§!更是加剧了工坊商业的危机，长老会对侵略着玄武川资源的托拉斯们喜迎恭送，任由他们喧宾夺主，把源源不断的河童劳动力们从工坊赶到工厂，从实验室赶到流水线，而长老会自己则与之买办，榨取几滴肥硕的油水就宣告满足。\n\n借着对外国主子们的阿谀奉承，贵族长老们再次坐稳了统治玄武川的宝座，但很快，天魔王的发兵命令打碎了长老会的春秋大梦，还没等执政官换下睡衣，下玄武川的硝烟就已经弥漫到了整个妖怪山，玄武川国被裹挟进入了这场为天魔发泄征服欲望的战争当中，而结果也十分明显，长老会代表在天狗与斯卡雷特代表的虎视眈眈中签下了将§B下玄武川§!拱手相让的§O“和平条约”§!，下玄武川从此落入红魔之爪，长老会无能导致的丧权辱国，彻底激怒了饱受压迫的河童们，爱国游行开始横扫河童的各大城市，§Y723运动§!爆发了，尽管仓皇的长老会叫来了帝国的宪兵枪炮，但血腥镇压远不是这场暴动的结局，第二次经济危机让依附于买办经济的玄武川国家更遭重创，而长老会垂危之际的立宪大会也作鸟兽散，在他们弥留之际——那阵来自地底的窃窃私语，却愈发雄壮，那是§B723的噩梦缠绕§!,那是§W半个世纪的高歌奏凯§!,那是§Y理想与进步之魂的呐喊§!，它们盖过了长老会的挽歌，而昭示着，一个崭新玄武川的最终到来....."

