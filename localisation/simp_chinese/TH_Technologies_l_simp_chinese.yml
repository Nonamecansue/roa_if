 hardsuit:0 "动力甲"
 hardsuit_desc:0 "动力甲在大战末期开发出来，是自动机发展的自然结果。虽然笨重，但动力甲可以让操纵员在极端环境生存，并抵御足以杀死常规部队的动能攻击。但使用动力甲的代价是，操纵员需要接受培训和特殊疗法。\n\n人脑不具备处理第二皮肤的能力，没有适当的培训和治疗，动力甲对使用者来说就和对敌人一样危险。为解决这一问题，操纵员必须接受各种改造和基因增强，让他们的身心能够与动力甲相连，并真正将其用作高度军事化的第二皮肤。"
 hardsuit_upgrade:0 "改良突击伺服系统"
 hardsuit_upgrade_desc:0 "改良突击伺服系统"
 hardsuit_upgrade2:0 "拓展视觉传感器"
 hardsuit_upgrade2_desc:0 "通过对光谱的深入研究，科学家得以激活动力甲使用者大脑中的特定区域，从而使他们能够通过11种不同的光谱感知世界。\n\n"
 hardsuit_upgrade3:0 "自动化生命评估"
 hardsuit_upgrade3_desc:0 "通过对一系列医疗设备的运用，动力甲可以监控使用者重要器官的情况。这种机制可以轻易地检测致命伤，保护使用者的安全。\n\n"
 hardsuit_upgrade4:0 "改良无线电发射机"
 hardsuit_upgrade4_desc:0 "改进动力甲无线电发射机略显简单，但也是非常重要的升级，这可以让动力甲使用者和指挥部在更远的距离进行协调。\n\n"
 hardsuit_upgrade5:0 "调温传感器"
 hardsuit_upgrade5_desc:0 "动力甲的金属外壳可以克服极端的气候条件，但驾驶员就不行了。通过外部传感器，动力甲的调温系统可以调节动力甲内的温度。\n\n"
 hardsuit_upgrade6:0 "动能防御装甲"
 hardsuit_upgrade6_desc:0 "随着对动力学的新认识，及对其在战争中应用的深入，新式动力甲通常会包括“缓冲区”，旨在保护驾驶员和动力甲的机械线路免受动能冲击的损伤。\n\n"
 razormaiden_desc:0 "纵观历史，女性极少承担作战任务。上次大战后人体增强技术的出现打破了这一成规。虽从未运用于战时，战间期许多机械狂热者都以自身为实验品，不断地追求着更快，更高与更致命的极限。\n\n此类实践推动了刀锋少女的发展。其为一种独特的特种作战单位，主要由高度增强过的女性组成。这些单位无处不经过改造，使她们成为了迅捷的杀戮机器，某些更是在字面上武装到了牙齿。\n\n尽管颇为另类，但她们在绝对速度上远超常规部队；不过增强改造体时好时坏的特性迫使她们只得屈就特种部队之职。"
 razormaiden_upgrade1:0 "战斗渗透者模块"
 razormaiden_upgrade1_desc:0 "战斗渗透者模组为增加渗透进敌方战线之后的能力而设计，将增强刀锋少女执行特别行动的能力。该模组可以拓展刀锋少女各关节的活动范围，让她们的行动更加安静。\n\n"
 razormaiden_upgrade2:0 "鲁沙卡协议"
 razormaiden_upgrade2_desc:0 "鲁沙卡协议以斯拉夫神话中的妖魔命名，是一种基于“蛇蝎美人”理念的设计哲学。鲁沙卡刀锋少女外表美丽，却但内在凶险，她们是战场上出色的战士，担任着优秀突击部队的职责。\n\n"
 razormaiden_upgrade3:0 "通体武器化"
 razormaiden_upgrade3_desc:0 "在前线后方行动十分危险，敌人四面环伺。但是刀锋少女可以专门处理这种情况。通过现代工程学的奇迹，她们的身体里可以藏下大量枪炮、刀刃、弹药与电磁加速弹。\n\n"
 razormaiden_upgrade4:0 "变色龙基因剪切"
 razormaiden_upgrade4_desc:0 "刀锋少女是自动化革命的产物，但是生物工程的成果也不容小觑。刀锋少女的体内接驳了变色龙基因，这是基因工程的又一进步，让这些蛇蝎美人们可以伴随周边环境改变自己皮肤的颜色。\n\n"
 razormaiden_upgrade5:0 "模块化身体构建"
 razormaiden_upgrade5_desc:0 "为了减轻成本，标准化必不可少。将刀锋少女的全身标准化也有助于驱动更大的潜力，可以轻松地替换损坏的部件，还能改进她们身上的内置皮肤装甲。\n\n"
 razormaiden_upgrade6:0 "生物科技进化融合"
 razormaiden_upgrade6_desc:0 "生物工程和机械工程彼此不分家，刀锋少女便是这最好的体现。我们大师级的生物工程技术使刀锋少女成为了生物和机械技术的集大成之作。\n\n"
 jet_trooper_suit: "喷气战士装备"
 jet_trooper_suit_upgrade1:0 "扩容喷气背包"
 jet_trooper_suit_upgrade1_desc:0 "我们将以压缩氦取代传统的氢水蒸汽，这样我们的喷气战士就能携带更多的燃料。"
 jet_trooper_suit_upgrade2:0 "微型导弹发射器"
 jet_trooper_suit_upgrade2_desc:0 "轻量级微型导弹发射器可以轻而易举地撕碎中长距离的无装甲目标（不推荐在室内使用）。"
 jet_trooper_suit_upgrade3:0 "综合通信系统"
 jet_trooper_suit_upgrade3_desc:0 "为每位喷气战士配备全套通信设备可以提高部队作战能力和计划速度，不论他们身处何等环境或是处境之下。"
 jet_trooper_suit_upgrade4:0 "镭素装甲板"
 jet_trooper_suit_upgrade4_desc:0 "镭素装甲板是特种部队首选的优等轻型装甲，虽然这玩意有些副作用，比如说导致辐射病之类的。"
 jet_trooper_suit_upgrade5:0 "弹链重型武器系统"
 jet_trooper_suit_upgrade5_desc:0 "新式弹链重型武器系统就固定在喷气服的枪架上：让大枪主宰局面吧。"
 jet_trooper_suit_upgrade6:0 "长程热成像扫描仪"
 jet_trooper_suit_upgrade6_desc:0 "有了长程热成像扫描仪，敌人在喷气战士面前就无处可逃了，不论他们离我们有多远，体积有多小，温度有多低。"
 combatagate_stage_1:0 "原型斗兽"
 gunslingers_tech:0 "枪手"
 gunslingers_tech_desc:0 "自殖民者在北美建立政权以来，狂野西部就一直是法外之徒的老巢。这些枪手过着刀口上舔血的生活，可以算是非常适合中西部环境的军事单位，即便他们打仗只为了钱，而非出于政治或道德动机。或者说，这其实是件好事？"
 gunslingers_tech_1:0 "8发弹容左轮手枪"
 gunslingers_tech_1_desc:0 "转轮越大，装的铅弹就越多，就能打爆更多敌人的脑袋，道理就是这样简单。"
 gunslingers_tech_2:0 "专用补给车"
 gunslingers_tech_2_desc:0 "我们日渐仰赖雇佣枪手，因此国家也有必要为他们提供弹药和给养。"
 gunslingers_tech_3:0 "工兵小组"
 gunslingers_tech_3_desc:0 "许多枪手都没有建造基本防御设施的材料，有些人甚至连个铲子都没有。让我们纠正这一错误，为他们提供急需的工具。"
 gunslingers_tech_4:0 "加大水囊"
 gunslingers_tech_4_desc:0 "水壶装不了太多水，没法支持枪手在中西部酷热环境中的活动，要想维持更大规模的牛仔部队，我们就需要提供更大的水囊。"
 gunslingers_tech_5:0 "土制穿甲弹"
 gunslingers_tech_5_desc:0 "虽然狂野西部的人们发明了许多土制材料，但其中最受欢迎的还是美利坚土制的穿甲弹（这东西大概是起源于新城的）。这种子弹比普通弹药威力更大，可以轻松击穿轻装甲。"
 gunslingers_tech_6:0 "劫掠小队"
 gunslingers_tech_6_desc:0 "有了专门的“劫掠者”小队，我们的雇佣枪手就能更高效地袭击城镇定居点，甚至是大城市。"
 gunslingers_tech_7:0 "凯利甲"
 gunslingers_tech_7_desc:0 "内德·凯利的遗产为牛仔军事科技的进步做出了许多贡献，其中最重要的就是凯利标志性的金属板装甲，这种装备现在已经遍布狂野西部各地。"
 gunslingers_tech_8:0 "鼓励骑兵战术"
 gunslingers_tech_8_desc:0 "许多枪手都喜欢骑马旅行，但他们效率存疑，纪律更是糟糕透顶。我们可以把他们对速度的热爱整合进传统骑兵战术，让他们成为一支可怖的力量。"
 PB_can_research_gunslingers_tt:0 "可研究枪手科技"
 primordiform_bonobo: "倭黑猩猩基因组基源型"
 primordiform_chimpanzee: "黑猩猩基因组基源型"
 primordiform_bonobo_tt: "$special_project_primordiform$\n 主动性：+10%\n 组织度：+10%\n 可靠性：+15%"
 primordiform_chimpanzee_tt: "$special_project_primordiform$\n 攻击：+10%\n 防御：+10%\n 突破：+15%"
 cof_shellshock_rotation_desc:0 "The horrors of the Great War have spawned a new illness, one not of the body but of the mind. Soldiers forced to fight day after day lose so much of themselves they can hardly be called men. If we want our soldiers to be at full strength they must be allowed time to rest. To absorb and accept the horrors they find on the frontlines. Lest we get walking corpses who just wish for death"
 stronghold_network_tech: "要塞群"