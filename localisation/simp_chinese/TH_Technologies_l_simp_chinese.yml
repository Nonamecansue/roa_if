#————————————军用药物——————————————————————————#
 INFANTRY_TITLE_STIMULANTS: "军用辅助药剂"
 infantry_medicine_research:0 "军规药物"
 infantry_medicine:"军规药物"
 infantry_medicine_desc:""
 infantry_medicine_caffeine:0 "基础咖啡因药剂生产"
 infantry_medicine_caffeine_desc:0 "咖啡因是一直中枢神经兴奋剂，在外界化学的启发下，我们研制出了能够基本满足军用需求的生产链，在这种药物的作用下，我们的士兵可以在各种睡眠剥夺的紧急战况下清醒应对，减少战争损失。"
 infantry_medicine_betablockers:"β-受体阻滞剂"
 infantry_medicine_betablockers_desc:"受体阻滞剂在外界医学上广泛应用于治疗心脏疾病，但在我们团队的实验应用中，受体阻隔剂可以大大减缓高精度作战人员的肌肉抖动，尤其是手部抖动。"
 infantry_medicine_cure_1:"军用医护用品 I"
 infantry_medicine_cure_1_desc:"尽管我们的战士们骁勇善战，但他们归根结底也只是凡体肉躯，因此在战场上的医疗护理与伤员救助也是不可或缺的。"
 infantry_medicine_2:0 "工业级军用药剂生产"
 infantry_medicine_2_desc:0 "通过扩大我们的军用药剂制造工艺，我们可以让更多士兵用上我们在药物开发上取得的成果。"

 infantry_medicine_LTheanine:"L-茶氨酸胶囊"
 infantry_medicine_LTheanine_desc:"左旋茶氨酸能够缓解绝大多数咖啡因带来的副作用，而且亦能够减少士兵的焦虑与专注力。"
 infantry_medicine_BCAA:"BCAA体能补剂"
 infantry_medicine_BCAA_desc:"支链氨氧酸能够在军队进行高强度训练后让肌肉更快恢复至最佳状态。"
 infantry_medicine_cure_2:"军用医护用品 II"
 infantry_medicine_cure_2_desc:"在更新的社会医疗发展下，军需医疗用品也应适应药物的迭代与改良，更健康的人体也是战斗制胜的保障。"

 infantry_medicine_3:0 "强化工业药品生产"
 infantry_medicine_3_desc:0 "大规模工业生产的形式能够基本满足战时军队的药物供给需求。"
 infantry_erythropoietin:"促红细胞生成素"
 infantry_erythropoietin_desc:"打仗带来的流血牺牲总是不可避免的，无论是妖怪还是人类，血液的流失都是能够致命的严重伤害，因此结合不同种族的生理状况来研制造血剂也是一个重要的项目。"
 infantry_medicine_NAD:"NAD+增强剂"
 infantry_medicine_NAD_desc:"不像某个挨千刀的吸血鬼帝国，我们可不会把为国而战的士兵改造成行尸走肉，NAD+将是很好的咖啡因辅助药品，不仅有比咖啡因更少的副作用，而且能够持续提高战士的警觉与专注性。"






#————————————子弹——————————————————————————————#
 infantry_standard_rounds:0 "标准弹"
 infantry_standard_rounds_desc:0 ""
 infantry_flechette_rounds:0 "飞镖弹"
 infantry_flechette_rounds_desc:0 "飞镖弹可以穿透一定厚度的装甲，如薄钢板等轻型材料。"
 infantry_mixed_bullets:"混合灵能弹药"
 infantry_mixed_bullets_desc:"在混合炮弹的启发下，我们发现在枪支弹药中同样可以使用这种混合灵能火药来作为子弹的击发剂，在更强的动能下，混合灵能子弹将能造成更大的杀伤"
 

 infantry_armor_piercing_rounds:0 "穿甲弹"
 infantry_armor_piercing_rounds_desc:0 "穿甲弹较一般弹药而言具有更强劲的侵彻力。"
 infantry_incendiary_rounds:0 "燃烧弹"
 infantry_incendiary_rounds_desc:0 "燃烧弹可以造成三级烧伤。"
 infantry_explosive_rounds:0 "爆炸弹"
 infantry_explosive_rounds_desc:0 "爆炸弹可对皮肤组织造成严重伤害。"
 infantry_toxic_rounds:"剧毒弹"
 infantry_toxic_rounds_desc:"通过对合成毒性灵能物质的研究拓展，我们认为其在弹药身上亦有可观的应用，利用毒灵能的滞留性，穿入目标体内的子弹仍旧具有可危及其生命的强大毒性。"



