#——————————————陆军学说————————————————————————#
 SUPREMACY_OF_STEEL_DOCTRINE_LABEL: "钢铁霸权"
 SUPREMACY_OF_STEEL_DOCTRINE_DESC: "今天的机械化与增强体武器就是战争的未来：迅猛、暴烈、无情。"
 FIRE_AND_FURY_DOCTRINE_LABEL: "狂怒炽焰"
 FIRE_AND_FURY_DOCTRINE_DESC: "或许敌人行动更为灵活，甚至智谋更加狡猾，但我们还没遇到过能智取大口径炮弹的对手。"
 CULT_OF_THE_OFFENSIVE_DOCTRINE_LABEL: "进攻狂热"
 CULT_OF_THE_OFFENSIVE_DOCTRINE_DESC: "上次大战的战法在构思上是合理的，尽管在执行上并非如此。没有牺牲，胜利便无从谈起。"
 SUPREMACY_OF_FLESH_DOCTRINE_LABEL: "血肉至上"
 SUPREMACY_OF_FLESH_DOCTRINE_DESC: "我们的实验室有能力创造不可言说的憎恶之物，那么我们就可以让这些怪兽冲锋陷阵，免得我军将士卖命。"
 REINFORCED_INFANTRY_LABEL: "强化步兵"
 MOBILE_ASSAULT_LABEL: "机动突击"
 MORE_SHELLS_LABEL: "枪林弹雨"
 MORE_SUPPORT_LABEL: "补给成山"
 HINDENBURG_DOCTRINE_LABEL: "兴登堡学说"
 BULLARD_HAIG_DOCTRINE_LABEL: "布拉德-黑格学说"
 ASYMMETRY_LABEL: "非对称战法"
 MUTAGENIC_WARFARE_LABEL: "致变战争"
 supremacy_of_steel:0 "钢铁霸权"
 supremacy_of_steel_desc:0 "我们当前的时代必然是钢铁的时代。如果我们的战争机器要在未来战争中获胜，就必须首先关注诸如陆行舰、战机、自动机在内的装甲单位。"
 sos_delaying_actions:0 "迟滞行动"
 sos_delaying_actions_desc:0 "虽然世界大战基本上是漫长血腥的堑壕战争，但是战时的军事进步表明，速度才是未来的游戏规则。为我军提速固然重要，而拖慢敌军速度则更为关键。击败一支怠于备战、装备落后的军队将会不费吹灰之力。欺敌制胜与迟滞敌军将会是重中之重。"
 sos_independent_armor:0 "独立装甲部队"
 sos_independent_armor_desc:0 "世界大战证明了以步兵为核心的军队是落伍的。长时间以来，数以百万级的战士被丢进绞肉机般的战场而毫无作用，只有发展陆行舰与自动机之类的装甲部队才能结束战争。从此之后，步兵只会扮演支援角色，而独立装甲部队的发展与凸显将会改变下一场战争的态势。"
 sos_shock_troopers:0 "电击骑手动力甲"
 sos_shock_troopers_desc:0 "动力甲是最新研发的非载具装甲。尽管如此，今天的动力甲只有防御作用，使用动力甲的士兵操持的武器与其他步兵完全一致。然而，为动力甲部队配发电击武器将会让他们具备期待已久的进攻优势，从而促进动力甲部队演化为次时代装甲部队。"
 sos_armored_core:0 "装甲核心"
 sos_armored_core_desc:0 "装甲是骑兵单位与海军舰艇的迭代标志。装甲部队理应拥有自己的独立编制、指挥系统和相应战术，而步兵就应该乖乖跟在现代铁骑的后面。"
 sos_advanced_forces:0 "开路先锋"
 sos_advanced_forces_desc:0 "赢得战斗的关键是总要比敌人领先至少一步，或者让失能的敌人无法作战。到目前为止，刀锋少女是最有力的侦查单位。我们应该创立一支精锐的刀锋少女部队，从而深化这些巾帼英雄们的军事作用。这支精锐部队的目标是进行战地侦查，并在必要的情况下完成暗杀与破袭任务。"
 sos_lightning_war:0 "闪电战"
 sos_lightning_war_desc:0 "如果要避免无休止的堑壕战下的人间地狱，最好的办法是以雷霆一击摧毁敌军，让战争尽快结束。如果我们改善陆行舰与步行机的编制组织、协调能力和补给网络，理论上就可以让他们快速突破并包围敌人防线，从而让其一溃千里。"
 sos_full_mechanization:0 "全面机械化"
 sos_full_mechanization_desc:0 "世界经济正从农业时代的靠天吃饭迈向工业时代的钢筋铁骨，而我们的军事发展也应当如此。马匹为人类的部队效力了千百年，应该让卡车和载具接它们的班了。一支全机械化部队永不疲倦，只需要少量的粮草就能在几乎任何环境下作战。敌人将会被钢铁洪流挫骨扬灰。"
 sos_deep_penetration:0 "猎杀小队"
 sos_deep_penetration_desc:0 "如果敌人得到了火炮弹幕与装甲铁壁的庇护，我们的这些武器将如何发挥作用？渗透作战才是在现代战争中快速取得决定性胜利的关键所在。"
 sos_indiscriminate_conscription:0 "无差别征兵"
 sos_indiscriminate_conscription_desc:0 "俗话说得好：爱情与战争面前众生平等。这种观点与我们的征兵标准非常贴切。为了充实我军的兵源，我们可以将征兵标准下调甚至完全取消。老者、罪犯、妇女、残疾人甚至儿童都可以被送去前线，只有生理机能不适合任何作战任务的人才能免于兵役。"
 sos_mobile_infantry:0 "机动步兵"
 sos_mobile_infantry_desc:0 "世界大战证明了肉体凡胎有多不堪一击。面对机关枪、铁丝网还有各种新武器，士兵在战场上一般只能存活几个小时，而他多年的训练、昂贵的装备还有运输资源的消耗都将毫无意义。这种困局的合理解法是为全军大量生产动力甲装备，让每名士兵刀枪不入，宛如身披闪耀铠甲的当代骑士。"
 sos_night_operations:0 "夜间行动"
 sos_night_operations_desc:0 "即便是在古代，朗朗白日下的进攻经常以尸山血海收尾，而夜袭总是难上加难。如果你伸手不见五指，看到敌人甚至向敌人进攻谈何容易。为了加强夜间作战行动能力，我们开展了一系列全军大演练，从而让我军士兵可以不分昼夜地战斗。"
 sos_fast_action_units:0 "快速行动部队"
 sos_fast_action_units_desc:0 "今日之科技进步过于偏爱进攻方了，如果敌方突破了我军防线，就几乎无法被遏制。不过，我们可以充分利用一支袭扰敌方前线部队的快速游击单位，从而严迟滞敌军攻势。一旦大规模列装轻型运输载具并提高武器泛用性，我们就可以拖慢敌人的攻势，直到我军主力回防。"
 sos_smash_and_grab:0 "砸抢行动"
 sos_smash_and_grab_desc:0 "如同世界大战所示，后勤补给是现代西方军队的重中之重。然而，随着机械化部队的速度越来越快，补给线就越来越脆弱。如果我们的新式高机动单位切断了敌方战线，深入我方的敌军将会被我们玩弄于股掌之中。"
 sos_heavier_armor:0 "侧重装甲"
 sos_heavier_armor_desc:0 "装甲侧重学说提倡将重装甲部队作为陆战的核心单位，尤其是主战陆行舰和步兵战斗载具。该学说认为具备火力、防护与机动优势的装甲单位可以突破敌方防线并进行大纵深作战，故此拥有重大的战略优势。\n\n在炮火与空袭的支援下，装甲部队可以用来瘫痪甚至消灭敌方指挥系统与补给线，沉重打击敌方的响应能力。该学说侧重于发展可以抵挡敌军炮火并且有压倒性火力的重装甲单位，从而得以夺取并坚守战略要地。快速实现突破与在各种战斗环境下速战速决是该学说的首要目标。"
 sos_more_dakka:0 "侧重火力"
 sos_more_dakka_desc:0 "该学说注重将重武器作为军事行动的主心骨，尤其是大口径火炮、长程导弹和重火力武器，而不是机动灵活的机械化装甲单位。该学说强调火力胜过机动，通过持续轰炸与精准打击来对敌方造成远距离打击杀伤效果。在地面部队与敌交火之前，诸如自行榴弹炮、火箭炮和长程弹道导弹之类的重武器将用来打击甚至消灭敌方防线，减少友军的伤亡。\n\n装甲侧重学说希望利用更重更硬的载具进行装甲突破，目的是击穿敌方防线并掌握战场主导权，而火力侧重学说则截然不同。后者着重使用远距离火力杀伤敌军，在机动部队完成战术目标之前预先削弱敌方战斗力。该学说的战术更为静态，但是可以在千里之外有效地改变战场态势。"
 faf_fire_and_fury:0 "狂怒炽焰"
 faf_fire_and_fury_desc:0 "该军事学说专注与炮兵火力的优势，将其视作战地上的中坚力量，强调在短兵相接前使用大量，持续的炮兵火力夺取主动权并削弱敌人。该学说依赖一整个成体系的炮兵系统，包含了榴弹炮，火箭炮和长程精准导弹，去破坏敌方的部署和工事，并压制可能的反攻。炮兵将会是主宰战场的关键要素，既可以在远距离外消灭敌方有生力量，也可以为友军的步兵和装甲部队在推进时。提供更大的优势"
 faf_fuller_auto:0 "富勒自动系统"
 faf_fuller_auto_desc:0 "在世界大战期间，人力往往是战役走向的决定性因素，有能力让更多人送命的一方通常就是胜者。不少科技进步的产物可以降低军队对人手的依赖，不过人力依旧至关重要，而有了“富勒自动系统”就可以解决这个问题。如果我们提高重炮射速，进攻我方前线的敌军要么举步维艰，要么干脆无力前进。"
 faf_beans_and_butter:0 "豆子，黄油和子弹"
 faf_beans_and_butter_desc:0 "随着战场不断引入半静态的重火力单位，维持补给线的重要性也凸显了出来。不仅弹药供给要跟上，我们的部队也需要满足四大基础的食物种类：豆类，熏肉，烈酒和油脂。"
 faf_more_firepower:0 "烈焰狂战"
 faf_more_firepower_desc:0 "该补充学说要求解除自动武器的安全装置，从而通过他们口中的“超频”或者绕过射速限制器的方式来极大地提高武器的短期射速，以此在近距离作战与高强度交火中加强火力。在解除了一些安全装置之后，自动武器可以在更短的时间内发射更多的子弹，理论上可以提高击中目标与有效压制敌方的概率。然而，这种做法的代价是缩短武器寿命，还会使武器更容易过热与故障。\n\n该补充学说在需要优势火力击垮敌军的战场上最有效用，不过它需要训练有素的兵员来应对武器状态恶化与后座力提升所带来的风险。该学说认为武器的短期战术作用胜过长期的可靠性，因此正中重视快速激烈交火的精锐与特战部队的下怀。"
 faf_combat_team_organization:0 "广发兴奋剂"
 faf_combat_team_organization_desc:0 "向前线部队提供可以强化作战表现，耐力和感官的兴奋剂，可以有效提升士兵在持久战和高压行动中的效率。该方法包括建立一套流水线体系来批量供给军用兴奋剂，并在药效中提升专注力，减少疲劳感以及加快神经反应速度。药物可能需要一系列创新的手段来配布，比方说混入军粮，便携式吸食器，和可穿戴容器，务必确保每一个士兵能一步不落地用上所需的药物。\n\n该学说强调在长期作战中通过管理疲劳和增强士气来维持部队的戒备程度，同时也包含了完善的保险措施来防止滥用，上瘾和误诊。它在对身心强度需求不菲的高强度持续作战中能提供左右胜败的优势。同时，该学说也需要应对广泛使用兴奋剂带来的大量道德和健康问题。"
 faf_thunder_runs:0 "滚雷炮阵"
 faf_thunder_runs_desc:0 "采用徐进炮火轰炸的“滚雷炮阵”战法注重使用连贯同步的炮击频率，逐步向陆上先头部队的前方地带推进炮击区，从而压制并扰乱敌方防御部队。这种战术经常被称为“徐进弹幕”，弹幕可以掩护突击中的己方步兵或装甲部队，同时可以摧毁障碍物、干扰敌方阵位、在冲击部队接敌前消灭敌方。不断推进的炮击区域为战场环境带来了更多变数，在持续的火力压制下，敌人几乎没有时间恢复或者重组。\n\n炮兵与陆上部队的精准协调配合是该战术的要点，炮兵弹幕要在精准落在友军前方的同时还需要持续不断地打击敌军。该战术对先进的观瞄系统、高素质的炮兵部队、实时同步的通讯网络提出了极高的要求。一旦执行到位，这套强力的战法不仅可以将己方冲击部队的伤亡降至最低，还能在进攻行动中维持突击作战力量。"
 faf_automated_targeting:0 "智能火控系统"
 faf_automated_targeting_desc:0 "智能火控系统将人造智能应用在火控系统之中，它们能带来极高的瞄准精度，运算速度和战场适应能力。基于人造智能的火控系统会分析从传感器，无人机和侦察部队实时传回的海量的数据，可以迅速确定敌方位置，目标优先级和最佳的火力配置。这些系统会实时考虑千变万化的战场环境，例如地形，敌军移动和战场环境，并依此迅速调整各项参数。\n\n人造智能让火力打击更加精准并减少附带损失，特别是在地形复杂建筑密布的环境中。它还会自动协调火力任务，确保炮兵，空中支援和精准轰炸各自被用于最合适的情景。该学说旨在减少人为的失误和延迟，确保军队能迅速应对所有发现的威胁。然而，它也需要严格的保险措施以防故障和误判，还需应对敌方针对性的干扰。"
 faf_drone_targeting:0 "无人机协同作战"
 faf_drone_targeting_desc:0 "使用无人航空系统（UAS）监控战场可以带来实时的高保真情报，加强指挥者对战场情况的掌控力和决策能力。该学说强调整合不同高度，不同耐性的多种无人机，全方位覆盖战场的关键地带，例如敌军的移动路线，补给通道和战略要点。这些无人机配有的各式先进的传感器——例如热成像，红外线和高精度相机——可以检测隐蔽的敌军部队，监控地形的变化以及追踪己方的进展。无人机收集到的情报会被实时转发给指挥中心和前线单位，允许他们迅速调整战术，空袭和炮击支援。\n\n持续不断的空中侦察会大大减少部队受到伏击的可能，提升火力打击的精度并能让指挥者以更清晰的视角做出决断。该学说以求将无人机整合为侦察单位的核心组成，可以加强所有进攻和防御战斗，让作战的整体效率和安全性大幅提升。"
 faf_shock_and_awe:0 "震悚战术"
 faf_shock_and_awe_desc:0 "Undermining enemy morale through sheer firepower emphasizes the psychological impact of overwhelming, continuous, and devastating attacks to break the enemy's will to fight. This approach combines massed artillery, airstrikes, and heavy weapons to create an unrelenting barrage that leaves the enemy with little time to regroup or recover. By maintaining constant pressure, the enemy's sense of security and cohesion is eroded, leading to confusion, fear, and diminished combat effectiveness. The goal is to not only inflict physical damage but to demoralize enemy forces by demonstrating overwhelming superiority, making them believe that resistance is futile.\n\nThis doctrine would leverage the shock-and-awe effect, where the intensity and scale of firepower cause disorganization and panic, encouraging surrender or retreat. Additionally, it integrates psychological operations (PSYOPS) alongside the firepower to maximize the emotional and mental toll on the enemy, ensuring that even if they survive the bombardment, their morale is too broken to continue effective resistance."
 faf_firestorm_assaults: "炎暴特攻"
 faf_firestorm_assaults_desc: "自古以来，火攻一直是对抗大部分敌人的强力手段。虽然国际社会对于火攻的争议越来越大，火焰武器的战略价值从未黯淡下去。顾名思义，“炎暴特攻”将大规模使用火焰武器，在成建制消灭敌军的同时还可以击穿幸存者的心理防线。"
 faf_burnout_doctrine:0 "烧夷殆尽"
 faf_burnout_doctrine_desc:0 "如要改进火焰喷射器技术的使用效果，需要从改善武器的射程、燃料使用率和安全性着手，令火焰喷射器在现代战斗中更为灵活有效。改进燃料成分可以提高火焰射流的射程，提升武器射程和杀伤力，同时降低操作人员的风险。优化点火装置、燃料储存和输送机制将使火焰喷射器更可靠、轻便、安全，在城市、丛林或攻坚作战中更好操作。强化耐热材料可进一步防止操作手被可能出现的火焰回弹或者武器故障问题伤害。\n\n这种改进型火焰喷射器技术在近距离作战和清扫要塞驻军时尤为重要，火焰造成的毁伤与士气打击效果还可以很好地击溃敌方心理防线。该理论还将火焰喷射器部队与其他机械化部队和步兵单位整编，以发挥其在特定战场中的作用，不失为攻克牢固工事与打击受复杂地形保护的敌军时的神兵利器。"
 faf_indiscriminate_fire:0 "无差别轰炸"
 faf_indiscriminate_fire_desc:0 "该军事战略强调对敌方阵地进行无差别轰炸，并尽可能加强武器杀伤力而非精确度，从而重创敌军并使其无力作战。这种战法包括向敌占区用重型火炮、空袭和火箭弹狂轰滥炸，而不考虑具体目标，从而令战区火力达到饱和。对战场进行无情轰炸的作用是打击敌方防御据点、补给路线或者预备部队，即便是无法歼灭敌军也可以让其难以重整旗鼓。\n\n该战术旨在通过创造战场新态势，使大难临头的敌军无法协调抵抗与反攻，从而最大限度地提高作战效能。虽然这种战法可能会造成惨重的附带损害，但这么做就是为了迅速取得优势。一旦我军的压倒性火力打击了敌方战斗力，作鸟兽散、土崩瓦解的敌人便无法继续作战。"
 faf_combined_arms_warfare:0 "联合作战"
 faf_combined_arms_warfare_desc:0 "Combined arms warfare is a military strategy that integrates different types of combat units—such as infantry, armor (tanks), artillery, and air support—into a cohesive operation to maximize their strengths and minimize their weaknesses. This approach allows forces to exploit the complementary capabilities of each unit type: infantry can secure and hold ground, tanks provide mobile firepower and protection, artillery offers long-range bombardment, and air support delivers precision strikes.\n\nBy coordinating these elements, a military force can create overwhelming pressure on the enemy, making it difficult for them to respond effectively and increasing the chances of achieving strategic objectives. The concept of combined arms warfare has evolved over time, but it remains a cornerstone of modern military doctrine, emphasizing the importance of coordination, timing, and flexibility on the battlefield."
 cof_cult_of_the_offensive:0 "进攻狂热"
 cof_cult_of_the_offensive_desc:0 "虽然科技与战术在几百年来日新月异，但是有一个铁的事实从未改变：战争的胜利取决于人而非机器。是活生生的人带领我们走向胜利，我们的战斗准则就必须彰显这一点。如果拿到正确的装备，就算是最强大的陆行舰、飞行器和战舰都可以被大头兵摧毁。这种思想必须被牢记在心、发扬光大。"
 cof_infiltration_troops:0 "渗透战术"
 cof_infiltration_troops_desc:0 "大规模突破和大范围防线自然是任何战役中的重要部分，然而我们不能忽视其他的小细节。精确部署、身怀绝技的渗透小队可以潜行穿越敌方防线。一旦穿过防线，他们所带来的杀伤效果顶得上常规作战中几百条人命换来的战果。"
 cof_hindenburg_doctrine:0 "兴登堡学说"
 cof_hindenburg_doctrine_desc:0 "虽然有人说“进攻是最好的防御”，这句话不意味着我们要全盘放弃防守战术。我军必须学习如何又快又好地建造堑壕与临时工事。如果发挥得当，我方士兵可以将占领区牢牢控制住。在不理想的情况下，他们也可以坚守等到永久性防线与驻防部队。"
 cof_bullard_doctrine:0 "布拉德-黑格学说"
 cof_bullard_doctrine_desc:0 "先贤有云“进攻是最好的防御”，而世界大战时静止不动的战线体现了只顾驻防备战的结果。我军必须注重运动而非耐性。我方士兵必须学习如何用一切最有效的手段进攻敌军防线，顺势打击其中的空白处和薄弱点，从而强势突破击溃敌人，带领我军取得胜利。"
