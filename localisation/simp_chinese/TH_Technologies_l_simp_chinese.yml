#————————————微型核弹——————————————————————————#
 nuclear_artillery_upgrade_1:0 "微型核弹发射器"
 nuclear_artillery_upgrade_1_desc:0 "军方和核理论家相信，如果能配备更加紧凑的不稳定同位素火炮，那么理论上，我们就能在安全距离之外发射这些所谓的“微型核弹”，投送致命的当量。要是我们真能，充分地掌握原子的能量，那这些微型核弹能做到什么，就只有天知道了。"
 nuclear_artillery_upgrade_2:0 "特种侦察战术"
 nuclear_artillery_upgrade_2_desc:0 "我们可以部署侦查专家小队，他们将专门为微型核弹发射器寻找合适的炮击区域，这样一来，这种毁灭性武器的部署速度便可大大加快。"
 nuclear_artillery_upgrade_3:0 "M.A.D发射器"
 nuclear_artillery_upgrade_3_desc:0 "使用了仅供天国的武器还能得到上帝的垂怜吗？不过也无所谓了，造出这种毁灭性科技本来就是要下地狱的，那又何妨一用。"
#————————————加密技术——————————————————————————#
 basic_encryption_with_lar:1 "加密 - 多表置换密码"
 basic_encryption_with_lar_desc:0 "通讯的新手段必带来新的遭拦截风险。转子加密机将用作高速复杂的加密。"
 improved_encryption_with_lar:1 "加密 - 循环置换"
 improved_encryption_with_lar_desc:0 "加密机在随机化上的限制将被用于破译密码。提高转子加密机的随机性后，这类破译手段将更难得手。"
 advanced_encryption_with_lar:1 "加密 - 脉冲编码调制"
 advanced_encryption_with_lar_desc:0 "科研进步及经验积累让我方通讯时有了更多保障数据流流量安全的手段。"
 basic_decryption_with_lar:1 "解密 - 频率分析"
 basic_decryption_with_lar_desc:0 "密码解密学变得更具有高等数学性质。卡片目录等系统及马里安·雷耶夫斯基式“记转器”类仪器会有助于解密工作。"
 improved_decryption_with_lar:1 "解密 - 旁路攻击"
 improved_decryption_with_lar_desc:0 "更复杂的计算机将带来新的密码分析学应用手段，例如和最新破译手段结合，用以破解新式暗号的差分攻击。"
 advanced_decryption_with_lar:1 "解密 - 自动推演"
 advanced_decryption_desc_with_lar:0 "逐步改良并推动我国密码分析学发展至此的计算机计算能力恐将于未来创造几乎无懈可击的加密法。若要预防，我方必须作好准备积极获取与这项科技相关的机密信息。"
