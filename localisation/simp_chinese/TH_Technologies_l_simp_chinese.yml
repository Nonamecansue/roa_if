 AUTOMAT_TITLE_DUOPOD: "机械狼蛛"
 AUTOMAT_TITLE_TRIPOD: "电气犰狳"
 AUTOMAT_TITLE_QUADROPOD: "绯想天则机甲"
 category_all_automats:0 "所有机动装甲单位"
 cat_light_automat:0 "所有机动装甲单位"
 cybers_tech:0 "机械科技"
 tech_automat_great_war:0 "后战争时代机动装甲"
 tech_automat_light_1:0 "机械狼蛛 I型"
 tech_automat_light_1_upgrade_1:0 "节支齿轮传动系统再优化"
 tech_automat_light_1_upgrade_1_desc:0 "机械狼蛛的各个肢体都是其无比重要的核心，它们的灵活性和强度决定了机械狼蛛的机动性。我们对其进行了进一步的优化，力求在战斗中能更好地应对各种复杂的环境，并避免各种因素可能导致的卡壳故障。\n\n"
 tech_automat_light_1_upgrade_2:0 "机上消防系统"
 tech_automat_light_1_upgrade_2_desc:0 "为了防止机械狼蛛遭到致命打击后的故障危及驾驶员生命，我们务必需要配备各种用于紧急消防的设备，以协助其逃脱或修复故障。\n\n"
 tech_automat_light_2:0 "机械狼蛛 II型"
 tech_automat_light_2_upgrade_1:0 "镭素瞄准镜"
 tech_automat_light_2_upgrade_1_desc:0 "军用光学技术持续进步，机械狼蛛也要跟上这股潮流。机械狼蛛装备了镭素瞄准镜，哪怕是在昏暗的下午也更能发现敌人。\n\n"
 tech_automat_light_2_upgrade_2:0 "引擎超频协议"
 tech_automat_light_2_upgrade_2_desc:0 "战场经验教会了我们怎样才能正确地处理我们的装备，在需要突破时，我们可以为机械狼蛛和其引擎设计专门的协议，使得机组得以最大程度地达成军事优势。\n\n"
 tech_automat_light_3:0 "机械狼蛛 III型"
 tech_automat_medium_1:0 "电气犰狳 I型"
 tech_automat_medium_2:0 "电气犰狳 II型"
 tech_automat_medium_2_upgrade_1:0 "地底次声波武器"
 tech_automat_medium_2_upgrade_1_desc:0 "次声波武器是利用高强度音波发动攻击的武器，以地面为介质定向发出大音量的声波，足以摧毁敌方营地，更甚者能造成强大的士气打击\n\n"
 tech_automat_medium_2_upgrade_2:0 "浓缩氧气罐"
 tech_automat_medium_2_upgrade_2_desc:0 "由于电气犰狳的驾驶员战士们长期处于地底的封闭空间执行作战任务，我们务必要为电气犰狳配备足够的氧气储备，液化氧气就是不错的选择。\n\n"
 tech_automat_medium_3:0 "电气犰狳 III型"
 tech_automat_medium_2_upgrade_3:0 "变形钻头"
 tech_automat_medium_2_upgrade_3_desc:0 "电气犰狳能够轻松遁地，仅靠机械利爪的效率是远远不够的，为了应对任何可能的地底地形状况，我们的工程师为电气犰狳设计了可以调整锐利程度的钻头。\n\n"
 tech_automat_medium_2_upgrade_4:0 "扩大配给储藏荚"
 tech_automat_medium_2_upgrade_4_desc:0 "对于长期处于地底的电气犰狳机组人员，缺少补给总是他们的一大难题，为了稳定军心士气，我们决定为电气犰狳增添更多可放置配给的槽位。\n\n"

 tech_automat_heavy_former_1:"动作捕捉与传导模块"
 tech_automat_heavy_former_1_desc:""
 tech_automat_heavy_former_2:"机体闭路电视网络"
 tech_automat_heavy_former_2_desc:""
 tech_automat_heavy_former_3:"图像可视化意识传导"
 tech_automat_heavy_former_3_desc:""









 tech_automat_heavy_1:0 "绯想天则机甲 I型"
 tech_automat_heavy_1_upgrade_1:0 "标准化维修团队"
 tech_automat_heavy_1_upgrade_1_desc:0 "刚问世不久的绯想天则机甲并不是十全十美的装备，随着战争的进行，这个庞然大物的各处弊端也开始逐步显现出来，为了确保绯想天则能够稳定运行，我们特别培训了一批专业的维修团队，以确保在故障发生时，机甲能够得到对症下药的维修与排查。\n\n"
 tech_automat_heavy_1_upgrade_2:0 "机甲餐厅"
 tech_automat_heavy_1_upgrade_2_desc:0 "即便是冰冷的机甲也是需要定期维护的造物，它的驾驶员就更不必说了。对于军旅生活都在机甲上度过的驾驶员团队，为了让他们把这里当做自己的第二个家，我们在机甲里面开设了美食餐厅和可供娱乐的啤酒俱乐部，希望能让他们与这台机甲建立密不可分的融洽关系。\n\n"
 tech_automat_heavy_2:0 "绯想天则机甲 II型"
 tech_automat_heavy_1_upgrade_3:0 "电幕中继瞄准"
 tech_automat_heavy_1_upgrade_3_desc:0 "“电幕”是一项新科技，为我们的自动机光瞄设计提供了一种前景广阔的可能。借助这项发明，我们的士兵可以轻松地从机甲内部索敌。\n\n"
 tech_automat_heavy_1_upgrade_4:0 "低强度热射线发射器"
 tech_automat_heavy_1_upgrade_4_desc:0 "\n\n"
 tech_automat_heavy_3:0 "绯想天则机甲 III型"
 CAS2:0 "TVAC I型"
 CAS3:0 "TVAC II型"
 air_teleforce_engine:0 "轻型电磁加速引擎"
 jet_engines:0 "亚音速铀引擎"
 air_rotary_engine:0 "旋翼引擎"
 jet_engines_desc:0 "铀电磁加速原子引擎采用最尖端科技，结合了电磁加速引擎的动能推力和原子能的通用性。测试表面其对航空员的致癌率在可接受范围内，这种引擎在空战中的优势无与伦比，核能的热力正可以抵消高空的低温。"
 automatrons_folder:0 "自动机"
 automatrons_folder_desc:0 "自动机及各类变种。"
 tech_automat_upgrade_1:"纳米化装甲"
 tech_automat_upgrade_1_desc:"纳米化装甲是对机动装甲的重大改进。它使用了新型的纳米材料，能在战斗中提供更好的保护。"
 tech_automat_upgrade_2:"纤维化关节"
 tech_automat_upgrade_2_desc:"纤维化关节是对机动装甲传动系统的迭代更新，利用新型的纤维材料，让机动装甲的肢节如同生物一般自由伸展，使得机动装甲同时拥有钢筋铁骨与矫健灵活的优势。"
 tech_automat_upgrade_3:"陀螺仪磁悬浮减震系统"
 tech_automat_upgrade_3_desc:"陀螺仪磁悬浮减震系统结合陀螺仪的动态稳定性与磁悬浮技术的无接触特性，通过精密传感器感知振动并实时调整磁悬浮力，能够为机动装甲提供更加高效、精准的减震效果，提高驾驶员的适应度。"



#————————————强化科技——————————————————————————#
 mmhorrors_folder:0 "强化与非常规科技"
 mmhorrors_folder_desc:0 "§Y“咱们怎么就不能把这块的基因剪掉一块，然后在那块在接上一段新的？生命就这么脆弱，经不得一点修改？难道老天爷就不许我们做出哪怕一点进步？”§!\n\n最为尖端的生物技术、技术人类主义和无限制的科学，随时准备投送到倒霉的敌人头上。"
#————————————斗兽2——————————————————————————————#
 cat_amalgamate: "斗兽"
 special_project_primordiform:0 "原型斗兽"
 special_project_primordiform_desc:0 "传统上，基因混合会避开灵长类及其相近物种。直言不讳，这既短视又毫无想象力；而于是，源型诞生了。作为猿类，人类和突变基因的不洁融合，这些武装生物是杰出的冲击骑兵。"
 combatagate_upgrade_1:0 "肌肉强化因子"
 combatagate_upgrade_1_desc:0 "通过引入大型猫科掠食动物的基因，我们可以增强基础斗兽的心血管系统，提高整体肌肉生长。更强的肺活量能让斗兽在战斗时移动得更快。"
 combatagate_upgrade_2:0 "蜂巢等级模式"
 combatagate_upgrade_2_desc:0 "我们可以借鉴蜂巢等级制度，改良斗兽混合体的战斗通信与协调，赋予它们更强的组织能力。"
 combatagate_upgrade_A:0 "神经元复杂性定理"
 combatagate_upgrade_A_desc:0 "我们对自然的了解越发深入，动物“思考”的方式也日渐明晰。动物越复杂度，就更复杂的神经系统来完成更多任务。通过在斗兽体内引入寻常家犬的基因，它们可以更加胜任于军事用途。"
 combatagate_upgrade_4:0 "头足纲色素细胞"
 combatagate_upgrade_4_desc:0 "战争的首要原则便是攻其不备，而我们的嵌合体也应当体现这一原则。在反复实验之后，我们从章鱼身上找到了解决方案：它们使用成组的细胞来改变自己的体表颜色。章鱼基因将对伏击和侦查嵌合体十分有用。\n"
 combatagate_upgrade_5:0 "蟹化原理"
 combatagate_upgrade_5_desc:0 "神奇的大自然蕴含着无穷的奥妙。1916年，兰斯洛特·博拉代尔发现了“蟹化原理”，这项原理如下：\n\n“只要时间够久，最终每一种甲壳类动物都会进化成螃蟹。”\n\n利用这项知识，我们可以改进斗兽的坚韧外壳。\n"
 combatagate_upgrade_6:0 "全光谱分析"
 combatagate_upgrade_6_desc:0 "全光谱分析"
 combatagate_upgrade_7:0 "丽沙病毒植入手术"
 combatagate_upgrade_7_desc:0 "丽沙病毒是RNA病毒下的一个属，其中包括了狂犬病毒。直到现在，狂犬病仍然是几千年来最可怕的疾病之一，并且不可避免地成为了我们军事应用研究的重心。通过在战斗前向嵌合体体内注射这种病毒，我们便能创造出能撕碎敌人的可怖野兽。\n\n"
 combatagate_upgrade_8:0 "鳄科咬合力"
 combatagate_upgrade_8_desc:0 "鳄鱼和短吻鳄数十年来一直吸引着人们的想象力，它们强有力的下颚可以轻而易举地咬碎骨头。把这种的碎骨之力军事化会是非常恐怖的，但也出人意料地有效。通过重度基因编辑，我们可以几乎让所有斗兽都拥有鳄科的咬合力。\n\n"
 combatagate_upgrade_9:0 "水氧处理"
 combatagate_upgrade_9_desc:0 "水氧处理"
 combatagate_upgrade_10:0 "凯夫拉皮肤植入体"
 combatagate_upgrade_10_desc:0 "在身体护甲领域的不断研究中，实验品凯夫拉引起了我们的注意。虽然还无法应用到个人身上，但凯夫拉对我们的斗兽实验体还是很有用的。向战斗斗兽的皮肤下植入凯夫拉之后，即便是要被活着剥皮（当然，只是理论上），斗兽的重要器官也依然能保持存活。\n\n"
 combatagate_upgrade_11:0 "简化原型回收"
 combatagate_upgrade_11_desc:0 "经过精心实验之后，我们的科学家得以创造能回收利用的斗兽。只要能在最激烈的战火中保护好重要细胞，一具斗兽的尸体就能在几天之后创造出一只崭新的斗兽。\n\n"
#————————————先进近炸引信——————————————————————#
 artillery6:0 "先进近炸引信"
 artillery6_desc:0 "先进近炸引信会在和目标距离小于设定值时引爆装药，其适用于各类火炮炮弹，也可用于火箭弹。近期观察表明，近炸引信的致命性要比普通碰炸引信高五到十倍。"
#————————————生物武器——————————————————————————#
 WMDs_desc:0 "世界大战见证了以欧洲文明的标准来看极度残忍的武器的部署。化学武器、生物武器和活铁网都用在了战场上，无数年轻人因此丧命，而更多人则留下了心理创伤。"
 chemweapons_basic_1_desc:0 "世界大战展现了最基础化学复合物的威力，这已经足够让敌人呛死我们的士兵。战争正愈发迫近，我们需要对这些可怕又必要的基础化学武器进行恰当的研究。"
 chemweapons_basic_irritant_desc:0 "刺激性毒剂是最基本的化学武器，在上次大战期间就得到了广泛使用。已有的化学品就能刺激眼睛、嘴、皮肤和其他身体上的孔洞，我们的研究团队只需要对其进行武器化就可以了。刺激性毒剂在限制军事侵略上非常有用。"
 chemweapons_basic_choking_agent_desc:0 "呼吸是万物之本。夺走一个人的氧气，就是抹杀了他恢复的能力，而化学武器就非常适合这种抹杀。简单的复合毒剂就能让一整支大军喘不上气，踏不出半步。"
 chemweapons_basic_psychadelic_desc:0 "致幻剂既包括实验室制造的浓缩化学制剂，也包括曼陀罗花、氯胺酮和蘑菇等天然物质，它可以在不造成太多伤害的情况下让一支敌军失去战斗力。这些化学品可以滋养思维的黑暗面，让士兵们变得偏执而神志不清，展现出临床意义上的精神错乱症状。"
 chemweapons_advanced_irritant_desc:0 "化学毒剂的进一步发展就是准燃烧毒剂，它能产生一种粘连在受害者肺内的特殊化学烧伤。肺内的化学灼伤感足以让目标失去战斗力，而治疗这种化学武器袭击则需要数月时间。"
 chemweapons_advanced_choking_agent_desc:0 "会对组织或者财产造成糜烂或者腐蚀的化学品的只需与其他化学物质接触就能生效，比如氧气。我们的最新发明就采用这个原理，并将之整合入窒息性毒剂。吸入这种化学品会腐蚀人体氧气系统，让敌人缓慢而痛苦地死去。"
 chemweapons_advanced_psychadelic_desc:0 "自我也许是人体最重要的一个部分，它让我们成为我们，让我们在人群中与众不同。有了自我，人才是人。通过化学品，我们找到了一条能杀死自我的道路，至少在受试者身上能产生接近自杀的意愿，让他们既无法理解自己，也无法弄明白周围的世界。"
 chemweapons_paranoia_bomb_tech_desc:0 "人工诱导偏执（妄想）复合物是年复一年化学研究的结晶，是足以击碎思维的终极武器。这种化学品对受试者的刺激远超其他化学品。受害者感染后会感到极端痛苦，甚至丧失客观认知现实的能力。使用后留下的刺激性会存留很久，引发的严重偏执甚至能达到弹震症的地步。"
 chemweapons_melta_bomb_tech_desc:0 "C-X物质是一种强腐蚀性的化合物，一旦被吸入，受害者会感到自己正被从内到外地燃烧。在这期间，所有的关键器官都会慢慢被侵蚀，失去机能，直到受害者窒息而死。"
 chemweapons_mindbreaker_bomb_tech_desc:0 "化学物质带来的可不仅是恐怖那么简单。我们最近最近开发的19号人工自杀诱导剂证实了这一点，它能给士兵带来无与伦比的恐惧感。动物测试的结果是猪、马和犬类在实验后就尝试用房间内的任何东西结束自己的生命。人体实验结果相似，22名受试者无不尝试自杀，只有一人没能成功。"

 bioweapons_basic_1_desc:0 "流行病学仍然是很新奇的领域，但是微生物理论已经炙手可热。在实验室中建立合适的条件将会是我们迈向生物研究中最微观部分的第一步。"
 bioweapons_basic_2_desc:0 "随着实验室研究的继续，我们发现了可以加快大多数病毒培育过程的新方法。我们可以通过应用这些新知识来继续发掘传染病的奇妙性质。"
 bioweapons_basic_2_lab_desc:0 "对细菌和病毒的研究不断成熟，我们也创造出了处理这些危险事物的新方法。现在实验室内处理生物武器的方法已得到改进，我们可以深入研究，揭开这些谜团。"
 bioweapons_basic_2_grow_vats_desc:0 "病毒的培育可能漫长又乏味，有时需要花费数月，但我们只能等上几周。通过对人工培育研究的应用和寻找病毒培育的新方法，我们可以为特定病毒的繁育提供完美的环境。"
 bioweapons_basic_2_dispersal_desc:0 "如果我们要将上帝创造的大自然作为武器，我们首先要寻找在军事环境下散播致命疾病的最佳方法。借助飞机和特制弹头，我们可以将这些危险的微生物播撒在敌阵之中。"
 bioweapons_anthrax_desc:0 "炭疽杆菌是一种令人生厌的细菌。其初期症状和常规感冒无异，却能通过空气传播，轻易毁灭营级部队，如果未能得到治疗，致命率可达60%到80%。因为战场上难以提供治愈炭疽所需的复杂条件，一枚炭疽炸弹便可杀人如麻。"
 bioweapons_smallpox_desc:0 "天花是灭绝美洲印第安人的罪魁祸首，他们缺乏对这种旧世界疾病的免疫力。这也让一个可怕的问题浮出水面：如果我们能将其作为武器，用类似的方式攻击世界上其他人，那会发生什么？于是，生物工程部门创造出了超级天花，一种拥有90%致命率的天花毒株。"
 bioweapons_botulism_desc:0 "肉毒杆菌中毒是一种非常规的疾病，能使得受感染者在数天内动弹不得。这种疾病由能在空气和水中传播的肉毒杆菌引起。因此，受这种武器影响的地区可能会持续遭受几个月的损害。"
 bioweapons_Influenza_desc:0 "流感是一种具有高度传染性的疾病，非常适合作为生化武器使用。流感不是很致命，但其症状严重到足以让士兵失去战斗能力。然而，使用具有如此高传染性的疾病很容易失去控制，尤其是它很有可能在战斗中传播到我方阵地中去。"
 wmd_livewire_desc:0 "活铁网是一种残酷的武器，大战期间双方都有部署。通过生物工程和早期嵌合体实验，活铁网在伊比利亚和法国战线都有使用。和普通的铁丝网不同，活铁网会对外部刺激做出反应，比如说触碰铁网的可怜士兵会被铁网缠绕，而后如剃刀般锋利的铁网就如巨蟒一样，不断挤压其整个身体。"
#————————————飞机引擎——————————————————————————#
 air_teleforce_engine_desc:0 "采用由特斯拉提出的电磁加速理论，电磁加速引擎充分利用静电斥力，可发射远大于弹丸的武器。在此基础上开发的引擎可以让飞机翱翔天空，而不在需要内燃机。"
 air_teleforce_engine2:0 "重型电磁加速引擎"
 air_teleforce_engine2_desc:0 "采用由特斯拉提出的电磁加速理论，电磁加速引擎充分利用静电斥力，可发射远大于弹丸的武器。在此基础上开发的引擎可以让飞机翱翔天空，而不在需要内燃机。"
 air_rotary_engine_desc:0 "旋转叶片发动机基于荷兰发明家阿尔伯特·吉利斯·冯·鲍姆豪尔和与他相似天才的早期研究而开发，可以让我们制造一种新的飞行器，其能承受何旧型号都做不出来的危险机动。"
