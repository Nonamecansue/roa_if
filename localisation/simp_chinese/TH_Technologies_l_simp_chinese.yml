 field_kits3:0 "改良灵能补充剂"
 field_kits3_desc:0 "通过配发可食用性的灵能补充剂，每位士兵都能精神饱满地应战。"
 field_kits4:0 "强化水片"
 field_kits4_desc:0 "人体离不开水分，我们应保障为士兵提供质量最佳的饮用水。"
 field_kits6:"进阶压缩食品"
 field_kits6_desc:"压缩的单兵口粮不仅便于携带，而且能够满足士兵更高的能量需求。"
 field_kits7:"能量烈酒"
 field_kits7_desc:"一定的酒精刺激能够让我们的士兵缓解怯战情绪，有什么能比在上场杀敌之前的一碗烈酒更让人兴奋的吗。"
 


