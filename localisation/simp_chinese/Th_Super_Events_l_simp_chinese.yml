l_simp_chinese:
  maintheme:1 "Delightful Poetry"


  get_super_event_title:0 "-"

  SPEVNT_it_started:"序幕"
  SPEVNT_it_started_TEXT:"他们打开了一扇门，却未曾思考门后是什么————人们正是在这样的过程中走向进步。\n\n§O-格里丝-§!"
  SPEVNT_it_started_CLOSETEXT:"§O明日已至§!"

  SPEVNT_mistylake_war_1:"雾之湖战争"
  SPEVNT_mistylake_war_1_TEXT:"暴政的刀刃终会沾上暴君的污血。\n\n§O-芙莉.伊库尔-§!"
  SPEVNT_mistylake_war_1_CLOSETEXT:"§O红雾退散§!"

  SPEVNT_mistylake_war_2:"雾之湖战争"
  SPEVNT_mistylake_war_2_TEXT:"出生意味着死亡，而灭亡同样也意味着复兴。\n\n§O-雅克.达末儿-§!"
  SPEVNT_mistylake_war_2_CLOSETEXT:"§O恶魔丧钟§!"

  SPEVNT_mistylake_war_3:"雾之湖战争"
  SPEVNT_mistylake_war_3_TEXT:"胜利者不会被质疑他是否说了谎话。\n\n§O-克洛斯.哈摩尔-§!"
  SPEVNT_mistylake_war_3_CLOSETEXT:"§O雾之湖畔再染血色§!"

  SPEVNT_mistylake_war_4:"雾之湖战争"
  SPEVNT_mistylake_war_4_TEXT:"仇恨是任何种族最朴素的情感，它并非来自死去的亲人尸首与造成这一切的恶棍刽子手，而是一个智慧生命对残害与不公最本能的反映。\n\n§O-北进齐-§!"
  SPEVNT_mistylake_war_4_CLOSETEXT:"§R自作孽...§!"

  SPEVNT_godblessia_civil_war:"神佑内战"
  SPEVNT_godblessia_civil_war_TEXT:"胜利者书写历史？不，活下来的人才有资格忘记历史。\n\n§O-摩多罗隐岐奈-§!"
  SPEVNT_godblessia_civil_war_CLOSETEXT:"§O风云四起§"

  SPEVNT_mistymount_war_1:"妖怪山战争"
  SPEVNT_mistymount_war_1_TEXT:"一成不变的历史是走向灭亡的征兆。\n\n§O-宫出口介川-§!"
  SPEVNT_mistymount_war_1_CLOSETEXT:"§O自由在高歌§!"

  SPEVNT_mistymount_war_2:"妖怪山战争"
  SPEVNT_mistymount_war_2_TEXT:"要像灯塔一样，为一切不能在夜里航行的人，用火把把道路照明。。\n\n§O-外界某诗人-§!"
  SPEVNT_mistymount_war_2_CLOSETEXT:"§R新世界的啼鸣愈发临近§"

  SPEVNT_mistymount_war_3:"妖怪山战争"
  SPEVNT_mistymount_war_3_TEXT:"伟大的统帅应该每日自问数次，如果面前或左右出现敌人该怎么办？他若不知所措，就是不称职的。\n\n§O-拿破仑·波拿巴-§!"
  SPEVNT_mistymount_war_3_CLOSETEXT:"§O雄狮自立§"

  SPEVNT_mistymount_war_4:"妖怪山战争"
  SPEVNT_mistymount_war_4_TEXT:"残暴受到尊重，人们需要健康的恐惧。他们想害怕某人。他们想要有人吓唬他们，让他们战栗地服从。\n\n§O-恩斯特·罗姆-§!"
  SPEVNT_mistymount_war_4_CLOSETEXT:"§O硝烟弥漫妖怪山§"

  SPEVNT_mistylake_war_5:"雾之湖战争"
  SPEVNT_mistylake_war_5_TEXT:"要敲碎某人的美梦，就得先让他睡上一段时间。\n\n§O-十六夜咲夜-§!"
  SPEVNT_mistylake_war_5_CLOSETEXT:"§O噩梦再临§!"

  SPEVNT_mistylake_war_6:"雾之湖战争"
  SPEVNT_mistylake_war_6_TEXT:"信任别人很好，但是，不信任更好。\n\n§O-墨索里尼-§!"
  SPEVNT_mistylake_war_6_CLOSETEXT:"§O失去的，和从来没有的§!"

  SPEVNT_mistylake_war_7:"雾之湖战争"
  SPEVNT_mistylake_war_7_TEXT:"自然界是一个战争的世界；生物是战士，自然法则是利齿和利爪，而其他的都是错误。\n\n§O-蕾米莉亚.斯卡雷特-§!"
  SPEVNT_mistylake_war_7_CLOSETEXT:"§O红色恶魔翩翩起舞§!"

  SPEVNT_scarlet_collapse:"斯卡雷特崩溃"
  SPEVNT_scarlet_collapse_TEXT:"民族革命不是暴力行为、骚乱，而是前进的思想。所有真正的民族革命都建立在建筑之上，而不是倒塌之上。\n\n§O-扬·安东内斯库-§!"
  SPEVNT_scarlet_collapse_CLOSETEXT:"§O恶魔尖叫着堕入炼狱当中§!"

  SPEVNT_gegokujyoist_march:"下克上主义者的进军"
  SPEVNT_gegokujyoist_march_TEXT:"被政府统治就是被没有智慧和美德的人看管、检查、监视、管理……这就是政府，这就是它的公正！\n\n§O-米哈伊尔.巴枯宁-§!"
  SPEVNT_gegokujyoist_march_CLOSETEXT:"§O没有主子....§!"

  SPEVNT_soviet_mistylake_established:"雾之湖联盟成立"
  SPEVNT_soviet_mistylake_established_TEXT:"哲学家们以各种方式解释世界，然而，关键是要改变它。\n\n§O-卡尔.马克思-§!"
  SPEVNT_soviet_mistylake_established_CLOSETEXT:"§O敬革命！§!"

  SPEVNT_mistymount_war_5:"妖怪山战争"
  SPEVNT_mistymount_war_5_TEXT:"我对进步无话可说，正如进步对我无话可说那样\n\n§O-八坂神奈子-§!"
  SPEVNT_mistymount_war_5_CLOSETEXT:"§O神圣而庄严...§"

  SPEVNT_mistymount_war_6:"妖怪山战争"
  SPEVNT_mistymount_war_6_TEXT:"对神明的信仰，对妖怪的恐惧，一同为幻想乡不可或缺之根基，而企图抹去它们的任何行为，都是对乐园与秩序的谋杀。\n\n§O-八云紫-§!"
  SPEVNT_mistymount_war_6_CLOSETEXT:"§O神威再临§"

  SPEVNT_human_tsukumo_war:"大乐律战争"
  SPEVNT_human_tsukumo_war_TEXT:"今天，我们站在这里，站在洒满被压迫者热血的土地上；明天，我们就要登上楼门，站在横竖着侵略者尸首的土地上。\n\n§O-堀川雷鼓-§!"
  SPEVNT_human_tsukumo_war_CLOSETEXT:"§O战或死，奴役或自由§"

  SPEVNT_human_tsukumo_war_2:"大乐律战争"
  SPEVNT_human_tsukumo_war_2_TEXT:"捍卫付丧神国家的独立解放应当是任何人义不容辞之义务，以我为首的每一位爱国者都将为之战斗到最后一刻。\n\n§O-堀川雷鼓-§!"
  SPEVNT_human_tsukumo_war_2_CLOSETEXT:"§O洪水滔天§"


  SPEVNT_southland_war_1:"东南战争"
  SPEVNT_southland_war_1_TEXT:"任何还有脑子都人都应当知道，一张轻薄的废纸可换不来真正的和平。\n\n§O-冈崎梦美-§!"
  SPEVNT_southland_war_1_CLOSETEXT:"再无余地"

  SPEVNT_southland_war_2:"东南战争"
  SPEVNT_southland_war_2_TEXT:"同情弱者是对大自然最大的不敬。\n\n§O-阿道夫.希特勒-§!"
  SPEVNT_southland_war_2_CLOSETEXT:"妖怪之行军"

  SPEVNT_southland_war_3:"东南战争"
  SPEVNT_southland_war_3_TEXT:"从来不会有真正原谅你罪过的人，只要还有有机会，曾经的受害者就会以变本加厉的方式将这一切再次奉还。\n\n§O-高木天开-§!"
  SPEVNT_southland_war_3_CLOSETEXT:"杜绝后患"

  SPEVNT_southland_war_4:"东南战争"
  SPEVNT_southland_war_4_TEXT:"在历史的长河中，每个人都是一滴水，但每滴水都在推动历史的前进。\n\n§O-罗莎.卢森堡-§!"
  SPEVNT_southland_war_4_CLOSETEXT:"革命雄鹰在翱翔"

  SPEVNT_southland_war_5:"东南战争"
  SPEVNT_southland_war_5_TEXT:"要使革命到来，单是‘下层不愿’照旧生活下去、寻求改变通常是不够的，还需要‘上层不能’照旧生活和统治下去。\n\n§O-弗拉基米尔.列宁-§!"
  SPEVNT_southland_war_5_CLOSETEXT:"击碎锁链"

  SPEVNT_southland_war_6:"东南战争"
  SPEVNT_southland_war_6_TEXT:"真理由炮火与恐怖构筑，正是如此才无人能够撼动它的根基。\n\n§O-高歌奏凯-§!"
  SPEVNT_southland_war_6_CLOSETEXT:"血色残阳自人间升起"

  SPEVNT_southland_war_7:"§R复权战争§!"
  SPEVNT_southland_war_7_TEXT:"我们要不得虚伪的同情，只有血与土才能证明，谁有资格拥有智慧。\n\n§O-北进介-§!"
  SPEVNT_southland_war_7_CLOSETEXT:"§R灾厄重生§!"

  SPEVNT_southland_war_8:"§R复权战争§!"
  SPEVNT_southland_war_8_TEXT:"能够生存下来的物种，并不是那些最强壮的，也不是那些最聪明的，而是那些对变化作出快速反应的。\n\n§O-查尔斯.达尔文-§!"
  SPEVNT_southland_war_8_CLOSETEXT:"§R对自然的声明§!"

  SPEVNT_southland_war_9:"§R复权战争§!"
  SPEVNT_southland_war_9_TEXT:"即使是最美丽的花朵，终究也要凋零，而花瓣将被风吹散，留下的只有空荡的枝条。\n\n§O-汉斯.安徒生-§!"
  SPEVNT_southland_war_9_CLOSETEXT:"§P死刑判决§!"

  SPEVNT_all_gone:"§P诀别§!"
  SPEVNT_all_gone_TEXT:"和绝望好好相处吧。\n\n§R-未知-§!"
  SPEVNT_all_gone_CLOSETEXT:"§P九泉之下§!"

  
